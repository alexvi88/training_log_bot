// ── СПОРТПИТ ─────────────────────────────────────────────────────────────────
const ITEM_TYPES = {
  shaker:     { pts: 10, color: '#e94f64', label: tr('itemShaker') },
  bar:        { pts: 25, color: C_GOLD,   label: tr('itemBar') },
  creatine:   { pts: 0,  color: '#7ea8ff', label: tr('itemCreatine'), power: 'shield' },
  preworkout: { pts: 0,  color: C_RAGE,   label: tr('itemPreworkout'), power: 'rage' },
  gainer:     { pts: 0,  color: '#67c26a', label: tr('itemGainer'), power: 'magnet' },
};
const items = [];
let nextItemAt = 140;
function spawnItems() {
  // Свободные награды не пересекаются с препятствиями: если у правого края
  // уже спавнится преграда, дорожка вела бы прямо в неё — переносим попытку.
  if (obstacles.some(o => o.x > W - 180 * SK)) { nextItemAt = dist + 12; return; }
  const r = Math.random();
  // Щит — редкая подстраховка, не рутинная: было 14% на каждый спавн награды,
  // теперь втрое реже (~5%). Остальные веса (предтрен/гейнер/батончики/обычные)
  // сохраняют прежнюю ширину диапазона, просто сдвинуты.
  if (r < 0.05) items.push(mkItem('creatine', W + 60 * SK, GROUND() - 120 * SK));
  else if (r < 0.16) items.push(mkItem('preworkout', W + 60 * SK, GROUND() - 150 * SK));
  else if (r < 0.25) items.push(mkItem('gainer', W + 60 * SK, GROUND() - 100 * SK));
  else if (r < 0.39) {
    // Верхний ярус: достаётся только двойным прыжком, поэтому и награда
    // жирнее — батончики вместо шейкеров.
    for (let i = 0; i < 3; i++) items.push(mkItem('bar', W + 60 * SK + i * 58 * SK, GROUND() - 240 * SK));
  } else {
    const n = 4 + Math.floor(rnd(0, 3)), arc = Math.random() < 0.5;
    const barMix = Math.random() < 0.3;
    for (let i = 0; i < n; i++) {
      const y = arc ? GROUND() - 80 * SK - Math.sin(i / (n - 1) * Math.PI) * 80 * SK : GROUND() - 64 * SK;
      const type = (barMix && i === Math.floor(n / 2)) ? 'bar' : 'shaker';
      items.push(mkItem(type, W + 60 * SK + i * 54 * SK, y));
    }
  }
  // Та же волна ритма, что и у препятствий (см. paceFactor), но зеркально:
  // на передышке награды идут гуще, на плотном участке — реже, чтобы
  // «передышка с бонусами» была не только про пустоту, а про добычу.
  nextItemAt = dist + rnd(28, 60) * (0.7 + 0.5 * paceFactor());
}
function mkItem(type, x, y) { return { type, x, y, t: rnd(0, 6) }; }
// Пять типов спортпита — каждый со своим силуэтом и цветом, а не одинаковый
// квадратик: шейкер (цилиндр+крышка), батончик (обёртка с крутками), креатин
// (пакет-саше на молнии), предтреник (банка с зигзагом-«разрядом»), гейнер
// (широкая банка со скотчем). Жирный тёмный контур — как у препятствий.
function drawItem(it) {
  const d = ITEM_TYPES[it.type];
  const bob = Math.sin(it.t * 4) * 4 * SI;
  ctx.save(); ctx.translate(it.x, it.y + bob); ctx.scale(SI, SI);
  // Холодный зелёно-мятный ореол — «безопасно, подбери» — общий признак ЛЮБОГО
  // подбираемого предмета, зеркальный по смыслу тёплому красно-оранжевому
  // ореолу препятствий (см. obstacleHalo): один и тот же приём рассеянного
  // светового пятна, но противоположный по температуре, чтобы препятствие и
  // награда не читались одним и тем же «светлым пятном в темноте», как раньше.
  const ihg = ctx.createRadialGradient(0, 0, 1, 0, 0, 26);
  ihg.addColorStop(0, 'rgba(120,255,196,0.40)');
  ihg.addColorStop(0.6, 'rgba(120,255,196,0.16)');
  ihg.addColorStop(1, 'rgba(120,255,196,0)');
  ctx.fillStyle = ihg;
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill();
  if (it.type === 'shaker') {
    ctx.beginPath(); ctx.roundRect(-9, -12, 18, 26, 3); fillStroke(d.color);
    ctx.fillStyle = '#b93b4e'; ctx.fillRect(-9, -2, 18, 4);
    ctx.beginPath(); ctx.roundRect(-10, -19, 20, 8, 2); fillStroke('#2b2b33');
    ctx.fillStyle = '#2b2b33'; ctx.fillRect(-4, -24, 8, 6);
  } else if (it.type === 'bar') {
    ctx.rotate(-0.2);
    ctx.beginPath(); ctx.roundRect(-16, -8, 32, 16, 3); fillStroke(d.color);
    ctx.fillStyle = '#c79a20'; ctx.fillRect(-16, -8, 8, 16); ctx.fillRect(8, -8, 8, 16);
    // крутки обёртки по бокам
    ctx.strokeStyle = 'rgba(20,17,15,0.7)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-20, 0); ctx.lineTo(-16, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16, -8); ctx.lineTo(20, 0); ctx.lineTo(16, 8); ctx.stroke();
    ctx.fillStyle = '#14110f'; ctx.font = "900 8px 'Courier New', monospace"; ctx.textAlign = 'center'; ctx.fillText('PRO', 0, 3);
  } else if (it.type === 'creatine') {
    // Саше-пакет с молнией сверху — приплюснутая трапеция, а не прямоугольник.
    ctx.beginPath();
    ctx.moveTo(-12, 14); ctx.lineTo(-10, -14); ctx.lineTo(10, -14); ctx.lineTo(12, 14); ctx.closePath();
    fillStroke(d.color);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(-8, -10, 4, 20);
    ctx.fillStyle = '#3a5fb0'; ctx.fillRect(-10, -16, 20, 5);
    ctx.fillStyle = CHALK; ctx.font = "900 6.5px 'Courier New', monospace"; ctx.textAlign = 'center';
    ctx.fillText(d.label, 0, 6);
  } else if (it.type === 'preworkout') {
    // Банка предтреника с молнией-разрядом на этикетке — «энергия».
    ctx.beginPath(); ctx.roundRect(-10, -15, 20, 30, 4); fillStroke(d.color);
    ctx.fillStyle = '#14110f'; ctx.fillRect(-10, -15, 20, 6);
    ctx.fillStyle = CHALK;
    ctx.beginPath(); ctx.moveTo(-1, -6); ctx.lineTo(3, -6); ctx.lineTo(-2, 2); ctx.lineTo(2, 2); ctx.lineTo(-4, 12); ctx.lineTo(-2, 3); ctx.lineTo(-6, 3); ctx.closePath(); ctx.fill();
  } else {
    // Гейнер: широкая банка с ободком-крышкой сверху — самый крупный сосуд из пяти.
    ctx.beginPath(); ctx.roundRect(-14, -17, 28, 34, 5); fillStroke(d.color);
    ctx.fillStyle = '#2f3d30'; ctx.fillRect(-14, -17, 28, 7);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(-14, -8, 28, 5);
    ctx.fillStyle = CHALK; ctx.font = "900 6.5px 'Courier New', monospace"; ctx.textAlign = 'center';
    ctx.fillText(d.label, 0, 11);
  }
  if (d.power) {
    ctx.strokeStyle = d.color; ctx.globalAlpha = 0.5 + 0.4 * Math.sin(it.t * 6);
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

// ── ЧАСТИЦЫ И ТОСТЫ ─────────────────────────────────────────────────────────
const parts = [];
function burst(x, y, color, n = 10, sp = 180) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(sp * 0.3, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rnd(0.3, 0.7), color, r: rnd(2, 4) });
  }
}
const toasts = [];
function toast(text, color, x, y) {
  toasts.push({ text, color, t: 0, x: x ?? P.x, y: y ?? P.y - P.h - 30, life: 1.2 });
}
// Крупный «удар» текста — контрольные точки, победа над боссом, финиш: то же,
// что toast(), но заметно крупнее, с толстой тёмной обводкой (читается на
// любом фоне без подложки) и коротким пружинным попаданием на старте, а не
// плоским появлением — момент должен ЧУВСТВОВАТЬСЯ, а не проскакивать мимо.
function bigPop(text, color, x, y) {
  toasts.push({ text, color, t: 0, x: x ?? W / 2, y: y ?? H * 0.32, life: 1.5, big: true });
}

// ── ИГРОК ────────────────────────────────────────────────────────────────────
function playerBox() {
  const sliding = P.slideT > 0;
  const h = sliding ? 30 * SK : P.h, w = P.w;
  return { x: P.x - w / 2 + 4 * SKW, y: P.y - h, w: w - 8 * SKW, h: h - 4 * SK };
}
// roundRect есть не во всех вебвью — мягкий полифилл
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.round(((n >> 16) & 255) * k) + ',' + Math.round(((n >> 8) & 255) * k) + ',' + Math.round((n & 255) * k) + ')';
}
function limb(c, pts, w, color) {
  c.strokeStyle = color; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.stroke();
}
function drawShoe(c, x, y, dark) {
  c.save(); c.translate(x, y);
  c.fillStyle = dark ? '#3f434c' : '#565b66';
  c.beginPath(); c.roundRect(-5, -4, 14, 7, 3); c.fill();
  c.fillStyle = dark ? 'rgba(230,230,235,0.45)' : 'rgba(230,230,235,0.85)';
  c.fillRect(-5, 1, 14, 2);
  c.restore();
}
function drawHead(c, f, hx, hy) {
  const skinD = shade(f.skin, 0.78);
  // череп + челюсть
  c.fillStyle = f.skin;
  c.beginPath(); c.arc(hx, hy, 7.5, 0, 7); c.fill();
  c.beginPath(); c.moveTo(hx + 6.5, hy - 2); c.lineTo(hx + 9.5, hy + 1.5); c.lineTo(hx + 5, hy + 5.5); c.lineTo(hx - 1, hy + 5.5); c.closePath(); c.fill();
  // ухо (у борца — сломанное, крупнее и краснее), глаз, бровь
  c.fillStyle = f.ears ? '#c98a7a' : skinD;
  c.beginPath(); c.arc(hx - 1, hy + 1, f.ears ? 2.7 : 2, 0, 7); c.fill();
  c.fillStyle = '#1d1d22'; c.fillRect(hx + 4.5, hy - 1.5, 1.8, 1.8);
  c.fillRect(hx + 3.5, hy - 4, 4.2, 1.4);
  // причёска / убор
  if (f.head === 'bandana') {
    c.fillStyle = f.acc;
    c.beginPath(); c.arc(hx, hy - 0.5, 7.8, Math.PI * 0.97, Math.PI * 2.03); c.fill();
    c.fillRect(hx - 8, hy - 3.5, 16.2, 3);
    c.beginPath(); c.moveTo(hx - 7, hy - 2); c.lineTo(hx - 13, hy + 3); c.lineTo(hx - 8, hy + 3.5); c.closePath(); c.fill();
    c.fillStyle = shade(f.acc, 0.7); c.fillRect(hx - 8, hy - 1.2, 16.2, 0.9);
    // щетина
    c.fillStyle = 'rgba(40,30,22,0.35)';
    c.beginPath(); c.arc(hx + 3.5, hy + 4, 4.4, 0.2, Math.PI * 0.95); c.fill();
  } else if (f.head === 'headband') {
    c.fillStyle = f.hair;
    c.beginPath(); c.arc(hx, hy - 1, 7.7, Math.PI * 0.95, Math.PI * 2.05); c.fill();
    c.fillStyle = f.acc; c.fillRect(hx - 8, hy - 4.5, 16, 2.6);
  } else if (f.head === 'beanie') {
    c.fillStyle = f.acc;
    c.beginPath(); c.arc(hx, hy - 1.5, 7.9, Math.PI * 0.93, Math.PI * 2.07); c.fill();
    c.fillRect(hx - 8.2, hy - 4, 16.4, 3.2);
    c.fillStyle = shade(f.acc, 0.75); c.fillRect(hx - 8.2, hy - 1.4, 16.4, 0.8);
    // борода
    c.fillStyle = f.hair;
    c.beginPath(); c.moveTo(hx + 8.5, hy); c.quadraticCurveTo(hx + 9, hy + 8, hx + 3, hy + 9);
    c.quadraticCurveTo(hx - 1, hy + 8, hx - 1, hy + 4); c.lineTo(hx + 4, hy + 3); c.closePath(); c.fill();
  } else if (f.head === 'short') {
    // короткая стрижка с чётким контуром
    c.fillStyle = f.hair;
    c.beginPath(); c.arc(hx, hy - 1, 7.8, Math.PI * 0.93, Math.PI * 1.97); c.fill();
    c.fillRect(hx - 7.8, hy - 2.5, 5, 3.5);
  }
}
// Рисует атлета в контекст c: используется и в игре, и на карточках выбора.
// Ориентация — бежит вправо, начало координат в точке опоры. Осанка прямая,
// мышечные объёмы отдельными формами: дельта, бицепс, икра, V-образный торс.
function drawAthlete(c, fighter, opts) {
  const { sliding = false, run = 0, rage = false, shield = false, scale = 1, idle = false, outline = false } = opts || {};
  // Принимает и ключ из FIGHTERS (игрок), и готовый объект палитры напрямую
  // (вышибала — RIVAL_SKIN, не входит в выбираемых персонажей).
  const f = typeof fighter === 'string' ? FIGHTERS[fighter] : fighter;
  const B = f.bulk || 1;
  const torsoCol = (f.shirtless || f.singlet) ? f.skin : f.top;
  const torsoD = shade(torsoCol, 0.78);
  const skinD = shade(f.skin, 0.78);
  c.save(); c.scale(scale, scale);
  // Жирный тёмный контур по силуэту — самый заметный объект кадра должен
  // читаться на любом фоне (неон/подвал/улица). Тень от всех залитых форм
  // при таком смещении и цвете складывается в контур вокруг фигуры целиком.
  if (outline) { c.shadowColor = 'rgba(10,7,5,0.9)'; c.shadowBlur = 5; c.shadowOffsetX = 0; c.shadowOffsetY = 0; }
  if (rage) {
    c.fillStyle = 'rgba(255,90,54,0.22)';
    for (let i = 1; i <= 3; i++) c.fillRect(-17 - i * 14, -58 + i * 5, 34, 52 - i * 8);
  }
  if (sliding) {
    // подкат: корпус откинут назад, ноги вперёд
    limb(c, [-4, -16, 10, -13, 24, -8], 8.5 * B, skinD);
    drawShoe(c, 27, -7, true);
    c.fillStyle = f.bottom; c.beginPath(); c.roundRect(-13, -23, 15, 12, 5); c.fill();
    limb(c, [-7, -18, -19, -30], 15 * B, torsoCol);
    limb(c, [-17, -28, -6, -20, 2, -25], 7 * B, f.skin);
    limb(c, [-3, -15, 13, -11, 28, -6], 9 * B, f.skin);
    drawShoe(c, 31, -5, false);
    drawHead(c, f, -21, -38);
  } else {
    const s = idle ? 0 : run; // -1..1
    const stance = idle ? 1 : 0; // стоя на карточке — ноги на ширине, руки чуть от корпуса
    const leg = (side, col, dark) => {
      const sw = side * s;
      const hipX = side * 2 * (1 + stance), hipY = -33;
      const kneeX = hipX + sw * 10 + stance * side * 2, kneeY = -17;
      const footX = kneeX + sw * 9 + 1 + stance * side * 2, footY = -4 - Math.max(0, -sw) * 7;
      limb(c, [hipX, hipY, kneeX, kneeY, footX, footY], 10 * B, col);
      // икра
      c.fillStyle = col; c.beginPath(); c.arc(kneeX - 2, kneeY + 3.5, 3.6 * B, 0, 7); c.fill();
      drawShoe(c, footX + 2, footY + 2, dark);
    };
    const arm = (side, col) => {
      const aw = idle ? side * 0.30 : -side * s;
      const shX = side > 0 ? 9 : -7, shY = -52;
      const elX = shX + aw * 9, elY = shY + 13;
      const haX = elX + aw * 10 + 2, haY = elY + 9 - Math.abs(aw) * 3;
      limb(c, [shX, shY, elX, elY, haX, haY], 8.5 * B, col);      // плечо
      limb(c, [elX, elY, haX, haY], 6 * B, col);                  // предплечье тоньше
      // бицепс и дельта отдельными объёмами
      c.fillStyle = col;
      c.beginPath(); c.arc((shX + elX) / 2 + aw * 1.5, (shY + elY) / 2, 4.2 * B, 0, 7); c.fill();
      c.beginPath(); c.arc(shX, shY - 1.5, 5.4 * B, 0, 7); c.fill();
    };
    leg(-1, skinD, true);
    arm(-1, skinD);
    // шорты
    c.fillStyle = f.bottom;
    c.beginPath(); c.roundRect(-9 * B, -37, 18 * B, 14, 5); c.fill();
    c.fillStyle = shade(f.bottom, 0.72); c.fillRect(-9 * B, -37, 6 * B, 14);
    // торс: V-образный, плечи заметно шире талии, осанка прямая
    c.fillStyle = torsoCol;
    c.beginPath();
    c.moveTo(-8 * B, -33);
    c.quadraticCurveTo(-13 * B, -44, -14 * B, -54);
    c.quadraticCurveTo(-6, -61, 3, -61);
    c.quadraticCurveTo(14 * B, -58, 15 * B, -53);
    c.quadraticCurveTo(12 * B, -44, 9 * B, -33);
    c.closePath(); c.fill();
    // тень по спине
    c.fillStyle = torsoD;
    c.beginPath();
    c.moveTo(-8 * B, -33);
    c.quadraticCurveTo(-13 * B, -44, -14 * B, -54);
    c.quadraticCurveTo(-10 * B, -57, -6 * B, -57.5);
    c.quadraticCurveTo(-8 * B, -44, -4 * B, -33);
    c.closePath(); c.fill();
    // грудная линия
    c.strokeStyle = shade(torsoCol, 0.7); c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(2, -53); c.quadraticCurveTo(9 * B, -52, 12 * B, -48); c.stroke();
    if (f.singlet) {
      // борцовское трико: сплошная нижняя часть + лямки через плечи
      c.fillStyle = f.top;
      c.beginPath();
      c.moveTo(-8.6 * B, -33);
      c.quadraticCurveTo(-12 * B, -42, -12.3 * B, -47);
      c.lineTo(12.8 * B, -47);
      c.quadraticCurveTo(11.5 * B, -42, 9.6 * B, -33);
      c.closePath(); c.fill();
      c.strokeStyle = f.top; c.lineWidth = 4.2 * B; c.lineCap = 'butt';
      c.beginPath(); c.moveTo(9 * B, -47); c.lineTo(12.5 * B, -55); c.stroke();
      c.beginPath(); c.moveTo(-7 * B, -47); c.lineTo(-11 * B, -55); c.stroke();
      c.lineCap = 'round';
    } else if (f.shirtless) {
      // пресс
      c.strokeStyle = shade(f.skin, 0.72); c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(3, -46); c.lineTo(3, -35); c.stroke();
      c.beginPath(); c.moveTo(-1, -43); c.lineTo(7, -43); c.stroke();
      c.beginPath(); c.moveTo(-1, -39); c.lineTo(7, -39); c.stroke();
    } else {
      // вырез майки
      c.fillStyle = f.skin;
      c.beginPath(); c.moveTo(0, -61); c.lineTo(9 * B, -56); c.quadraticCurveTo(6, -50, 2, -53); c.closePath(); c.fill();
    }
    // пояс пауэрлифтера
    if (f.belt) {
      c.fillStyle = f.acc; c.fillRect(-9 * B, -39, 18 * B, 5.5);
      c.fillStyle = shade(f.acc, 0.65); c.fillRect(0, -39, 4.5, 5.5);
    }
    leg(1, f.skin, false);
    // шея — толстая, голова прямо над корпусом
    limb(c, [2, -58, 2, -64], 7 * B, f.skin);
    drawHead(c, f, 3, -67);
    arm(1, f.skin);
  }
  if (shield) {
    c.strokeStyle = '#7ea8ff'; c.lineWidth = 2.5; c.globalAlpha = 0.6 + 0.3 * Math.sin(t * 8);
    c.beginPath(); c.arc(0, -34, 44, 0, 7); c.stroke(); c.globalAlpha = 1;
  }
  c.restore();
}
// Верхушка двойного прыжка (особенно если он взят почти у пика первого) может
// в игровых координатах уйти заметно выше того, что помещается в кадр над
// HUD — сама механика (vy/гравитация) от этого не меняется ни на пиксель,
// коллизии считаются по настоящему P.y как и раньше (см. update/obstacleBox).
// Здесь ограничиваем только ОТРИСОВКУ: выше этой линии экрана фигура рисуется
// «зависшей» — визуальная точка опоры перестаёт подниматься дальше, хотя
// P.y продолжает расти как обычно, и как только реальный P.y возвращается
// ниже отметки, отрисовка плавно (без скачка) продолжает следовать за ним.
// Обычный одиночный и типичный двойной прыжок до этой отметки не долетают —
// подрезка касается только редкого «прыжка на пике прыжка».
// Считаем от высоты кадра, а не абсолютным числом: 275px были подобраны под
// один конкретный экран и под прежний (более крупный) SK, на низком экране эта
// линия оказывалась ниже верхушки обычного прыжка.
const PLAYER_VISUAL_MIN_Y = Math.max(120, H * 0.34);
function playerRenderY() { return Math.max(P.y, PLAYER_VISUAL_MIN_Y); }
function drawPlayer() {
  const ry = playerRenderY();
  ctx.save(); ctx.translate(P.x, ry);
  // Тень под ногами — крупнее и темнее нового масштаба, сжимается в прыжке
  // пропорционально высоте отрыва от земли (см. ниже drawShadow). Считаем от
  // той же отрисовочной высоты ry, чтобы тень не «отставала» от подрезанной фигуры.
  drawShadow(GROUND() - ry, SK);
  drawAthlete(ctx, selectedFighter, {
    sliding: P.slideT > 0,
    run: P.onGround ? Math.sin(P.runPhase * 14) : 0.4,
    rage: P.rageT > 0,
    shield: P.shield,
    scale: SK,
    outline: true,
  });
  ctx.restore();
}
// Тень: эллипс, который сжимается и бледнеет с высотой отрыва airH (px).
function drawShadow(airH, scale) {
  const k = Math.max(0.28, 1 - airH / (260 * scale));
  ctx.save();
  ctx.globalAlpha = 0.4 * k;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 3, 20 * scale * k, 6 * scale * k, 0, 0, 7);
  ctx.fill();
  ctx.restore();
}

// ── УПРАВЛЕНИЕ ──────────────────────────────────────────────────────────────
function jump() {
  if (!running) return;
  if (P.slideT > 0) P.slideT = 0;
  // vy и гравитация (см. update()) масштабированы одним и тем же SK — апекс
  // прыжка растёт в SK раз, а время полёта не меняется (v/g тот же), поэтому
  // горизонтальный охват прыжка и синхронизация с препятствиями не сбились.
  if (P.onGround) { P.vy = -870 * SK; P.onGround = false; P.jumps = 1; sJump(); }
  else if (P.jumps < 2) { P.vy = -760 * SK; P.jumps = 2; sDouble(); burst(P.x, P.y - 10, 'rgba(242,237,227,0.8)', 6, 120); }
}
function slide() {
  if (!running) return;
  // Длительность от скорости, а не константа: подкат должен покрывать длину
  // стойки (масштабированной на SK) на любой скорости. С фиксированными 0.62 с на
  // стартовой скорости игрок вставал ровно под перекладиной — гарантированная смерть.
  if (P.onGround) P.slideT = Math.min(1.5, Math.max(0.5, 330 * SK / Math.max(120, speed)));
  else { P.vy = Math.max(P.vy, 900 * SK); P.slideT = 0.5; }
}
let touchY = null, touchT = 0, touchJumped = false;
cv.addEventListener('pointerdown', e => {
  touchY = e.clientY; touchT = performance.now();
  // Прыжок сразу по касанию — иначе он ощущается вязким. Свайп вниз этот
  // прыжок отменяет: см. ниже.
  touchJumped = running && P.onGround;
  jump();
});
cv.addEventListener('pointermove', e => {
  if (touchY === null || e.clientY - touchY <= 46 || performance.now() - touchT >= 350) return;
  // Тот же тап уже поднял атлета в воздух, и подкат превратился бы в быстрое
  // падение — под перекладину он так не проедет. Возвращаем на землю и
  // делаем честный подкат.
  if (touchJumped && !P.onGround && P.jumps <= 1) {
    P.y = GROUND(); P.vy = 0; P.onGround = true; P.jumps = 0;
  }
  slide();
  touchY = null; touchJumped = false;
});
cv.addEventListener('pointerup', () => { touchY = null; touchJumped = false; });
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slide(); }
  if (e.code === 'KeyM') muted = !muted;
});

// ── ЭКРАНЫ (как у совы) ─────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  cv.classList.remove('active');
  if (id === 'game') cv.classList.add('active');
  else document.getElementById(id).classList.add('active');
}
function flash(color) {
  const el = document.getElementById('flash');
  el.className = color; el.style.opacity = 1;
  setTimeout(() => { el.style.opacity = 0; }, 200);
}

// Портрет качка — тот же векторный атлет, что бежит в забеге. Раньше поверх
// него подгружалась фотореалистичная картинка из assets/game/<key>.jpg, и в
// игре жили ДВА разных персонажа: на карточке выбора и на экране итога —
// нарисованный «под фото» мужик, на дорожке — минималистичный вектор. Теперь
// один и тот же силуэт везде: выбор, провал, финиш.
function fighterPortrait(key, px) {
  const c = document.createElement('canvas');
  c.width = px; c.height = px;
  const cc = c.getContext('2d');
  // Кадрирование: фигура по центру, стопы чуть выше нижнего края, над головой
  // остаётся воздух — иначе на маленькой карточке подошвы и макушка режутся
  // рамкой (высота отрисовки атлета ≈ 75px * scale вверх от точки опоры).
  cc.translate(px * 0.47, px * 0.9);
  drawAthlete(cc, key, { idle: true, scale: 1.6 * px / 160, outline: true });
  return c;
}
(function buildFighterCards() {
  const row = document.getElementById('fighters-row');
  Object.entries(FIGHTERS).forEach(([key, f]) => {
    const card = document.createElement('div');
    card.className = 'fighter-card';
    card.appendChild(fighterPortrait(key, 200));
    const nm = document.createElement('div');
    nm.className = 'fighter-name'; nm.textContent = f.name;
    card.appendChild(nm);
    const tag = document.createElement('div');
    tag.className = 'fighter-tag'; tag.textContent = f.tag;
    card.appendChild(tag);
    card.onclick = () => selectFighter(key);
    row.appendChild(card);
  });
})();

function selectFighter(key) {
  selectedFighter = key;
  resetGame();
  running = true;
  showScreen('game');
}

// ── КОНЕЦ ЗАБЕГА ────────────────────────────────────────────────────────────
function die() {
  running = false; sDie(); addShake(SHAKE_MAX); addHitStop(0.09); flash('red');
  burst(P.x, P.y - 30 * SK, C_RAGE, 28, 320);
  const d = Math.floor(dist);
  if (d > best) { best = d; localStorage.setItem('gymrun_best', best); }
  lastResult = {
    distance: d, score, fighter: selectedFighter,
    best, maxCombo, pickups, gameTimestamp: Date.now(),
  };
  // Тот же векторный атлет, что и на карточке выбора (см. fighterPortrait).
  const art = document.getElementById('result-art');
  art.src = fighterPortrait(selectedFighter, 208).toDataURL();
  art.style.display = 'block';
  document.getElementById('result-score').textContent = d + ' ' + tr('unit') + ' · 🥤 ' + score;
  document.getElementById('result-stats').textContent =
    tr('resultStats') + maxCombo + tr('resultStatsPickups') + pickups;
  // «ПРИВЕТ АТЛЕТ! »/«HEY ATHLETE! » — брендовая формула, имя не подставляем (см. TONE_OF_VOICE.md)
  document.getElementById('result-quip').textContent = tr('greeting') + d + pick(QUIPS);
  document.getElementById('result-best').textContent = tr('resultBest') + best + ' ' + tr('unit');
  document.getElementById('result-status').textContent = '';
  setTimeout(() => showScreen('screen-result'), 900);
}

// Забег выигран: дистанция дошла до FINISH_DIST живым — не рядовая смерть,
// самый сочный момент в игре, поэтому отдача заметно крупнее обычного
// столкновения (см. die()): золотой залп партиклов, полновесный хит-стоп,
// вспышка и большой попап прямо на канвасе, ДО перехода на победный экран.
function winRun() {
  if (finished) return;
  finished = true; running = false;
  sPower(); addShake(SHAKE_MAX); addHitStop(0.16); flash('gold');
  bigPop(tr('winTitle'), C_GOLD, W / 2, H * 0.36);
  for (let k = 0; k < 3; k++) burst(P.x + k * 10, P.y - 30 * SK - k * 20, C_GOLD, 34, 420);
  burst(P.x, P.y - 60 * SK, '#fff6d8', 20, 300);
  const d = Math.floor(dist);
  if (d > best) { best = d; localStorage.setItem('gymrun_best', best); }
  lastResult = {
    distance: d, score, fighter: selectedFighter,
    best, maxCombo, pickups, gameTimestamp: Date.now(), won: true,
  };
  const art = document.getElementById('win-art');
  art.src = fighterPortrait(selectedFighter, 208).toDataURL();
  art.style.display = 'block';
  document.getElementById('win-score').textContent = d + ' ' + tr('unit') + ' · 🥤 ' + score;
  document.getElementById('win-stats').textContent =
    tr('resultStats') + maxCombo + tr('resultStatsPickups') + pickups;
  // «ПРИВЕТ АТЛЕТ! »/«HEY ATHLETE! » — брендовая формула, имя не подставляем (см. TONE_OF_VOICE.md)
  document.getElementById('win-quip').textContent = tr('greeting') + d + pick(WIN_QUIPS);
  document.getElementById('win-best').textContent = tr('resultBest') + best + ' ' + tr('unit');
  document.getElementById('win-status').textContent = '';
  setTimeout(() => showScreen('screen-win'), 850);
}

// «Бежать дальше»: рекордсмену не обязательно начинать заново — забег
// продолжается тем же подходом на ещё бо́льшую дистанцию, за FINISH_DIST
// (эндлесс-хвост). finished остаётся true, поэтому winRun() второй раз не
// сработает и не откроет тот же экран заново.
function continueRun() {
  showScreen('game');
  running = true;
  last = performance.now();
}

// «Ещё раз»/«Новый забег»: рестарт локальный — вопросы качать не надо, результат шлём фоном
function restartGame() {
  if (lastResult) submitResult(lastResult); // fire-and-forget, как submit в restartGame совы
  lastResult = null;
  resetGame();
  running = true;
  showScreen('game');
}

async function submitResult(result) {
  if (!window.Telegram?.WebApp) return { ok: false, local: true };
  const initData = Telegram.WebApp.initData || '';
  try {
    const resp = await fetch('/game-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData, result }),
    });
    return { ok: resp.ok, status: resp.status, body: await resp.text() };
  } catch (e) {
    console.error('[game] submit error:', e);
    return { ok: false, error: e.message };
  }
}

// statusElId — «Отказ» и «Финиш» экраны показывают статус отправки в разных
// плашках (#result-status / #win-status), логика отправки одна и та же.
async function submitAndClose(statusElId) {
  const statusEl = document.getElementById(statusElId || 'result-status');
  if (!window.Telegram?.WebApp) {
    statusEl.textContent = tr('localPrototype');
    return;
  }
  if (lastResult) {
    statusEl.textContent = tr('logging');
    const r = await submitResult(lastResult);
    if (!r.ok) { statusEl.textContent = tr('notLogged'); return; }
    statusEl.textContent = tr('logged');
    lastResult = null;
  }
  try { Telegram.WebApp.close(); } catch (e) {}
}

// ── АПДЕЙТ ──────────────────────────────────────────────────────────────────
function update(dt) {
  t += dt;
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  if (shakeT > 0) shakeT -= dt;
  if (!running) return;

  const rage = P.rageT > 0;
  const spd = speed * (rage ? 1.55 : 1);
  dist += spd * dt / M_DIV;
  speed = Math.min(SPEED_CAP, speed + SPEED_RAMP * dt);
  // Милстоны: каждые 500 м — отметка, чтобы у забега были заметные этапы.
  // На финальном отрезке этот же счётчик подряд задел бы FINISH_DIST — не
  // дублируем событие, у финиша своя, более крупная реплика (см. winRun).
  if (!finished && Math.floor(dist / 500) > lastMile && dist < FINAL_STRETCH_START) {
    lastMile = Math.floor(dist / 500);
    bigPop(lastMile * 500 + ' ' + tr('unit') + '!', C_GOLD, W / 2, H * 0.3);
    burst(W / 2, H * 0.3, C_GOLD, 10, 160);
  }
  // Финальный отрезок: заметно другой свет вместо очередной зоны (см. render —
  // finaleGlow) и решающая встреча с усиленным вышибалой прямо перед линией
  // (см. spawnBoss) — не смягчаем сложность, а даём забегу видимую цель и
  // кульминацию, как договаривались с заказчиком.
  if (!finished && !finalStretchAnnounced && dist >= FINAL_STRETCH_START) {
    finalStretchAnnounced = true;
    bigPop(tr('zoneFinal'), C_GOLD, W / 2, H * 0.3);
    addShake(0.22); addHitStop(0.1);
  }
  if (!finished && !bossSpawned && dist >= BOSS_TRIGGER_DIST) {
    bossSpawned = true;
    spawnBoss();
  }
  if (P.rageT > 0) P.rageT -= dt;
  if (P.magnetT > 0) P.magnetT -= dt;
  if (P.slideT > 0) P.slideT -= dt;
  P.runPhase += dt * (spd / 340);

  if (!P.onGround) {
    P.vy += GRAV * SK * dt; P.y += P.vy * dt;
    if (P.y >= GROUND()) {
      P.y = GROUND(); P.vy = 0; P.onGround = true; P.jumps = 0;
      // Пыль на приземлении — заметный, но короткий всплеск у ног.
      burst(P.x, GROUND() - 4, 'rgba(210,200,180,0.7)', 7, 130);
    }
  }

  if (dist >= nextObsAt) spawnObstacle();
  if (dist >= nextItemAt) spawnItems();

  const pb = playerBox();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= spd * dt + (o.vx ? o.vx * dt : 0);
    if (o.kind === 'plate') o.rot -= dt * 7;
    if (o.kind === 'rival' || o.kind === 'boss') o.runPhase += dt * ((spd + o.vx) / 300);
    if (o.kind === 'bag') o.swingPhase += dt * 2.4;
    if (o.kind === 'cable') o.wavePhase += dt * 7;
    if (o.kind === 'flyplate') { o.rot -= dt * 12; o.floatPhase += dt * 3.5; o.age += dt; }
    if (o.x < -400 * SK) {
      // Босс, пройденный живым (перепрыгнут, не срублен яростью) — решающий
      // момент забега состоялся и выигран: не рядовой уход препятствия за
      // край экрана, а маленькая победа со своей отдачей.
      if (o.kind === 'boss' && !o.cleared) {
        o.cleared = true;
        score += 60 * mult();
        bigPop(tr('bossDown'), C_GOLD, W / 2, H * 0.34);
        burst(P.x, P.y - 30 * SK, C_GOLD, 30, 360);
        addShake(0.28); addHitStop(0.06); sPower();
      }
      obstacles.splice(i, 1); continue;
    }
    const b = obstacleBox(o);
    if (pb.x < b.x + b.w && pb.x + pb.w > b.x && pb.y < b.y + b.h && pb.y + pb.h > b.y) {
      if (rage) {
        // Ярость награждает за агрессию: снос — это очки, а не только спецэффект.
        // Босс сносом — тоже победа над ним, поэтому получает свою фанфару,
        // а не тот же тихий подсчёт очков, что рядовая гантеля.
        const isBoss = o.kind === 'boss';
        const bonus = (isBoss ? 120 : 25) * mult();
        score += bonus;
        burst(o.x + (o.w || 30) / 2, GROUND() - 24 * SK, isBoss ? C_GOLD : '#9aa0ab', isBoss ? 42 : 18, isBoss ? 420 : 340);
        addShake(isBoss ? SHAKE_MAX : 0.18);
        if (isBoss) { addHitStop(0.08); o.cleared = true; bigPop(tr('bossDown'), C_GOLD, W / 2, H * 0.34); }
        obstacles.splice(i, 1);
        toast('+' + bonus, C_RAGE, o.x, GROUND() - 80 * SK);
        continue;
      }
      if (P.shield) {
        P.shield = false; combo = 0;
        obstacles.splice(i, 1); burst(P.x, P.y - 30 * SK, '#7ea8ff', 20, 300);
        bigPop(tr('shieldSaved'), '#7ea8ff', P.x, P.y - P.h - 20); addShake(0.3); continue;
      }
      die(); return;
    }
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.t += dt;
    it.x -= spd * dt;
    if (P.magnetT > 0) {
      const dx = P.x - it.x, dy = (P.y - 40 * SK) - it.y, d = Math.hypot(dx, dy);
      if (d < 240 * SK) { it.x += dx / d * 520 * dt; it.y += dy / d * 520 * dt; }
    }
    if (it.x < -60 * SK) { items.splice(i, 1); continue; }
    const dx = Math.abs(it.x - P.x), dy = Math.abs(it.y - (P.y - 34 * SK));
    if (dx < 34 * SKW && dy < 44 * SKW) {
      const d = ITEM_TYPES[it.type];
      items.splice(i, 1);
      burst(it.x, it.y, d.color, 12, 220);
      const before = mult();
      combo += 1; maxCombo = Math.max(maxCombo, combo);
      // Пауэрапы и жирные награды — не рутинный подбор, а маленькое событие:
      // крупный текст, а не рядовой тост, плюс лёгкий толчок камеры.
      if (d.power === 'shield') { P.shield = true; pickups += 1; bigPop(tr('shieldPickup'), '#7ea8ff', it.x, it.y - 30); sPower(); burst(P.x, P.y - 40 * SK, '#7ea8ff', 16, 260); }
      else if (d.power === 'rage') { P.rageT = 4.2; pickups += 1; bigPop(tr('rageToast'), C_RAGE, it.x, it.y - 30); sPower(); addShake(0.3); burst(P.x, P.y - 40 * SK, C_RAGE, 18, 300); }
      else if (d.power === 'magnet') { P.magnetT = 6; pickups += 1; bigPop(tr('magnetToast'), '#67c26a', it.x, it.y - 30); sPower(); burst(P.x, P.y - 40 * SK, '#67c26a', 16, 260); }
      else {
        const gain = d.pts * mult();
        score += gain; sPick();
        // Обычный шейкер — не событие, мелькает слишком часто, чтобы каждый раз
        // выскакивал текст. Батончик (жирная награда с верхнего яруса) — уже да.
        if (it.type === 'bar') toast('+' + gain, d.color, it.x, it.y - 26);
      }
      if (mult() > before) bigPop(tr('streakPrefix') + mult(), C_GOLD, it.x, it.y - 34);
    }
  }

  toasts.forEach(ts => { ts.t += dt; ts.y -= 30 * dt; });
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > (toasts[i].life || 1.2)) toasts.splice(i, 1);

  // Линия финиша — проверяем последней: столкновение с боссом в этом же кадре
  // (die(), выше) уже вышло бы из update() раньше и до победы дело не дошло
  // бы — забег до конца нужно ДОБЕЖАТЬ живым, а не просто отмотать дистанцию.
  if (!finished && dist >= FINISH_DIST) { winRun(); return; }
}

// ── РЕНДЕР ──────────────────────────────────────────────────────────────────
// Дорожка под ногами: раньше это была почти плоская тёмная полоса — теперь
// текстура помоста (плитка со швами), тёплое пятно света под каждой лампой
// (в тон акцента зоны — работает и там, где стена сама по себе однотонная),
// разметка, три слоя ближних штрихов с разным параллаксом (чем ближе к
// нижнему краю, тем быстрее и крупнее — это и есть маркер скорости) и
// раскиданный у края инвентарь (блины/бутылки), который тоже едет мимо.
function drawTrack(z) {
  const gy = GROUND(), sf = speedFrac(), trackH = H - gy;

  // Плитка помоста: швы плюс лёгкое чередование тона, чтобы пол не был
  // ровной заливкой.
  const tileW = 52, toff = (dist * 4) % tileW;
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  for (let x = -tileW; x < W + tileW; x += tileW) ctx.fillRect(x - toff, gy + 3, tileW - 4, trackH - 3);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let x = -tileW; x < W + tileW; x += tileW) ctx.fillRect(x - toff, gy + 3, 2, trackH - 3);

  // Тёплое пятно света на полу под каждой «лампой» — тот же период/сдвиг,
  // что у ламп подвала (см. drawBasement), но рисуется зонально-нейтрально
  // через акцентный цвет зоны (z.groundLine), поэтому работает во всех пяти
  // локациях, а не только там, где явно нарисованы лампы.
  const glowP = 340, glowOff = (dist * 3.4) % glowP;
  ctx.globalAlpha = 0.5;
  for (let x = -glowP; x < W + glowP; x += glowP) {
    const gx = x - glowOff + glowP / 2;
    const g = ctx.createRadialGradient(gx, gy, 4, gx, gy, 130);
    g.addColorStop(0, z.groundLine + 'aa'); g.addColorStop(1, z.groundLine + '00');
    ctx.fillStyle = g; ctx.fillRect(gx - 130, gy - 10, 260, trackH * 0.8 + 10);
  }
  ctx.globalAlpha = 1;

  // Разметка — как раньше, два ряда штрихов на разной высоте/скорости.
  const dashW = 60, doff = (dist * 7) % (dashW * 2);
  ctx.fillStyle = 'rgba(242,237,227,0.16)';
  for (let x = -dashW * 2; x < W + dashW; x += dashW * 2) ctx.fillRect(x - doff + dashW, gy + 22, dashW, 5);
  const dashW2 = 34, doff2 = (dist * 10.5) % (dashW2 * 2);
  ctx.fillStyle = 'rgba(242,237,227,0.1)';
  for (let x = -dashW2 * 2; x < W + dashW2; x += dashW2 * 2) ctx.fillRect(x - doff2 + dashW2, gy + 46, dashW2 * 0.6, 3);

  // Раскиданный у нижнего края инвентарь — гантельный блин плоской стороной
  // вверх и бутылка воды, едут на самом быстром (ближнем) параллаксе.
  const dw = 150, doff3 = (dist * 8.4) % dw;
  for (let x = -dw; x < W + dw; x += dw) {
    const i = Math.floor(x / dw + 4000);
    const dx = x - doff3 + (i % 3) * 34;
    const dy = H - 16 - (i % 2) * 8;
    ctx.save(); ctx.translate(dx, dy);
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 5, 15, 4.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#7c2a20'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 5.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#4a1712'; ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 2.4, 0, 0, 7); ctx.fill();
    } else if (i % 3 === 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, 4, 6, 2.2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(120,190,210,0.6)'; ctx.beginPath(); ctx.roundRect(-4, -13, 8, 15, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(-4, -13, 2, 15);
      ctx.fillStyle = '#2b3138'; ctx.fillRect(-2.5, -16, 5, 3);
    }
    ctx.restore();
  }

  // Ближняя кромка дорожки темнее — читается глубина, не одна плоская линия.
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(0, H - 16, W, 16);

  // Три слоя ближних штрихов с разным параллаксом: чем ближе к нижнему краю,
  // тем крупнее и быстрее — это главный «на глаз» маркер скорости бега,
  // работающий даже когда сверху всё спокойно.
  if (sf > 0.04) {
    for (let layer = 0; layer < 3; layer++) {
      const ly = gy + trackH * (0.18 + layer * 0.32);
      const segW = 60 + layer * 42, per = segW * 2, lof = (dist * (8 + layer * 7)) % per;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.06 + 0.05 * layer + 0.12 * sf).toFixed(3) + ')';
      ctx.lineWidth = 2 + layer * 1.6;
      for (let x = -per; x < W + segW; x += per) {
        const lx = x - lof;
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + segW * 0.6, ly); ctx.stroke();
      }
    }
  }
  // Штрихи скорости в приземном слое неба — усиливают ощущение бега на разгоне.
  if (sf > 0.15) {
    const n = 5, lw = 46 * sf, loff = (dist * 9) % 140;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + 0.10 * sf).toFixed(3) + ')'; ctx.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      const ly = gy - 30 - i * 30;
      const lx = W - ((loff + i * 53) % (W + lw)) ;
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + lw, ly); ctx.stroke();
    }
  }
}
// Виньетка — тёмные углы кадра, дёшево и сразу «дороже» выглядит картинка.
function drawVignette() {
  const r = Math.max(W, H) * 0.78;
  const g = ctx.createRadialGradient(W / 2, H * 0.46, r * 0.32, W / 2, H * 0.46, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.46)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function render() {
  if (!cv.classList.contains('active')) return;
  ctx.save();
  if (shakeT > 0) ctx.translate(rnd(-9, 9) * shakeT, rnd(-9, 9) * shakeT);
  // Финальный отрезок обязан ЧИТАТЬСЯ финалом, а не ещё одной зоной: свой
  // цветовой грейд поверх обычной зоны (не подменяет её рисунок, а красит
  // сверху — работает при любой из пяти локаций) и нарастание к линии финиша.
  // finalePalette — один из двух вариантов на забег (см. resetGame), чтобы
  // соседние подходы не выглядели одним и тем же клипом.
  const inFinale = !finished && dist >= FINAL_STRETCH_START;
  const finaleP = inFinale ? Math.min(1, (dist - FINAL_STRETCH_START) / FINAL_STRETCH_LEN) : 0;
  const zi = zoneIndex(), zb = zoneBlend();
  const z = ZONES[zi], zn = ZONES[nextZoneIndex()];

  const g = ctx.createLinearGradient(0, 0, 0, GROUND());
  g.addColorStop(0, z.sky[0]); g.addColorStop(1, z.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawFarBokeh(z.groundLine);
  z.draw(1 - zb * 0.6);
  if (zb > 0) zn.draw(zb);

  ctx.fillStyle = z.ground; ctx.fillRect(0, GROUND(), W, H - GROUND());
  if (zb > 0) { ctx.globalAlpha = zb; ctx.fillStyle = zn.ground; ctx.fillRect(0, GROUND(), W, H - GROUND()); ctx.globalAlpha = 1; }
  ctx.fillStyle = z.groundLine; ctx.fillRect(0, GROUND(), W, 3);
  drawTrack(z);

  if (inFinale) {
    // Тёплый (или, во втором варианте палитры, электро-розовый) грейд поверх
    // всей сцены — усиливается по мере приближения к линии, плюс медленный
    // пульс, чтобы отрезок ощущался «живым», а не просто перекрашенным фоном.
    const pulse = 0.5 + 0.5 * Math.sin(t * 5.5);
    ctx.fillStyle = 'rgba(' + finalePalette.tint + ',' + (0.07 + 0.11 * finaleP + 0.05 * pulse).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    // Энергетические лучи по краям кадра, сходящиеся к центру — тот же приём,
    // что в «рекламных» раннерах: рамка кадра сама подсказывает «сейчас
    // что-то решится», без единого слова текста.
    const rayN = 5, rw = 3 + 5 * finaleP;
    ctx.strokeStyle = finalePalette.accent + Math.round((0.16 + 0.14 * pulse) * 255).toString(16).padStart(2, '0');
    ctx.lineWidth = rw;
    for (let i = 0; i < rayN; i++) {
      const ry = H * (0.12 + i * 0.19) + Math.sin(t * 3 + i) * 6;
      ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(W * 0.14, ry); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W, ry); ctx.lineTo(W * 0.86, ry); ctx.stroke();
    }
  }

  if (P.rageT > 0) {
    ctx.fillStyle = 'rgba(255,90,54,' + (0.10 + 0.06 * Math.sin(t * 20)) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  items.forEach(drawItem);
  obstacles.forEach(drawObstacle);
  drawPlayer();

  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 1.6); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.r, p.r); });
  ctx.globalAlpha = 1;
  // bigPop() — крупный текст контрольных точек/победы над боссом/финиша:
  // толстая тёмная обводка вместо тени (читается на любом фоне без подложки)
  // и короткий пружинный «щелчок» масштаба на появлении — момент должен
  // чувствоваться, а не проскакивать плоской надписью.
  toasts.forEach(ts => {
    const life = ts.life || 1.2;
    ctx.globalAlpha = Math.max(0, 1 - ts.t / life);
    const big = !!ts.big;
    ctx.font = (big ? "900 34px" : "900 16px") + " 'Courier New', monospace";
    ctx.textAlign = 'center';
    const pop = big ? 1 + Math.max(0, 0.22 - ts.t) * 2.6 : 1;
    // Длинная реплика на узком экране («КРЕАТИН СПАС» на 390px) шире вьюпорта.
    // Одним прижатием к краю это НЕ лечится: при 2*half+16 > W клэмп ниже
    // вырождается (нижняя граница становится больше верхней) и текст уезжает
    // за оба края разом — так и было видно на живом прогоне. Поэтому сначала
    // ужимаем масштаб до ширины экрана, и только потом прижимаем.
    const baseHalf = ctx.measureText(ts.text).width / 2;
    const maxHalf = (W - 16) / 2;
    const fit = baseHalf * pop > maxHalf ? maxHalf / (baseHalf * pop) : 1;
    const scale = pop * fit;
    const half = baseHalf * scale;
    // Игрок стоит у левого края — текст, отцентрованный на нём, обрезался бы
    // экраном; прижимаем к видимой области.
    const tx = Math.max(half + 8, Math.min(W - half - 8, ts.x));
    ctx.save();
    ctx.translate(tx, ts.y); ctx.scale(scale, scale);
    if (big) {
      ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,7,5,0.92)';
      ctx.strokeText(ts.text, 0, 0);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(ts.text, 1.5, 1.5);
    }
    ctx.fillStyle = ts.color; ctx.fillText(ts.text, 0, 0);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  drawVignette();

  // ── HUD ── разложен по трём непересекающимся полосам: слева дистанция+рекорд,
  // справа очки, ниже справа — отдельным столбиком активные бонусы (каждый на
  // своей строке, а не в ряд), зона — в отдельной плашке по центру над всем
  // остальным. Так при любой длине чисел и любом наборе активных бонусов
  // элементы не наезжают друг на друга.
  // Дистанция и очки — самые читаемые цифры на экране (референс — рекламные
  // раннеры вроде Last War): крупный шрифт и толстая тёмная обводка вместо
  // тонкой заливки, чтобы цифра прочитывалась мгновенно на любом фоне зоны.
  ctx.textAlign = 'left';
  ctx.font = "900 32px 'Courier New', monospace";
  ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,7,5,0.85)';
  ctx.strokeText(Math.floor(dist) + ' ' + tr('unit'), 20, 42);
  ctx.fillStyle = C_GOLD; ctx.fillText(Math.floor(dist) + ' ' + tr('unit'), 20, 42);
  ctx.font = "700 13px 'Courier New', monospace"; ctx.fillStyle = 'rgba(242,237,227,0.65)';
  ctx.fillText(tr('hudRecord') + Math.max(best, Math.floor(dist)) + ' ' + tr('unit'), 20, 64);

  // Обводка на эмодзи-глифе часто рисуется криво в разных рендерерах — стро́чим
  // только цифры, значок ставим отдельным fillText без обводки рядом с ними.
  ctx.textAlign = 'right'; ctx.font = "900 28px 'Courier New', monospace";
  const multNow = mult();
  const numText = score + (multNow > 1 ? '  ×' + multNow : '');
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,7,5,0.85)';
  ctx.strokeText(numText, W - 20, 42);
  ctx.fillStyle = '#e94f64'; ctx.fillText(numText, W - 20, 42);
  const numW = ctx.measureText(numText).width;
  ctx.font = "900 24px 'Courier New', monospace"; ctx.fillText('🥤', W - 26 - numW, 42);

  // Бонусы — вертикальный столбик под очками, начинается ниже левого блока
  // (y=76), чтобы никогда не залезать на зональную плашку по центру.
  let iy = 74;
  const pw = (label, color, frac) => {
    ctx.textAlign = 'right'; ctx.font = "800 12px 'Courier New', monospace"; ctx.fillStyle = color;
    ctx.fillText(label, W - 20, iy);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(W - 110, iy + 5, 90, 4);
    ctx.fillStyle = color; ctx.fillRect(W - 110, iy + 5, 90 * frac, 4);
    iy += 22;
  };
  if (P.rageT > 0) pw(tr('hudRage'), C_RAGE, P.rageT / 4.2);
  if (P.magnetT > 0) pw(tr('hudMagnet'), '#67c26a', P.magnetT / 6);
  if (P.shield) { ctx.textAlign = 'right'; ctx.font = "800 12px 'Courier New', monospace"; ctx.fillStyle = '#7ea8ff'; ctx.fillText(tr('hudShield'), W - 20, iy); iy += 22; }

  // Плашка с названием зоны — своя тёмная подложка, поэтому что бы ни было под
  // ней, надпись остаётся читаемой. На финальном отрезке она заметно другая:
  // золотая, пульсирующая, с меткой «ФИНИШНАЯ ПРЯМАЯ» вместо имени зоны — сам
  // HUD подтверждает, что это уже не рядовая локация.
  const labelText = inFinale ? tr('zoneFinal') : z.name;
  ctx.font = "800 11px 'Courier New', monospace";
  const zoneW = ctx.measureText(labelText).width + 24;
  ctx.fillStyle = inFinale ? 'rgba(60,26,8,0.55)' : 'rgba(10,10,14,0.45)';
  ctx.beginPath(); ctx.roundRect(W / 2 - zoneW / 2, 14, zoneW, 20, 10); ctx.fill();
  if (inFinale) {
    ctx.strokeStyle = finalePalette.accent + 'aa'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(W / 2 - zoneW / 2, 14, zoneW, 20, 10); ctx.stroke();
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = inFinale ? ('rgba(255,215,0,' + (0.75 + 0.2 * Math.sin(t * 6)).toFixed(2) + ')') : 'rgba(242,237,227,0.75)';
  ctx.fillText(labelText, W / 2, 28);
  ctx.restore();
}

// ── ЦИКЛ ────────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (hitStopT > 0) { hitStopT = Math.max(0, hitStopT - dt); dt *= 0.08; }
  update(dt); render();
  requestAnimationFrame(frame);
}
resetGame();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// Хук для QA-прогонов (playwright): только чтение состояния, на геймплей не
// влияет. Не часть пользовательского интерфейса.
window.__qa = {
  get dist() { return dist; }, get speed() { return speed; }, get running() { return running; },
  get obstacles() { return obstacles; }, get playerX() { return P.x; },
  get P() { return P; },
  jump, slide,
};
</script>
