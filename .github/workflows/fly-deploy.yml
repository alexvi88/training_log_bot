# Деплой на Fly.io на каждый мерж в main (и вручную: Actions → Fly deploy →
# Run workflow). Бот переехал с Amvera, проект там заморожен — второго
# процесса, который забирал бы апдейты Telegram, больше нет. Нужен секрет
# репозитория FLY_API_TOKEN (`fly tokens create deploy -a training-log-bot`).
name: Fly deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
