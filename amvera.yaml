meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  useCache: true

run:
  scriptName: main.py
  persistenceMount: /data
  containerPort: "80"
  servicePort: "80"
  # Ровно один инстанс — не настройка производительности, а инвариант, на
  # который завязана правильность работы бота. Нет ключа "replicas"/"scale":
  # Amvera по умолчанию держит один контейнер. Если он когда-нибудь появится
  # со значением больше 1, тихо сломается сразу несколько вещей, ни одну из
  # которых не поймает существующий набор тестов (они все внутри одного
  # процесса):
  #  - db._write_lock (db.py) — asyncio.Lock, который сериализует запись в
  #    SQLite; на несколько процессов такой замок не действует вовсе.
  #  - все in-memory busy-замки от двойного платежа за один и тот же AI-шаг
  #    (busy_lock.py — handlers/ai_trainer._busy, handlers/factcheck._busy,
  #    handlers/food_diary._busy, api_v1_ai._busy, api_v1_food._busy): второй
  #    параллельный запрос того же пользователя, попавший на ДРУГОЙ инстанс,
  #    не увидит бронь первого и заплатит модели повторно.
  #  - ai_limits._cached (ai_limits.py) — кэш дневного расхода в памяти
  #    процесса; несколько процессов независимо считали бы потолок мимо друг
  #    друга и разошлись бы по факту потраченного.
  # Расти вширь этому боту можно только вместе с переносом всех трёх пунктов
  # в общее хранилище (Redis/БД) — сейчас этого нет и заводить не нужно.
