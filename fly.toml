# Fly.io: один постоянный инстанс во Франкфурте с volume под /data.
# Почему ровно один и без автостопа — см. комментарий в amvera.yaml:
# SQLite, поллинг Telegram и in-memory замки держатся на одном процессе.
# Порядок переезда — docs/DEPLOY_FLY.md.

app = "training-log-bot"
primary_region = "fra"

# Остановка на деплое (shutdown_drain.py): по сигналу бот перестаёт брать
# новые ходы AI-тренера и ждёт идущие до config.SHUTDOWN_AI_GRACE_SECONDS
# (45 с), потом дописывает хвосты HTTP (5 с) и закрывает базу. kill_timeout —
# с запасом сверх этого: по его истечении Fly добивает процесс SIGKILL.
# Сигнал Litestream (start.sh) пересылает боту и ждёт его выхода; main.py
# ловит и SIGTERM, и SIGINT одинаково.
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  dockerfile = "Dockerfile"

# Несекретные настройки — здесь, в репозитории. Ключи и токены — только
# через `fly secrets` / вкладку Secrets (TG_TOKEN, *_API_KEY, APNS_KEY_P8,
# APNS_KEY_ID, ADMIN_ID).
[env]
  APNS_ENV = "production"
  APNS_TEAM_ID = "H93ZYM2S8U"
  # Публичный адрес MCP-коннектора (Claude, ChatGPT, каталоги) — свой домен:
  # на нём issuer OAuth, resource в .well-known и адрес на экране /mcp.
  # Старые подключения на fly.dev владелец разрешил не беречь (16.10.2026):
  # их токены живут до отзыва, а новое подключение идёт сюда. Хост тот же
  # процесс — DNS athletediary.app смотрит на это приложение.
  MCP_PUBLIC_URL = "https://athletediary.app"
  # Адрес сервера для приложения и Universal Links приглашения тренера
  # (`applinks:training-log-bot.fly.dev` в entitlements iOS) — прибит явно,
  # иначе config.public_base_url() уехал бы вслед за MCP_PUBLIC_URL.
  PUBLIC_BASE_URL = "https://training-log-bot.fly.dev"
  COMMUNITY_CHAT_URL = "https://t.me/training_log_athletes"
  TEST_USER_ID = "8789172252"
  # Ссылка на приложение в App Store — строкой рядом с t.me в приглашении и
  # визитке (config.APP_STORE_URL). Пока не задана, строки нет вовсе.
  # С provider token (pt=) — иначе метки кампаний (ct=you_story у сторис «ТЫ»,
  # ct=site_<блок> у кнопок сайта, seo_pages.app_store_link) не видны в
  # App Store Connect → Analytics → Campaigns, см. GROWTH.md. pt задан.
  APP_STORE_URL = "https://apps.apple.com/app/apple-store/id6815211995?pt=129483617&mt=8"
  # Свой домен публичных страниц (seo_pages.py): canonical, hreflang, sitemap.
  # DNS athletediary.app смотрит на Fly, сертификат выпущен 16.10.2026.
  SITE_BASE_URL = "https://athletediary.app"

[deploy]
  # С volume второй машины рядом не поднять: старая гасится, новая
  # стартует (10–30 с простоя). Telegram копит апдейты, приложение —
  # подходы в офлайн-очереди.
  strategy = "immediate"

[[mounts]]
  source = "data"
  destination = "/data"
  snapshot_retention = 5

[http_service]
  internal_port = 80
  force_https = true
  # Поллинг Telegram — не HTTP-трафик: засыпание машины без запросов
  # выключило бы бота. Держим всегда включённой.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
