<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кач-Отряд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(135deg, #14110f 0%, #221812 50%, #0d1a2e 100%);
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  #game-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100svh;
    touch-action: none; display: none;
  }
  #game-canvas.active { display: block; }

  .screen {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .screen.active { display: flex; }
  .screen-inner {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  h1 {
    font-size: 24px; text-align: center; text-transform: uppercase;
    letter-spacing: 3px; color: #ffd700; text-shadow: 0 0 20px #ffd700aa;
  }
  .subtitle { font-size: 13px; color: #aaa; text-align: center; line-height: 1.5; }
  .subtitle b { color: #ffd700; }

  /* ── ВЫБОР КАЧКА ── */
  .fighters-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    width: 100%; max-width: 360px;
  }
  .fighter-card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,215,0,0.3);
    border-radius: 12px; padding: 12px; cursor: pointer; text-align: center;
    transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .fighter-card:hover, .fighter-card:active {
    border-color: #ffd700; transform: scale(1.04); box-shadow: 0 0 20px #ffd70055;
  }
  .fighter-card canvas { width: 100%; aspect-ratio: 1; }
  .fighter-card img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block;
  }
  .fighter-name {
    margin-top: 8px; font-size: 13px; text-transform: uppercase;
    letter-spacing: 1px; color: #ffd700;
  }
  .fighter-tag { font-size: 10px; color: #aaa; margin-top: 2px; }

  .controls-hint { font-size: 12px; color: #888; text-align: center; line-height: 1.7; }
  .controls-hint b { color: #ddd; }

  /* ── РЕЗУЛЬТАТ ── */
  #screen-result .screen-inner { text-align: center; }
  .result-title {
    font-size: 30px; font-weight: bold; text-transform: uppercase;
    letter-spacing: 3px; color: #ff4444; text-shadow: 0 0 20px #ff4444;
  }
  .result-score { font-size: 20px; color: #ffd700; }
  #result-art {
    width: 104px; height: 104px; object-fit: cover; border-radius: 12px;
    border: 2px solid rgba(255,215,0,0.4); display: none; margin: 0 auto;
  }
  .result-stats { font-size: 12px; color: #aaa; }
  .result-quip { font-size: 13px; color: #ccc; line-height: 1.6; max-width: 340px; }
  .result-best { font-size: 12px; color: #888; }
  .result-btn {
    background: rgba(255,215,0,0.15); border: 2px solid #ffd700; border-radius: 12px;
    color: #ffd700; font-family: inherit; font-size: 15px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 2px; padding: 14px 32px; cursor: pointer;
    transition: background 0.2s, transform 0.1s; min-width: 220px;
  }
  .result-btn:hover { background: rgba(255,215,0,0.3); }
  .result-btn:active { transform: scale(0.97); }
  .result-btn.retry { border-color: #00c850; color: #00c850; background: rgba(0,200,80,0.1); }
  .result-btn.retry:hover { background: rgba(0,200,80,0.25); }
  #result-status { color: #aaa; font-size: 13px; min-height: 16px; }

  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  #flash.red { background: rgba(255,40,40,0.4); }
  #flash.orange { background: rgba(255,140,20,0.32); }
  #flash.green { background: rgba(60,220,110,0.3); }
  #flash.gold { background: rgba(255,215,0,0.4); }
  #flash.white { background: rgba(255,255,255,0.85); }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="flash"></div>

<!-- ЭКРАН 1: выбор качка -->
<div id="screen-select" class="screen active">
  <div class="screen-inner">
    <h1>Кач-Отряд</h1>
    <div class="subtitle">Веди отряд по залу, дроби блины на подходе, лови ворота с плюсом —
      <b>я с трибуны считаю, сколько народу дойдёт до финиша.</b> Кем поведёшь?</div>
    <div class="fighters-row" id="fighters-row"></div>
    <div class="controls-hint">
      <b>тяни пальцем влево-вправо</b> — ведёшь весь отряд<br>
      <b>← → / A D</b> — то же самое, если играешь с клавиатуры
    </div>
  </div>
</div>

<!-- ЭКРАН 2: результат -->
<div id="screen-result" class="screen">
  <div class="screen-inner">
    <div class="result-title">Отказ</div>
    <img id="result-art" src="" alt="">
    <div class="result-score" id="result-score">0 м · 🥤 0</div>
    <div class="result-stats" id="result-stats"></div>
    <div class="result-quip" id="result-quip"></div>
    <div class="result-best" id="result-best"></div>
    <button class="result-btn retry" onclick="restartGame()">🔄 Ещё разок</button>
    <button class="result-btn" onclick="submitAndClose()">❌ Закрыть</button>
    <div id="result-status"></div>
  </div>
</div>

<script>
'use strict';
// Expand to full screen immediately (как в game.html)
if (window.Telegram?.WebApp) Telegram.WebApp.expand();

// ── КАЧКИ (набор и рисовалка — как в game.html, страница самостоятельная) ───
const FIGHTERS = {
  power:  { name: 'Пауэрлифтер', tag: 'сила',         top: '#8f2a20', bottom: '#2b2d34', skin: '#e0b08a', head: 'bandana',  hair: '#31241c', acc: '#b8860b', belt: true, bulk: 1.18 },
  cross:  { name: 'Кроссфитер',  tag: 'функционалка', top: '#276f66', bottom: '#31343d', skin: '#caa27e', head: 'headband', hair: '#20180f', acc: '#f2ede3', bulk: 1.0 },
  wrestle:{ name: 'Борец',       tag: 'захват',       top: '#7a2b3f', bottom: '#7a2b3f', skin: '#dba184', head: 'short',    hair: '#2a1f16', acc: '#7a2b3f', singlet: true, ears: true, bulk: 1.12 },
  build:  { name: 'Бодибилдер',  tag: 'мышцы',        top: '#cf9455', bottom: '#23252c', skin: '#cf9455', head: 'short',    hair: '#241a12', acc: '#d9a013', shirtless: true, bulk: 1.22 },
};
let selectedFighter = 'power';

// ── CANVAS ───────────────────────────────────────────────────────────────────
const cv = document.getElementById('game-canvas');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

const CHALK = '#f2ede3', C_RAGE = '#ff5a36', C_GOLD = '#ffd700', C_GREEN = '#3cdc6e';

// ── ЗВУК: короткие бипы через WebAudio + фоновый гул ─────────────────────────
// AudioContext создаётся только по первому клику (selectFighter → startHum) —
// ни один звук не проигрывается до жеста пользователя, поэтому нет хлопка
// на старте. Всё идёт через один masterGain: частые события (выстрелы,
// тики урона) — тихие и высокие щелчки, редкие (взрыв блина, ворота, босс) —
// звучат телом, с коротким аккордом и «шшш» на разлёте. Общий лимит голосов
// и троттлинг по ключу не дают каше пищалок слипнуться в шум.
let AC = null, masterGain = null, muted = false;
function ensureAC() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.9;
    masterGain.connect(AC.destination);
  }
  return AC;
}
let activeVoices = 0;
const MAX_VOICES = 9;
const lastPlayed = {};
function beep(freq, dur, type = 'triangle', vol = 0.05, slide = 0, key) {
  if (muted) return;
  const now = performance.now();
  if (key) {
    if (lastPlayed[key] && now - lastPlayed[key] < 35) return;
    lastPlayed[key] = now;
  }
  if (activeVoices >= MAX_VOICES) return;
  try {
    const ac = ensureAC();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, ac.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(ac.currentTime + dur);
    activeVoices++;
    o.onended = () => { activeVoices = Math.max(0, activeVoices - 1); };
  } catch (e) {}
}
// Короткий шумовой «шшш» — разлёт блина, добивание босса. Отдельно от beep,
// не считается в лимите голосов (визуально редкое событие, не спамится).
function noiseBurst(dur = 0.14, vol = 0.045) {
  if (muted) return;
  try {
    const ac = ensureAC();
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const filt = ac.createBiquadFilter(); filt.type = 'highpass'; filt.frequency.value = 1500;
    const g = ac.createGain(); g.gain.value = vol;
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start();
  } catch (e) {}
}
// Частые события — почти неслышные высокие щелчки, треугольная волна, 20-40 мс.
const sShot = () => beep(rnd(1150, 1320), .03, 'triangle', .022, 40, 'shot');
const sTick = () => beep(rnd(900, 1040), .025, 'triangle', .02, 30, 'tick');
const sBossHit = () => beep(rnd(760, 860), .03, 'triangle', .022, 20, 'bosshit');
// Редкие награды — короткий аккорд вверх + «шшш» на разлёте.
const sPop = () => { beep(700, .05, 'triangle', .05, 160); setTimeout(() => beep(980, .06, 'triangle', .045, 220), 40); noiseBurst(0.11, 0.035); };
const sGateUp = () => { beep(560, .08, 'triangle', .06, 200); setTimeout(() => beep(840, .09, 'triangle', .055, 260), 70); setTimeout(() => beep(1120, .1, 'sine', .05, 180), 140); };
const sGateDown = () => { beep(520, .09, 'square', .05, -140); setTimeout(() => beep(360, .12, 'triangle', .045, -60), 70); };
const sPower = () => { beep(650, .09, 'triangle', .055, 220); setTimeout(() => beep(950, .12, 'triangle', .05, 260), 80); };
const sShield = () => beep(880, .09, 'triangle', .05, 140);
const sHit = () => { beep(280, .09, 'square', .055, -60); noiseBurst(0.08, 0.045); };
const sBossWin = () => { beep(520, .12, 'triangle', .06, 200); setTimeout(() => beep(720, .14, 'triangle', .06, 240), 90); setTimeout(() => beep(960, .18, 'sine', .06, 200), 190); noiseBurst(0.2, 0.05); };
// «Рёв трибуны» — толпа коротких пищалок вразнобой, имитация одобрительного гула.
const sRoar = () => { for (let i = 0; i < 8; i++) setTimeout(() => beep(rnd(500, 900), .07, 'triangle', .028, rnd(-30, 60)), i * 26); };
const sBossLose = () => { beep(320, .13, 'square', .055, -120); setTimeout(() => beep(240, .16, 'triangle', .045, -80), 90); };
const sWeaponUp = () => { beep(620, .07, 'triangle', .05, 180); setTimeout(() => beep(880, .09, 'triangle', .05, 240), 60); setTimeout(() => beep(1180, .11, 'sine', .045, 200), 130); };
const sWeaponDown = () => beep(300, .1, 'square', .04, -100);
const sEnemyHit = () => beep(rnd(640, 760), .028, 'triangle', .02, -20, 'enehit');
const sEnemyShot = () => beep(rnd(300, 380), .05, 'square', .028, -30, 'enshot');
const sMelee = () => { beep(240, .1, 'square', .05, -60); noiseBurst(0.1, 0.045); };
const sDie = () => { beep(340, .13, 'square', .055, -110); setTimeout(() => beep(250, .18, 'triangle', .045, -90), 110); };

// Фоновый гул: заводится по первому клику (жест пользователя), громкость и
// высота растут вместе со скоростью — ощущение разгона, не только цифры.
let hum = null;
function startHum() {
  if (hum || muted) return;
  try {
    const ac = ensureAC();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 46;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(masterGain); o.start();
    hum = { o, g };
  } catch (e) {}
}
function updateHum(speedFrac) {
  if (!hum) return;
  try {
    const ac = ensureAC();
    hum.o.frequency.linearRampToValueAtTime(40 + speedFrac * 55, ac.currentTime + 0.15);
    hum.g.gain.linearRampToValueAtTime(muted ? 0 : (0.010 + speedFrac * 0.016), ac.currentTime + 0.15);
  } catch (e) {}
}

// ── УТИЛИТЫ ──────────────────────────────────────────────────────────────────
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Единая точка форматирования чисел для экрана: любое число, которое рисуем
// в canvas или ставим в textContent, идёт только через неё — округление
// живёт в одном месте и не разъезжается по местам отрисовки.
const fmt = n => String(Math.round(n));

// ── ПЕРСПЕКТИВА: дорожка уходит вверх экрана, дальнее — мельче ──────────────
const ZFAR = 3.4;
const HORIZON_F = 0.15, GROUND_F = 0.83, FAR_SCALE = 0.15, TRACK_HALF_F = 0.46;
function projectZ(z) {
  const t = clamp(z / ZFAR, 0, 1);
  const p = Math.pow(t, 0.58);
  const gy = GROUND_F * H, hy = HORIZON_F * H;
  return {
    y: hy + (gy - hy) * (1 - p),
    scale: FAR_SCALE + (1 - FAR_SCALE) * (1 - p),
  };
}
function projectPoint(worldX, z) {
  const pr = projectZ(z);
  const halfW = TRACK_HALF_F * W * pr.scale;
  return { x: W / 2 + worldX * halfW, y: pr.y, scale: pr.scale, halfW };
}

// ── СОСТОЯНИЕ ЗАБЕГА ─────────────────────────────────────────────────────────
let state = 'select'; // select | game | dying | result
let t = 0, dist = 0, score = 0, best = Math.max(0, +(localStorage.getItem('squad_best') || 0));
let squad = 0, maxSquad = 0, shield = 0, rageT = 0;
let squadWorldX = 0;
let trackScroll = 0;
let meterSpeed = 0, depthSpeed = 0;
let lastMile = 0, nextBossMile = 1000;
let nextEventAt = 0, lastEventWorldX = 0;
const eventHistory = []; // последние 1-2 типа событий — против серий подряд
let fireTimer = 0;
let lastResult = null;
const enemies = []; // рендер-представление вражеских толп (силуэты), не логика

// ── СЛУЧАЙНЫЙ ПОТОК СОБЫТИЙ ──────────────────────────────────────────────────
// Каждый забег собирается заново: тип следующего события — взвешенный выбор,
// веса плывут по дистанции (щедрые ворота и мелкие волны в начале, тяжёлые
// волны и злые ворота дальше), а не жёсткое расписание. Один и тот же тип не
// выпадает больше двух раз подряд — сыгранная история подряд идущих типов
// понижает его вес почти до нуля на следующий бросок.
function weightsFor(d) {
  const p = clamp(d / 900, 0, 1);
  return {
    gate: 0.27 - p * 0.06, plate: 0.30 - p * 0.08,
    wave: d < 150 ? 0 : 0.06 + p * 0.28,
    bonus: 0.22 - p * 0.10, crate: 0.15 - p * 0.02,
  };
}
function pickEventType() {
  const w = weightsFor(dist);
  const weighted = Object.keys(w).map(k => {
    let v = Math.max(0.01, w[k]);
    if (eventHistory.length >= 2 && eventHistory[0] === k && eventHistory[1] === k) v *= 0.1;
    return [k, v];
  });
  const total = weighted.reduce((s, [, v]) => s + v, 0);
  let r = Math.random() * total;
  for (const [k, v] of weighted) { r -= v; if (r <= 0) return commitEvent(k); }
  return commitEvent(weighted[weighted.length - 1][0]);
}
function commitEvent(k) {
  eventHistory.unshift(k);
  if (eventHistory.length > 2) eventHistory.length = 2;
  return k;
}
// Не даём событиям залипать по центру дорожки — новая позиция подальше от
// прошлой, чтобы реально приходилось рулить.
function spreadX(range) {
  let x = rnd(-range, range);
  if (Math.abs(x - lastEventWorldX) < 0.32) x = clamp(-lastEventWorldX + rnd(-0.15, 0.15), -range, range);
  lastEventWorldX = x;
  return x;
}

const SQUAD_START = 1, SQUAD_CAP = 999;
const SPEED_START = 5.5, SPEED_RAMP = 0.045, SPEED_CAP = 15;
// Комбо: серия сбитых блинов без пропущенного удара — растущий множитель
// очков и звук с повышающимся тоном на каждый шаг. Промах — заметный слом.
let combo = 0, comboBestTone = 0;
function comboHit() {
  combo += 1;
  // Классика жанра: одна и та же короткая пищалка, шаг вверх по полутонам —
  // именно она даёт ощущение разгона серии.
  const step = Math.min(12, combo);
  beep(480 * Math.pow(2, step / 12), .045, 'triangle', .03, 0, 'combo');
  if (combo === 5 || combo === 10 || combo === 20 || (combo > 20 && combo % 15 === 0)) {
    popNumber('СЕРИЯ ×' + comboMult(), C_GOLD, W / 2, H * 0.24, true);
  }
}
function comboMult() { return 1 + Math.min(4, Math.floor(combo / 5)); }
function comboBreak() {
  if (combo >= 5) { beep(320, .16, 'sawtooth', .06, -220); popNumber('СЕРИЯ СБИТА', '#ff8a4a', W / 2, H * 0.24); }
  combo = 0;
}

// Тряска — одна общая функция с амплитудой и экспоненциальным затуханием.
let shakeAmp = 0;
function shake(amp) { shakeAmp = Math.max(shakeAmp, amp); }

// Хит-стоп: короткая пауза кадра на сильных ударах — вес события ощущается
// телом, а не только цифрой.
let hitStopT = 0;
function hitStop(sec) { hitStopT = Math.max(hitStopT, sec); }

// Замедление на смерти отряда: не мгновенный переход на результат.
let timeScale = 1, dying = false;

const obstacles = []; // plate | gate | boss | wave
const bonuses = [];   // preworkout | belt | dumbbell
const crates = [];    // ящики с оружием
const bullets = [];
const enemyShots = []; // короткие трассеры ответного огня врагов — визуал, не отдельные снаряды
const parts = [];
const toasts = [];

// ── ОРУЖИЕ ОТРЯДА ────────────────────────────────────────────────────────────
// Линейка от слабого к сильному, всё из зала. Оружие временное (кроме
// стартового шейкера) — сгорает по таймеру или ступенью вниз от сильного
// удара, поэтому за ящиками нужно охотиться постоянно.
const WEAPONS = [
  { key: 'shaker',     name: 'ШЕЙКЕР',              fireMult: 1.0,  dmgMult: 1.0,  pellets: 1, spread: 0,    pierce: 1, dur: 0,  color: '#e94f64' },
  { key: 'expander',   name: 'ЭСПАНДЕР',            fireMult: 1.1,  dmgMult: 0.62, pellets: 3, spread: 0.09, pierce: 1, dur: 16, color: '#7ea8ff' },
  { key: 'shotgun',    name: 'ГАНТЕЛЬНЫЙ ДРОБОВИК', fireMult: 0.5,  dmgMult: 1.5,  pellets: 5, spread: 0.20, pierce: 1, dur: 14, color: '#67c26a' },
  { key: 'plategun',   name: 'БЛИНОСТРЕЛ',          fireMult: 0.62, dmgMult: 2.1,  pellets: 1, spread: 0,    pierce: 3, dur: 13, color: '#ffb347' },
  { key: 'bargun',     name: 'ГРИФ-ПУЛЕМЁТ',        fireMult: 3.4,  dmgMult: 0.42, pellets: 1, spread: 0.05, pierce: 1, dur: 11, color: C_GOLD },
];
let weaponLevel = 0, weaponTimer = 0;
// Сильный удар «сжигает» ступень оружия сразу, а не только по таймеру —
// иначе один раз поднял топ и до конца скучаешь.
function weaponBurn(loss) {
  if (loss >= 12 && weaponLevel > 0) {
    weaponLevel = Math.max(0, weaponLevel - 1);
    weaponTimer = weaponLevel > 0 ? WEAPONS[weaponLevel].dur : 0;
    sWeaponDown();
    popNumber('ОРУЖИЕ СГОРЕЛО', '#ff8a4a', W / 2, H * 0.24);
  }
}

function resetGame() {
  state = 'game'; dying = false; timeScale = 1;

// Тексты — TONE_OF_VOICE.md: тренер от первого лица, на «ты», без подколок
// (проигрыш в игре — не пропуск тренировки, значит только поддержка).
// Формула «ПРИВЕТ АТЛЕТ!» — строго, без имени и без запятой.
const QUIPS = [

  ' человек держались в отряде — я с трибуны считал каждого.',

// ── ТОЛПА: лидер + отряд с инерцией, дешёвая отрисовка дальних рядов ────────
// followers — персистентный массив «тел»: у каждого своя целевая ячейка
// строя и текущая позиция, которая догоняет цель пружиной — так толпа не
// прилипает к сетке, а живо подтягивается за лидером.
const followers = [];
const FULL_DETAIL_CAP = 22;   // ближайшие — полноценный атлет
const RENDER_CAP = 220;       // дальше — дешёвые силуэты, совсем далеко — не рисуем
const SPRING_K = 7.5;

function slotFor(i) {
  // Клин из рядов позади лидера: ряд r вмещает (2r+1) мест, но не шире 9.
  let idx = i, row = 1, rowLen = 3;
  while (idx >= rowLen) { idx -= rowLen; row++; rowLen = Math.min(9, 2 * row + 1); }
  const col = idx - (rowLen - 1) / 2;
  return { dz: 0.10 * row + 0.02 * Math.sin(row * 1.7), dx: col * 0.085 };
}
function syncFollowers() {
  const want = clamp(squad - 1, 0, SQUAD_CAP);
  while (followers.length < Math.min(want, RENDER_CAP + 400)) {
    followers.push({
      x: squadWorldX, z: 0.02, phase: rnd(0, 6.28), jx: rnd(-0.012, 0.012), jz: rnd(-0.01, 0.02),
      bob: rnd(0.85, 1.15),
    });
  }
  // Потери снимаем с ближних рядов — визуально «выкосило передних».
  while (followers.length > Math.min(want, RENDER_CAP + 400)) followers.shift();
}
function updateFollowers(dt) {
  for (let i = 0; i < followers.length; i++) {
    const f = followers[i], s = slotFor(i);
    const tx = squadWorldX + s.dx + f.jx, tz = s.dz + f.jz;
    f.x += (tx - f.x) * Math.min(1, SPRING_K * dt);
    f.z += (tz - f.z) * Math.min(1, (SPRING_K * 0.8) * dt);
    f.phase += dt * (3.2 + meterSpeed * 0.25) * f.bob;
  }
}

// ── ЧАСТИЦЫ И ЦИФРЫ ──────────────────────────────────────────────────────────
function burst(x, y, color, n = 10, sp = 180) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(sp * 0.3, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rnd(0.3, 0.7), color, r: rnd(2, 4) });
  }
}
// Крупные читаемые цифры с обводкой — «+2», «×2», «−15» — у места события.
function popNumber(text, color, x, y, big) {
  toasts.push({ text, color, t: 0, x, y, big: !!big });
}

// ── ФОН ЗАЛА (перспективный коридор) ────────────────────────────────────────
// Дорожка должна читаться широкой почти на всю ширину экрана у низа кадра,
// с узкими полями-стенами по бокам — не воронка с чёрными пустырями.
function drawHall() {
  const hy = HORIZON_F * H, gy = GROUND_F * H;
  const skyG = ctx.createLinearGradient(0, 0, 0, hy);
  skyG.addColorStop(0, '#0e0a08'); skyG.addColorStop(1, '#201510');
  ctx.fillStyle = skyG; ctx.fillRect(0, 0, W, hy);

  // Стены зала снаружи дорожки (worldX за пределами ±1) — тёмный кирпич,
  // не заходит на пол и не засвечивает его.
  const near = projectPoint(-1, 0), nearR = projectPoint(1, 0);
  const far = projectPoint(-1, ZFAR), farR = projectPoint(1, ZFAR);
  const wallNear = projectPoint(-1.35, 0), wallNearR = projectPoint(1.35, 0);
  const wallFar = projectPoint(-1.35, ZFAR), wallFarR = projectPoint(1.35, ZFAR);
  ctx.fillStyle = '#241a15';
  ctx.beginPath();
  ctx.moveTo(wallFar.x, wallFar.y); ctx.lineTo(far.x, far.y);
  ctx.lineTo(near.x, near.y); ctx.lineTo(wallNear.x, wallNear.y);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(wallFarR.x, wallFarR.y); ctx.lineTo(farR.x, farR.y);
  ctx.lineTo(nearR.x, nearR.y); ctx.lineTo(wallNearR.x, wallNearR.y);
  ctx.closePath(); ctx.fill();

  // Пол-трапеция — заметно светлее стен, чтобы граница дорожки читалась сразу.
  const floorG = ctx.createLinearGradient(0, hy, 0, gy);
  floorG.addColorStop(0, '#241a13'); floorG.addColorStop(1, '#3a2c1e');
  ctx.fillStyle = floorG;
  ctx.beginPath();
  ctx.moveTo(far.x, far.y); ctx.lineTo(farR.x, farR.y);
  ctx.lineTo(nearR.x, nearR.y); ctx.lineTo(near.x, near.y);
  ctx.closePath(); ctx.fill();

  // Границы дорожки — яркая тонкая линия по краям на всю глубину.
  ctx.strokeStyle = 'rgba(255,210,150,0.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(near.x, near.y); ctx.lineTo(far.x, far.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(nearR.x, nearR.y); ctx.lineTo(farR.x, farR.y); ctx.stroke();
  // Едва заметная центральная линия
  const midN = projectPoint(0, 0), midF = projectPoint(0, ZFAR);
  ctx.strokeStyle = 'rgba(242,237,227,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(midN.x, midN.y); ctx.lineTo(midF.x, midF.y); ctx.stroke();

  // Поперечные рейки — скроллятся навстречу игроку, дают чувство разгона.
  ctx.strokeStyle = 'rgba(242,237,227,0.16)'; ctx.lineWidth = 2;
  const frac = trackScroll % 1;
  for (let k = 0; k <= Math.ceil(ZFAR) + 1; k++) {
    const z = k - frac;
    if (z < 0 || z > ZFAR) continue;
    const a = projectPoint(-1, z), b = projectPoint(1, z);
    ctx.globalAlpha = 0.4 + 0.5 * (1 - z / ZFAR);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Лампы по кромке стен — компактный тёплый свет, не заливает весь экран.
  for (let k = 0; k <= 4; k++) {
    const z = ((k - frac % 1) + 5) % 5 * (ZFAR / 4.2) + 0.2;
    if (z > ZFAR) continue;
    const pr = projectZ(z);
    [-1.02, 1.02].forEach(side => {
      const p = projectPoint(side, z);
      const rad = 34 * pr.scale;
      const g = ctx.createRadialGradient(p.x, p.y - 10 * pr.scale, 1, p.x, p.y - 10 * pr.scale, rad);
      g.addColorStop(0, 'rgba(255,190,120,' + (0.4 * pr.scale) + ')'); g.addColorStop(1, 'rgba(255,190,120,0)');
      ctx.fillStyle = g; ctx.fillRect(p.x - rad, p.y - rad - 10 * pr.scale, rad * 2, rad * 2);
    });
  }
}

// ── БЛИНЫ (weight plates) ───────────────────────────────────────────────────
function mkPlate(worldX) {
  // Старт — один боец: первые блины совсем лёгкие, чтобы он их щёлкал сам.
  // Дальше HP растёт быстрее толпы — соло к сотому метру уже не тянет,
  // и это толкает игрока собирать отряд воротами и бонусами.
  const hpMax = Math.round(clamp(2 + dist / 55 + rnd(-1, 2), 2, 90));
  return { kind: 'plate', worldX, z: ZFAR, hp: hpMax, hpMax, spin: 0, wob: rnd(0, 6) };
}
function spawnPlate() {
  // Разнообразие: поодиночке или стенкой из 2-3 по ширине — не всегда одно
  // и то же место и не всегда одна и та же форма подачи.
  if (Math.random() < 0.3) {
    const n = 2 + (Math.random() < 0.35 ? 1 : 0);
    const base = spreadX(0.5);
    for (let i = 0; i < n; i++) obstacles.push(mkPlate(clamp(base + (i - (n - 1) / 2) * 0.4, -0.75, 0.75)));
  } else {
    obstacles.push(mkPlate(spreadX(0.72)));
  }
}
function drawPlate(o) {
  const p = projectPoint(o.worldX, o.z);
  const r = Math.max(16, 46 * p.scale);
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(o.spin);
  ctx.fillStyle = '#8f2a20'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a1912'; ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, 7); ctx.fill();
  ctx.restore();
  // число HP — крупно, с обводкой и тёмной плашкой-подложкой, читаемо в движении
  ctx.save(); ctx.translate(p.x, p.y);
  const fs = Math.max(15, 24 * p.scale);
  ctx.font = "900 " + fs + "px 'Courier New', monospace";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = fmt(o.hp);
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(10,8,6,0.55)';
  ctx.beginPath(); ctx.roundRect(-tw / 2 - 6, -fs / 2 - 3, tw + 12, fs + 6, 6); ctx.fill();
  ctx.lineWidth = Math.max(2.5, fs * 0.2); ctx.strokeStyle = '#14110f';
  ctx.strokeText(label, 0, 1);
  ctx.fillStyle = CHALK; ctx.fillText(label, 0, 1);
  ctx.restore();
}

// ── ВОРОТА (пары зелёное/красное на всю дорожку) ────────────────────────────
const GATE_BUFFS = [
  { type: 'mul', val: 2, label: '×2' },
  { type: 'mul', val: 3, label: '×3' },
  { type: 'add', val: 15, label: '+15' },
  { type: 'add', val: 25, label: '+25' },
];
const GATE_DEBUFFS = [
  { type: 'div', val: 2, label: '÷2' },
  { type: 'sub', val: 18, label: '−18' },
];
const GATE_DEBUFFS_HARD = [
  { type: 'div', val: 3, label: '÷3' },
  { type: 'sub', val: 32, label: '−32' },
];
function spawnGate() {
  // Первые ворота — быстро и щедро: оба прохода с плюсом, чтобы новичок с
  // одним бойцом сразу почувствовал рост. Дальше подмешиваем штраф, и чем
  // дальше забег — тем он злее (в пул добавляются жёсткие варианты). Если
  // отряд почти выкошен — «милосердные» ворота: обе стороны снова плюс.
  const early = dist < 90;
  const mercy = squad <= 4 && !early;
  const debuffPool = dist > 500 ? GATE_DEBUFFS.concat(GATE_DEBUFFS_HARD) : GATE_DEBUFFS;
  let buff = pick(GATE_BUFFS), debuff = pick(debuffPool);
  let bothGood = early || mercy;
  let bothBad = false;
  if (bothGood) debuff = pick(GATE_BUFFS);
  else if (dist > 250 && Math.random() < 0.14) { buff = pick(debuffPool); bothBad = true; } // меньшее зло
  const buffLeft = Math.random() < 0.5;
  obstacles.push({ kind: 'gate', z: ZFAR, buff, debuff, buffLeft, bothGood, bothBad, glow: 0 });
}
function drawGate(o) {
  const near = projectPoint(-1, o.z), farEdge = projectPoint(1, o.z);
  const mid = projectPoint(0, o.z);
  const barY = near.y, h = Math.max(6, 26 * projectZ(o.z).scale);
  const approach = clamp(1 - o.z / 1.3, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(t * 8);
  const leftIsBuff = o.buffLeft;
  const leftColor = o.bothBad ? '#ff4444' : (o.bothGood || leftIsBuff) ? C_GREEN : '#ff4444';
  const rightColor = o.bothBad ? '#ff4444' : (o.bothGood || !leftIsBuff) ? C_GREEN : '#ff4444';
  ctx.save();
  ctx.globalAlpha = 0.55 + 0.35 * approach * pulse;
  ctx.fillStyle = leftColor; ctx.fillRect(near.x, barY - h / 2, mid.x - near.x, h);
  ctx.fillStyle = rightColor; ctx.fillRect(mid.x, barY - h / 2, farEdge.x - mid.x, h);
  ctx.globalAlpha = 1;
  const label = (leftIsBuff ? o.buff : o.debuff).label;
  const label2 = (leftIsBuff ? o.debuff : o.buff).label;
  const fs = Math.max(11, 20 * projectZ(o.z).scale);
  ctx.font = "900 " + fs + "px 'Courier New', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3; ctx.strokeStyle = '#14110f';
  ctx.strokeText(label, (near.x + mid.x) / 2, barY); ctx.fillStyle = '#0e0e0e';
  ctx.fillText(label, (near.x + mid.x) / 2, barY);
  ctx.strokeText(label2, (mid.x + farEdge.x) / 2, barY);
  ctx.fillText(label2, (mid.x + farEdge.x) / 2, barY);
  ctx.restore();
}

// ── БОСС-ШТАНГА ──────────────────────────────────────────────────────────────
const BOSS_LOCK_Z = 0.55, BOSS_PRESS_TIME = 7.5;
function spawnBoss() {
  const hpMax = Math.round(70 + dist / 20);
  obstacles.push({ kind: 'boss', z: ZFAR, worldX: 0, hp: hpMax, hpMax, phase: 'approach', timer: BOSS_PRESS_TIME, shakeAcc: 0 });
}
function drawBoss(o) {
  const p = projectPoint(0, o.z);
  const jitter = o.phase === 'press' ? rnd(-1, 1) * (1 - o.timer / BOSS_PRESS_TIME) * 4 * p.scale : 0;
  const barW = TRACK_HALF_F * 2 * W * p.scale;
  ctx.save(); ctx.translate(p.x + jitter, p.y);
  // стойки
  ctx.fillStyle = '#4c4f58';
  ctx.fillRect(-barW / 2 - 8 * p.scale, -70 * p.scale, 10 * p.scale, 70 * p.scale);
  ctx.fillRect(barW / 2 - 2 * p.scale, -70 * p.scale, 10 * p.scale, 70 * p.scale);
  // гриф с блинами
  ctx.fillStyle = '#9aa0ab'; ctx.fillRect(-barW / 2, -14 * p.scale, barW, 10 * p.scale);
  [-barW / 2 - 4 * p.scale, barW / 2 - 6 * p.scale].forEach(bx => {
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(bx, -9 * p.scale, 24 * p.scale, 0, 7); ctx.fill();
    ctx.fillStyle = '#8f2a20'; ctx.beginPath(); ctx.arc(bx, -9 * p.scale, 15 * p.scale, 0, 7); ctx.fill();
  });
  ctx.restore();
  if (o.phase === 'press') {
    // шкала веса сверху — тускнеет по мере убывания, таймер рядом
    const bw = W * 0.7, bx0 = W / 2 - bw / 2, by = H * 0.10;
    const frac = clamp(o.hp / o.hpMax, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(bx0 - 4, by - 4, bw + 8, 22);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bx0, by, bw, 14);
    ctx.fillStyle = 'rgba(255,80,60,' + (0.55 + 0.45 * frac) + ')'; ctx.fillRect(bx0, by, bw * frac, 14);
    ctx.font = "800 12px 'Courier New', monospace"; ctx.fillStyle = CHALK; ctx.textAlign = 'center';
    ctx.fillText('ШТАНГА · ' + fmt(Math.ceil(o.hp)), W / 2, by + 11);
    const tfrac = o.timer / BOSS_PRESS_TIME;
    ctx.fillStyle = tfrac < 0.25 ? '#ff4444' : C_GOLD;
    ctx.font = "900 15px 'Courier New', monospace";
    ctx.fillText(fmt(Math.ceil(o.timer)) + ' с', W / 2, by + 34);
  }
}

// ── БОНУСЫ ───────────────────────────────────────────────────────────────────
const BONUS_TYPES = {

};

// ── ВСТРЕЧНЫЕ ВОЛНЫ (чужой отряд) ────────────────────────────────────────────
// Мясо игры: навстречу бежит вражеская толпа в едином враждебном цвете —
// перестрелка толпа-на-толпу, а не только блины и ворота. Больше народу у
// тебя — волна тает мгновенно; меньше — она докатывается и рубится врукопашную.
const ENEMY_COL = { body: '#6e1616', dark: '#440d0d', head: '#3a0c0c' };
function spawnWave() {
  // Первая волна приходит уже после того, как игрок успел подрасти воротами
  // и блинами — первые 20 секунд остаются лёгкой победой. Дальше кривая
  // экспоненциальная: отряд насыщается скорострельностью и уроном (у обоих
  // есть потолок), а волны — нет, поэтому рано или поздно волна оказывается
  // крупнее, чем отряд успевает выкосить за один заход — забег кончается
  // реальным поражением, а не потому что наскучило.
  const count = Math.round(clamp(3 + Math.pow(Math.max(0, dist) / 140, 1.6) * 10 + rnd(-2, 5), 2, 3000));
  const formation = pick(['wedge', 'wedge', 'wall', 'flanks', 'scatter']);
  const jitter = formation === 'scatter' ? Array.from({ length: 12 }, () => rnd(-0.7, 0.7)) : null;
  obstacles.push({
    kind: 'wave', worldX: spreadX(0.55), z: ZFAR, count, countMax: count,
    fireTimer: rnd(0.9, 1.4), phase: 'run', formation, jitter,
    speedMult: rnd(0.85, 1.2),
  });
}
function drawEnemyBlob(x, y, scale, phase) {
  const bob = Math.sin(phase) * 2 * scale;
  ctx.save(); ctx.translate(x, y + bob);
  ctx.fillStyle = ENEMY_COL.body;
  ctx.beginPath();
  ctx.moveTo(-8 * scale, -32 * scale); ctx.lineTo(8 * scale, -32 * scale);
  ctx.lineTo(6 * scale, -13 * scale); ctx.lineTo(-6 * scale, -13 * scale);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = ENEMY_COL.head; ctx.beginPath(); ctx.arc(0, -37 * scale, 5.2 * scale, 0, 7); ctx.fill();
  ctx.fillStyle = ENEMY_COL.dark; ctx.fillRect(-6 * scale, -13 * scale, 12 * scale, 11 * scale);
  ctx.restore();
}
// Строй волны — не всегда один и тот же клин: стена во всю ширину, два
// фланга по краям с разрывом посредине или рассыпуха вразнобой.
function waveSlot(o, i, shown) {
  if (o.formation === 'wall') {
    const cols = shown, col = i;
    return { dx: (col - (cols - 1) / 2) * 0.09, dz: (i % 2) * 0.02 };
  }
  if (o.formation === 'flanks') {
    const half = Math.ceil(shown / 2);

function tryFire(dt, dmg) {
  const targets = obstacles.filter(o =>
    (o.kind === 'plate' && o.hp > 0) ||
    (o.kind === 'boss' && o.phase === 'press' && o.hp > 0) ||
    (o.kind === 'wave' && o.count > 0));
  if (!targets.length) return;
  targets.sort((a, b) => a.z - b.z);
  const w = WEAPONS[weaponLevel];
  for (const target of targets) {
    const activeOnTarget = bullets.filter(bl => bl.target === target).length;
    if (activeOnTarget < 4) {
      const perPellet = Math.max(1, dmg * w.dmgMult);
      const spread = w.spread;
      for (let i = 0; i < w.pellets; i++) {
        const off = w.pellets === 1 ? rnd(-0.03, 0.03) : (i - (w.pellets - 1) / 2) * spread;

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);

}
function shade(hex, k) {

}

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  cv.classList.remove('active');
  if (id === 'game') cv.classList.add('active');
  else document.getElementById(id).classList.add('active');
}
function flash(color, ms) {
  const el = document.getElementById('flash');
  el.className = color; el.style.opacity = 1;
  setTimeout(() => { el.style.opacity = 0; }, ms || 200);
}

(function buildFighterCards() {
  const row = document.getElementById('fighters-row');
  Object.entries(FIGHTERS).forEach(([key, f]) => {
    const card = document.createElement('div');
    card.className = 'fighter-card';
    const c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    const cc = c.getContext('2d');
    cc.translate(74, 152);
    drawAthlete(cc, key, { idle: true, scale: 1.85 });
    const img = new Image();
    img.src = 'assets/game/' + key + '.jpg';
    img.onload = () => { card.replaceChild(img, c); };
    card.appendChild(c);
    const nm = document.createElement('div');
    nm.className = 'fighter-name'; nm.textContent = f.name;
    card.appendChild(nm);
    const tag = document.createElement('div');
    tag.className = 'fighter-tag'; tag.textContent = f.tag;
    card.appendChild(tag);
    card.onclick = () => selectFighter(key);
    row.appendChild(card);
  });
})();

function selectFighter(key) {
  selectedFighter = key;
  startHum();
  resetGame();
  showScreen('game');
}

// ── КОНЕЦ ЗАБЕГА (замедление → вспышка → пауза → результат) ─────────────────
function die() {
  if (dying) return;
  dying = true; state = 'dying';
  sDie(); shake(22); hitStop(0.05); flash('red', 500);
  burst(W / 2, GROUND_F * H - 40, C_RAGE, 30, 300);
  const d = Math.floor(clamp(dist, 0, 50000));
  const sc = Math.floor(clamp(score, 0, 100000));
  const sq = Math.floor(clamp(maxSquad, 0, 5000));
  if (d > best) { best = d; localStorage.setItem('squad_best', best); }
  lastResult = { distance: d, score: sc, squad: sq, fighter: selectedFighter, gameTimestamp: Date.now() };
  let elapsed = 0;
  const slowDown = setInterval(() => {
    elapsed += 60;
    timeScale = Math.max(0.08, 1 - elapsed / 900);
  }, 60);
  setTimeout(() => {
    clearInterval(slowDown);
    finishToResult(d, sc, sq);
  }, 1000);
}
function finishToResult(d, sc, sq) {
  const art = document.getElementById('result-art');
  art.style.display = 'none';
  art.onload = () => { art.style.display = 'block'; };
  art.onerror = () => { art.style.display = 'none'; };
  art.src = 'assets/game/' + selectedFighter + '.jpg';
  document.getElementById('result-score').textContent = d + ' м · 🥤 ' + sc;
  document.getElementById('result-stats').textContent = 'макс. отряд: ' + sq;
  document.getElementById('result-quip').textContent = 'ПРИВЕТ АТЛЕТ! ' + sq + pick(QUIPS);
  document.getElementById('result-best').textContent = 'рекорд: ' + best + ' м';
  document.getElementById('result-status').textContent = '';
  state = 'result';
  showScreen('screen-result');
}
function restartGame() {
  if (lastResult) submitResult(lastResult);
  lastResult = null;
  resetGame();
  showScreen('game');
}
async function submitResult(result) {
  if (!window.Telegram?.WebApp) return { ok: false, local: true };
  const initData = Telegram.WebApp.initData || '';
  try {
    const resp = await fetch('/game-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData, game: 'squad', result }),
    });
    return { ok: resp.ok, status: resp.status, body: await resp.text() };
  } catch (e) {
    console.error('[game] submit error:', e);
    return { ok: false, error: e.message };
  }
}
async function submitAndClose() {
  const statusEl = document.getElementById('result-status');
  if (!window.Telegram?.WebApp) {
    statusEl.textContent = 'это локальный прототип — результат никуда не отправляю';
    return;
  }
  if (lastResult) {
    statusEl.textContent = 'Записываю...';
    const r = await submitResult(lastResult);
    if (!r.ok) { statusEl.textContent = '❌ Не записал — жми ещё раз'; return; }
    statusEl.textContent = '✅ Записал';
    lastResult = null;
  }
  try { Telegram.WebApp.close(); } catch (e) {}
}

// ── АПДЕЙТ ───────────────────────────────────────────────────────────────────
function squadRadius() { return 0.10 + Math.min(60, squad) / 60 * 0.16; }
let squadPulse = 0; // визуальный «раздув» толпы на воротах/бонусах — тело, не только счётчик

function update(dt) {
  t += dt;
  shakeAmp *= Math.exp(-6 * dt); if (shakeAmp < 0.05) shakeAmp = 0;
  squadPulse *= Math.exp(-5 * dt);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  toasts.forEach(ts => { ts.t += dt; ts.y -= (ts.big ? 42 : 30) * dt; });
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > 1.3) toasts.splice(i, 1);

  if (state !== 'game' && state !== 'dying') return;

  if (heldLeft) squadWorldX = clamp(squadWorldX - 1.1 * dt, -0.95, 0.95);
  if (heldRight) squadWorldX = clamp(squadWorldX + 1.1 * dt, -0.95, 0.95);
  syncFollowers();
  updateFollowers(dt);

  if (rageT > 0) rageT -= dt;
  const rage = rageT > 0;
  meterSpeed = Math.min(SPEED_CAP, meterSpeed + SPEED_RAMP * dt);
  depthSpeed = meterSpeed / 12 * (rage ? 1.4 : 1);
  dist += meterSpeed * dt * (rage ? 1.3 : 1);
  trackScroll += depthSpeed * dt * 3.1;
  updateHum(clamp((meterSpeed - SPEED_START) / (SPEED_CAP - SPEED_START), 0, 1));

  if (Math.floor(dist / 500) > lastMile) {
    lastMile = Math.floor(dist / 500);
    popNumber(lastMile * 500 + ' м!', C_GOLD, W / 2, H * 0.32, true);
  }

  // Оружие сгорает по таймеру — прогресс не навсегда, за ящиками нужно идти
  // постоянно. Стартовый шейкер (level 0) бессрочный.
  if (weaponLevel > 0) {
    weaponTimer -= dt;
    if (weaponTimer <= 0) {
      weaponLevel = Math.max(0, weaponLevel - 1);
      weaponTimer = weaponLevel > 0 ? WEAPONS[weaponLevel].dur : 0;
      sWeaponDown();
      popNumber('ОРУЖИЕ ОСЛАБЛО: ' + WEAPONS[weaponLevel].name, '#ff8a4a', W / 2, H * 0.26);
    }
  }

  // Стрельба отряда: скорострельность и урон растут вместе с толпой, множитель
  // оружия — сверху.
  const w = WEAPONS[weaponLevel];
  const fireRate = clamp(1.6 + squad * 0.06, 1.6, 10) * (rage ? 2.6 : 1) * w.fireMult;
  const dmg = clamp(1.9 + squad * 0.04, 1.9, 24);
  fireTimer -= dt;
  if (fireTimer <= 0) { tryFire(dt, dmg); fireTimer = 1 / fireRate; }

  // Босс: если ещё не запущен и прошли рубеж — спавним (отдельный ритм от
  // потока, это рубеж, а не рядовое событие).
  if (dist >= nextBossMile && !obstacles.some(o => o.kind === 'boss')) {
    spawnBoss(); nextBossMile += 1200;
  }
  // Поток рядовых событий — честный рандом каждый забег: взвешенный выбор
  // типа, без дыр в плотности, без серий одного типа подряд.
  if (state === 'game' && dist >= nextEventAt) {
    const kind = pickEventType();
    if (kind === 'plate') spawnPlate();
    else if (kind === 'gate') spawnGate();
    else if (kind === 'bonus') spawnBonus();
    else if (kind === 'wave') spawnWave();
    else if (kind === 'crate') spawnCrate();
    nextEventAt = dist + rnd(15, 26);
  }

  // Пули: урон целочисленный сразу — HP/численность целые, никаких дробных
  // хвостов на экране и честный обратный отсчёт.
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.z += BULLET_SPEED * dt;
    bl.life -= dt;
    const alive = obstacles.includes(bl.target) && targetHpLeft(bl.target) > 0;
    if (!alive || bl.life <= 0) { bullets.splice(i, 1); continue; }
    if (bl.z >= bl.target.z - 0.05) {
      let target = bl.target;
      let pierceLeft = bl.pierce || 1;
      while (target && pierceLeft > 0) {
        const before = targetHpLeft(target);
        const dmgInt = Math.max(1, Math.round(bl.dmg));
        if (target.kind === 'wave') target.count = Math.max(0, target.count - dmgInt);
        else target.hp = Math.max(0, target.hp - dmgInt);
        const p = projectPoint(target.worldX ?? 0, target.z);
        if (target.kind === 'boss') sBossHit(); else if (target.kind === 'wave') sEnemyHit(); else sTick();
        shake(target.kind === 'boss' ? 1.2 : 1);
        burst(p.x, p.y, target.kind === 'wave' ? '#ff8a8a' : '#f2ede3', 4, 90);
        const after = targetHpLeft(target);
        if (after <= 0 && before > 0) {
          if (target.kind === 'plate') {
            comboHit();
            const gain = target.hpMax * 3 * comboMult();
            score += gain;
            shake(5); sPop(); hitStop(0.02);
            burst(p.x, p.y, '#ffb347', 20, 260);
            popNumber('+' + fmt(gain), C_GOLD, p.x, p.y - 10, true);
            obstacles.splice(obstacles.indexOf(target), 1);
          } else if (target.kind === 'wave') {
            const gain = target.countMax * 2;
            score += gain;
            shake(4); sPop();
            burst(p.x, p.y, '#ff8a8a', 18, 240);
            popNumber('ВОЛНА СМЕТЕНА +' + fmt(gain), C_GREEN, p.x, p.y - 10, true);
            obstacles.splice(obstacles.indexOf(target), 1);
          }
        }
        pierceLeft -= 1;
        if (pierceLeft > 0) {
          // Блинострел летит насквозь — ищем следующую цель чуть дальше по глубине.
          const rest = obstacles.filter(o => o !== target && o.z > target.z &&
            ((o.kind === 'plate' && o.hp > 0) || (o.kind === 'wave' && o.count > 0)));
          rest.sort((a, b) => a.z - b.z);
          target = rest[0];
        } else target = null;
      }
      bullets.splice(i, 1);
    }
  }

  // Препятствия: движение к игроку + столкновения
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (o.kind === 'plate') {
      o.z -= depthSpeed * dt; o.spin += dt * 1.4;
      if (o.z <= 0.05) {
        if (o.hp > 0) {
          if (shield > 0) {
            shield -= 1; sShield();
            popNumber('ПОЯС СПАС', '#7ea8ff', W / 2, GROUND_F * H - 90);
            burst(W / 2, GROUND_F * H - 60, '#7ea8ff', 14, 240);
            shake(4);
          } else {
            const loss = Math.min(squad, Math.round(o.hp));
            squad = Math.max(0, squad - loss);
            comboBreak(); weaponBurn(loss);
            sHit(); shake(6 + Math.min(20, loss * 0.7)); hitStop(loss > 8 ? 0.05 : 0);
            flash('red', 220);
            popNumber('−' + fmt(loss), '#ff4444', W / 2, GROUND_F * H - 90, loss > 15);
            burst(W / 2, GROUND_F * H - 60, C_RAGE, Math.min(30, 10 + loss), 260);
          }
        }
        obstacles.splice(i, 1);
        if (squad <= 0) { die(); return; }
      }
      continue;
    }
    if (o.kind === 'gate') {
      o.z -= depthSpeed * dt;
      if (o.z <= 0.05) {
        const onLeft = squadWorldX < 0;
        const eff = onLeft === o.buffLeft ? o.buff : o.debuff;
        const p = projectPoint(squadWorldX, 0.05);
        if (eff.type === 'mul') { squad = Math.min(SQUAD_CAP, Math.round(squad * eff.val)); score += 40; }
        else if (eff.type === 'add') { squad = Math.min(SQUAD_CAP, squad + eff.val); score += 20; }
        else if (eff.type === 'div') { squad = Math.max(1, Math.round(squad / eff.val)); }
        else if (eff.type === 'sub') { squad = Math.max(0, squad - eff.val); }
        const good = eff.type === 'mul' || eff.type === 'add';
        if (good) {
          sGateUp(); shake(4); squadPulse = 1; flash('green', 200);
          burst(p.x, p.y - 30, C_GREEN, 22, 240);
          for (let k = 0; k < 3; k++) popNumber(eff.label, C_GREEN, p.x + rnd(-30, 30), p.y - 40 - k * 22, true);
        } else {
          comboBreak();
          sGateDown(); shake(7); hitStop(0.03); flash('red', 220);
          burst(p.x, p.y - 20, '#ff4444', 16, 220);
          popNumber(eff.label, '#ff4444', p.x, p.y - 40, true);
        }
        maxSquad = Math.max(maxSquad, squad);
        obstacles.splice(i, 1);
        if (squad <= 0) { die(); return; }
      }
      continue;
    }
    if (o.kind === 'boss') {
      if (o.phase === 'approach') {
        o.z -= depthSpeed * dt;
        if (o.z <= BOSS_LOCK_Z) { o.z = BOSS_LOCK_Z; o.phase = 'press'; shake(6); popNumber('ЖМИ ШТАНГУ!', C_GOLD, W / 2, H * 0.28, true); }
      } else if (o.phase === 'press') {
        o.timer -= dt;
        o.hp -= squad * 1.15 * dt;
        // дрожь стойки растёт по мере убывания времени — нарастающее напряжение
        if (o.timer < BOSS_PRESS_TIME * 0.3) shake(1.2);
        if (o.hp <= 0) {
          hitStop(0.1); shake(24); sBossWin(); sRoar();
          flash('white', 90); setTimeout(() => flash('gold', 380), 90);
          const p = projectPoint(0, o.z);
          burst(p.x, p.y, C_GOLD, 46, 340);
          score += 400; squad = Math.min(SQUAD_CAP, squad + 40); maxSquad = Math.max(maxSquad, squad);
          popNumber('ШТАНГА ВЗЯТА! +40', C_GOLD, W / 2, H * 0.3, true);
          obstacles.splice(i, 1);
        } else if (o.timer <= 0) {
          const loss = Math.round(squad * 0.5);
          squad = Math.max(0, squad - loss);
          comboBreak(); weaponBurn(loss);
          hitStop(0.06); shake(24); sBossLose(); flash('red', 420);
          const p = projectPoint(0, o.z);
          burst(p.x, p.y, C_RAGE, 34, 300);
          popNumber('−' + fmt(loss), '#ff4444', W / 2, H * 0.3, true);
          obstacles.splice(i, 1);
          if (squad <= 0) { die(); return; }
        }
      }
      continue;
    }
    if (o.kind === 'wave') {
      o.z -= depthSpeed * dt * (o.speedMult || 1);
      // Ответный огонь: пока волна в радиусе, она периодически бьёт по
      // отряду — постоянное давление, а не только финальная свалка.
      if (o.z < 2.1 && o.count > 0) {
        o.fireTimer -= dt;
        if (o.fireTimer <= 0) {
          const chip = Math.max(1, Math.round(clamp(o.count * 0.045, 1, 9)));
          const actualChip = Math.min(squad, chip);
          if (actualChip > 0) {
            squad = Math.max(0, squad - actualChip);
            comboBreak(); weaponBurn(actualChip);
            sEnemyShot(); shake(2 + Math.min(6, actualChip * 0.5));
            flash('red', 120);
            popNumber('−' + fmt(actualChip), '#ff8a4a', W / 2, GROUND_F * H - 70);
            if (squad <= 0) { die(); return; }
          }
          o.fireTimer = clamp(1.5 - o.count * 0.01, 0.35, 1.5);
        }
      }
      if (o.z <= 0.05) {
        // Ближний бой: если отряд больше — продавил и потерял вполовину
        // меньше, чем в лобовом размене (иначе победа стоила бы столько же,
        // сколько поражение). Если волна больше — размен полный, отряд тает.
        const clash = Math.min(squad, o.count);
        const enemyLeft = o.count - clash;
        const loss = enemyLeft <= 0 ? Math.min(squad - 1, Math.round(clash * 0.5)) : clash;
        squad = Math.max(0, squad - loss);
        comboBreak(); weaponBurn(loss);
        sMelee(); shake(10 + Math.min(16, loss * 0.4)); hitStop(loss > 10 ? 0.06 : 0.02);
        flash('red', 260);
        const p = projectPoint(squadWorldX, 0.05);
        burst(p.x, p.y - 20, '#ff4444', Math.min(40, 14 + loss), 280);
        if (enemyLeft <= 0) {
          score += o.countMax;
          popNumber('ОТРЯД ПРОДАВИЛ −' + fmt(loss), C_GREEN, W / 2, GROUND_F * H - 90, true);
        } else {
          popNumber('−' + fmt(loss), '#ff4444', W / 2, GROUND_F * H - 90, true);
        }
        obstacles.splice(i, 1);
        if (squad <= 0) { die(); return; }
      }
      continue;
    }
  }

  // Бонусы
  for (let i = bonuses.length - 1; i >= 0; i--) {
    const b = bonuses[i]; b.t += dt;
    b.z -= depthSpeed * dt;
    if (b.z <= 0.16 && Math.abs(b.worldX - squadWorldX) < 0.22) {
      const p = projectPoint(squadWorldX, 0.1);
      if (b.type === 'preworkout') { rageT = 5; popNumber('ПРЕДТРЕН! ЯРОСТЬ', C_RAGE, p.x, p.y - 40, true); flash('orange', 260); }
      else if (b.type === 'belt') { shield = Math.min(3, shield + 1); popNumber('ЩИТ: ПОЯС', '#7ea8ff', p.x, p.y - 40, true); }
      else { squad = Math.min(SQUAD_CAP, squad + 5); maxSquad = Math.max(maxSquad, squad); squadPulse = 1; popNumber('+5', '#67c26a', p.x, p.y - 40, true); }
      sPower(); shake(3); burst(p.x, p.y - 20, BONUS_TYPES[b.type].color, 16, 220);
      bonuses.splice(i, 1); continue;
    }
    if (b.z <= 0) bonuses.splice(i, 1);
  }

  // Ящики с оружием
  for (let i = crates.length - 1; i >= 0; i--) {
    const cr = crates[i]; cr.t += dt;
    cr.z -= depthSpeed * dt;
    if (cr.z <= 0.16 && Math.abs(cr.worldX - squadWorldX) < 0.24) {
      weaponLevel = cr.idx; weaponTimer = WEAPONS[cr.idx].dur;
      const p = projectPoint(squadWorldX, 0.1);
      sWeaponUp(); shake(5); flash('gold', 220);
      burst(p.x, p.y - 20, WEAPONS[cr.idx].color, 20, 240);
      popNumber(WEAPONS[cr.idx].name + '!', WEAPONS[cr.idx].color, p.x, p.y - 46, true);
      crates.splice(i, 1); continue;
    }
    if (cr.z <= 0) crates.splice(i, 1);
  }

  maxSquad = Math.max(maxSquad, squad);
}

// ── РЕНДЕР ───────────────────────────────────────────────────────────────────
function render() {
  if (state === 'select') return;
  ctx.save();
  if (shakeAmp > 0) ctx.translate(rnd(-1, 1) * shakeAmp, rnd(-1, 1) * shakeAmp);

  drawHall();

  if (rageT > 0) {
    ctx.fillStyle = 'rgba(255,90,54,' + (0.12 + 0.06 * Math.sin(t * 22)) + ')';
    ctx.fillRect(0, 0, W, H);
    if (rageT < 1) ctx.fillStyle = 'rgba(255,90,54,' + (Math.sin(t * 26) > 0 ? 0.22 : 0) + ')', ctx.fillRect(0, 0, W, H);
  }

  const drawables = [...obstacles, ...bonuses, ...crates].sort((a, b) => b.z - a.z);
  drawables.forEach(o => {
    if (o.kind === 'plate') drawPlate(o);
    else if (o.kind === 'gate') drawGate(o);
    else if (o.kind === 'boss') drawBoss(o);
    else if (o.kind === 'wave') drawWave(o);
    else if (o.idx !== undefined) drawCrate(o);
    else drawBonus(o);
  });

  // Пули
  bullets.forEach(bl => {
    const p = projectPoint(bl.worldX, bl.z);
    const r = Math.max(2, 6 * p.scale);
    ctx.fillStyle = bl.color || '#ffd700';
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  });

  // Толпа: дальние ряды — дёшево, ближние — полный атлет, лидер — крупнее всех
  const f = FIGHTERS[selectedFighter];
  const drawList = [];
  for (let i = 0; i < followers.length && i < RENDER_CAP; i++) {
    const fo = followers[i];
    const p = projectPoint(fo.x, fo.z);
    drawList.push({ z: fo.z, p, phase: fo.phase, full: i < FULL_DETAIL_CAP });
  }
  const leaderP = projectPoint(squadWorldX, 0.01);
  drawList.push({ z: -1, p: leaderP, leader: true });
  drawList.sort((a, b) => b.z - a.z);
  drawList.forEach(d => {
    const sc = (d.leader ? 2.3 : 1.5) * d.p.scale * (1 + squadPulse * 0.18);
    if (d.leader) {
      ctx.save(); ctx.translate(d.p.x, d.p.y);
      drawAthlete(ctx, selectedFighter, { scale: sc, run: Math.sin(t * 14), rage: rageT > 0, shield: shield > 0 });
      ctx.restore();
    } else if (d.full) {
      ctx.save(); ctx.translate(d.p.x, d.p.y + Math.sin(d.phase) * 2);
      drawAthlete(ctx, selectedFighter, { scale: sc, run: Math.sin(d.phase * 3.4) });
      ctx.restore();
    } else {
      drawFollowerSimple(d.p.x, d.p.y, sc * 0.62, f, d.phase);
    }
  });

  parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 1.6); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.r, p.r); });
  ctx.globalAlpha = 1;

  toasts.forEach(ts => {
    ctx.globalAlpha = Math.max(0, 1 - ts.t / 1.3);
    const fs = ts.big ? 24 : 17;
    ctx.font = "900 " + fs + "px 'Courier New', monospace"; ctx.textAlign = 'center';
    ctx.lineWidth = ts.big ? 5 : 3.5; ctx.strokeStyle = 'rgba(10,8,6,0.9)';
    const half = ctx.measureText(ts.text).width / 2;
    const tx = Math.max(half + 8, Math.min(W - half - 8, ts.x));
    ctx.strokeText(ts.text, tx, ts.y);
    ctx.fillStyle = ts.color; ctx.fillText(ts.text, tx, ts.y);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left'; ctx.fillStyle = C_GOLD;
  ctx.font = "900 15px 'Courier New', monospace";
  ctx.fillText('ОТРЯД', 20, 32);
  ctx.font = "900 30px 'Courier New', monospace";
  ctx.fillText(fmt(squad), 20, 62);
  ctx.textAlign = 'right'; ctx.fillStyle = '#e94f64'; ctx.font = "900 20px 'Courier New', monospace";
  ctx.fillText('🥤 ' + fmt(score), W - 20, 32);
  ctx.fillStyle = 'rgba(242,237,227,0.7)'; ctx.font = "700 14px 'Courier New', monospace";
  ctx.fillText(fmt(Math.floor(dist)) + ' м', W - 20, 54);
  if (combo >= 3) {
    ctx.textAlign = 'left'; ctx.fillStyle = C_GOLD; ctx.font = "800 13px 'Courier New', monospace";
    ctx.fillText('серия ' + fmt(combo) + (comboMult() > 1 ? ' ×' + fmt(comboMult()) : ''), 20, 82);
  }
  // Оружие — постоянно на виду: иконка-квадрат + название, чтобы игрок видел,
  // что держит и что потеряет.
  {
    const wc = WEAPONS[weaponLevel];
    ctx.textAlign = 'left';
    ctx.fillStyle = wc.color; ctx.fillRect(20, combo >= 3 ? 92 : 78, 12, 12);
    ctx.font = "800 12px 'Courier New', monospace"; ctx.fillStyle = 'rgba(242,237,227,0.85)';
    ctx.fillText(wc.name, 38, (combo >= 3 ? 92 : 78) + 10);
    if (weaponLevel > 0) {
      const frac = clamp(weaponTimer / WEAPONS[weaponLevel].dur, 0, 1);
      const by2 = (combo >= 3 ? 92 : 78) + 16;
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(20, by2, 110, 3);
      ctx.fillStyle = wc.color; ctx.fillRect(20, by2, 110 * frac, 3);
    }
  }
  let ix = W - 20, iy = 78;
  const pw = (label, color, frac) => {
    ctx.textAlign = 'right'; ctx.font = "800 12px 'Courier New', monospace"; ctx.fillStyle = color;
    ctx.fillText(label, ix, iy);
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(ix - 90, iy + 6, 90, 4);
    ctx.fillStyle = color; ctx.fillRect(ix - 90, iy + 6, 90 * frac, 4);
    iy += 24;
  };
  if (rageT > 0) pw('ЯРОСТЬ', C_RAGE, rageT / 5);
  if (shield > 0) { ctx.textAlign = 'right'; ctx.font = "800 12px 'Courier New', monospace"; ctx.fillStyle = '#7ea8ff'; ctx.fillText('ПОЯС ×' + fmt(shield), ix, iy); }

  ctx.restore();
}

// ── ЦИКЛ ─────────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const raw = Math.min(0.033, (now - last) / 1000); last = now;
  let dt = raw * timeScale;
  if (hitStopT > 0) { hitStopT -= raw; dt *= 0.06; }
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
</script>

</body>
