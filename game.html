<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="title">Кач-Раннер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(135deg, #14110f 0%, #221812 50%, #0d1a2e 100%);
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  #game-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100svh;
    touch-action: none; display: none;
  }
  #game-canvas.active { display: block; }

  .screen {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    padding: 16px; overflow-y: auto;
  }
  .screen.active { display: flex; }
  .screen-inner {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  h1 {
    font-size: 24px; text-align: center; text-transform: uppercase;
    letter-spacing: 3px; color: #ffd700; text-shadow: 0 0 20px #ffd700aa;
  }
  .subtitle { font-size: 13px; color: #aaa; text-align: center; line-height: 1.5; }
  .subtitle b { color: #ffd700; }

  /* ── ВЫБОР КАЧКА ── */
  .fighters-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    width: 100%; max-width: 360px;
  }
  .fighter-card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,215,0,0.3);
    border-radius: 12px; padding: 12px; cursor: pointer; text-align: center;
    transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .fighter-card:hover, .fighter-card:active {
    border-color: #ffd700; transform: scale(1.04); box-shadow: 0 0 20px #ffd70055;
  }
  .fighter-card canvas { width: 100%; aspect-ratio: 1; }
  .fighter-card img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block;
  }
  .fighter-name {
    margin-top: 8px; font-size: 13px; text-transform: uppercase;
    letter-spacing: 1px; color: #ffd700;
  }
  .fighter-tag { font-size: 10px; color: #aaa; margin-top: 2px; }

  .controls-hint { font-size: 12px; color: #888; text-align: center; line-height: 1.7; }
  .controls-hint b { color: #ddd; }

  /* ── РЕЗУЛЬТАТ ── */
  #screen-result .screen-inner { text-align: center; }
  .result-title {
    font-size: 30px; font-weight: bold; text-transform: uppercase;
    letter-spacing: 3px; color: #ff4444; text-shadow: 0 0 20px #ff4444;
  }
  .result-title.win {
    color: #ffd700; text-shadow: 0 0 24px #ffd700cc, 0 0 46px #ffd70066;
    font-size: 36px; animation: winPulse 1.7s ease-in-out infinite;
  }
  @keyframes winPulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 24px #ffd700cc, 0 0 46px #ffd70066; }
    50% { transform: scale(1.06); text-shadow: 0 0 34px #ffd700ee, 0 0 64px #ffd70099; }
  }
  /* Победный экран — самый сочный в игре: тёплое сияние вокруг, а не просто
     тёмная подложка, как у экрана провала. */
  #screen-win { background: radial-gradient(circle at 50% 30%, rgba(255,215,0,0.22), rgba(20,17,15,0) 62%); }
  #win-art { box-shadow: 0 0 44px rgba(255,215,0,0.55), 0 0 0 2px rgba(255,215,0,0.4); }
  .result-score { font-size: 20px; color: #ffd700; }
  #result-art, #win-art {
    width: 104px; height: 104px; object-fit: contain; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,215,0,0.4); display: none; margin: 0 auto;
  }
  .result-stats { font-size: 12px; color: #aaa; }
  .result-quip { font-size: 13px; color: #ccc; line-height: 1.6; max-width: 340px; }
  .result-best { font-size: 12px; color: #888; }
  .result-btn {
    background: rgba(255,215,0,0.15); border: 2px solid #ffd700; border-radius: 12px;
    color: #ffd700; font-family: inherit; font-size: 15px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 2px; padding: 14px 32px; cursor: pointer;
    transition: background 0.2s, transform 0.1s; min-width: 220px;
  }
  .result-btn:hover { background: rgba(255,215,0,0.3); }
  .result-btn:active { transform: scale(0.97); }
  .result-btn.retry { border-color: #00c850; color: #00c850; background: rgba(0,200,80,0.1); }
  .result-btn.retry:hover { background: rgba(0,200,80,0.25); }
  .result-btn.continue { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.15); }
  .result-btn.continue:hover { background: rgba(255,215,0,0.3); }
  #result-status, #win-status { color: #aaa; font-size: 13px; min-height: 16px; }

  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  #flash.red { background: rgba(255,40,40,0.35); }
  #flash.gold { background: rgba(255,215,0,0.45); }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="flash"></div>

<!-- ЭКРАН 1: выбор качка -->
<div id="screen-select" class="screen active">
  <div class="screen-inner">
    <h1 data-i18n="title">Кач-Раннер</h1>
    <div class="subtitle" data-i18n-html="subtitle">Беги по залу, собирай спортпит, не влетай в гантели —<br>я засеку, докуда добежишь. <b>Кем побежишь?</b></div>
    <div class="fighters-row" id="fighters-row"></div>
    <div class="controls-hint" data-i18n-html="controls">
      <b>тап / пробел</b> — прыжок (двойной — в воздухе)<br>
      <b>свайп вниз / ↓</b> — подкат под штангу
    </div>
  </div>
</div>

<!-- ЭКРАН 3: результат (провал) -->
<div id="screen-result" class="screen">
  <div class="screen-inner">
    <div class="result-title" data-i18n="resultTitle">Отказ</div>
    <img id="result-art" src="" alt="">
    <div class="result-score" id="result-score">0 м · 🥤 0</div>
    <div class="result-stats" id="result-stats"></div>
    <div class="result-quip" id="result-quip"></div>
    <div class="result-best" id="result-best"></div>
    <button class="result-btn retry" onclick="restartGame()" data-i18n="retryBtn">🔄 Ещё подход</button>
    <button class="result-btn" onclick="submitAndClose()" data-i18n="closeBtn">❌ Закрыть</button>
    <div id="result-status"></div>
  </div>
</div>

<!-- ЭКРАН 4: результат (финиш забега) -->
<div id="screen-win" class="screen">
  <div class="screen-inner">
    <div class="result-title win" data-i18n="winTitle">Финиш!</div>
    <img id="win-art" src="" alt="">
    <div class="result-score" id="win-score">0 м · 🥤 0</div>
    <div class="result-stats" id="win-stats"></div>
    <div class="result-quip" id="win-quip"></div>
    <div class="result-best" id="win-best"></div>
    <button class="result-btn continue" onclick="continueRun()" data-i18n="continueBtn">🏃 Бежать дальше</button>
    <button class="result-btn retry" onclick="restartGame()" data-i18n="newRunBtn">🔄 Новый забег</button>
    <button class="result-btn" onclick="submitAndClose('win-status')" data-i18n="closeBtn">❌ Закрыть</button>
    <div id="win-status"></div>
  </div>
</div>

<script>
'use strict';
// Expand to full screen immediately (как у совы)
// disableVerticalSwipes — иначе свайп вниз для подката закрывает мини-приложение:
// Telegram перехватывает вертикальный жест раньше, чем до канваса доходит
// pointermove. Метод с Bot API 7.7, на старых клиентах его просто нет.
if (window.Telegram?.WebApp) {
  const tg = Telegram.WebApp;
  try { tg.ready(); } catch (e) {}
  tg.expand();
  try { tg.disableVerticalSwipes(); } catch (e) {}
}

// ── ЯЗЫК ─────────────────────────────────────────────────────────────────────
// Страницу отдаёт FileResponse — шаблонизатора нет, и telegram_id (а с ним язык
// из БД) на этот момент ещё не подтверждён подписью initData: signature-проверка
// нужна только для отправки результата (см. game_server.validate_init_data), а
// прочитать language_code можно и без неё. Тот же список СНГ-языков, что и в
// i18n.normalize (см. i18n.py:_CYRILLIC_SPHERE) — держать два места в согласии
// руками рискованно, но модуль на Python, а страница — статический файл без
// сборки, импортировать оттуда нечего.
const LANG = (function () {
  try {
    // ?lang= из ссылки — это выбор пользователя (users.lang), он главнее
    // языка клиента: человек с русским телефоном мог выбрать English.
    const fromUrl = new URLSearchParams(window.location.search).get('lang');
    if (fromUrl === 'ru' || fromUrl === 'en') return fromUrl;
    const raw = window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code || navigator.language || 'ru';
    const base = String(raw).toLowerCase().replace('_', '-').split('-')[0];
    const cyrillicSphere = new Set(['ru', 'uk', 'be', 'kk', 'ky', 'hy', 'az', 'uz']);
    return cyrillicSphere.has(base) ? 'ru' : 'en';
  } catch (e) { return 'ru'; }
})();
document.documentElement.lang = LANG;

// Ключи — по русскому значению, как в остальном проекте (locales/ru.json).
// Каждая запись — пара [ru, en]; недостающий английский тут не бывает, в
// отличие от каталога i18n.py, — весь список статичен и виден целиком.
const STR = {
  title: ['Кач-Раннер', 'Gym Runner'],
  subtitle: [
    'Беги по залу, собирай спортпит, не влетай в гантели —<br>я засеку, докуда добежишь. <b>Кем побежишь?</b>',
    "Run through the gym, grab supplements, dodge the dumbbells —<br>I'll clock how far you get. <b>Who are you running as?</b>",
  ],
  controls: [
    '<b>тап / пробел</b> — прыжок (двойной — в воздухе)<br><b>свайп вниз / ↓</b> — подкат под штангу',
    '<b>tap / space</b> — jump (double — mid-air)<br><b>swipe down / ↓</b> — slide under the bar',
  ],
  resultTitle: ['Отказ', 'Failure'],
  retryBtn: ['🔄 Ещё подход', '🔄 Another set'],
  closeBtn: ['❌ Закрыть', '❌ Close'],
  greeting: ['ПРИВЕТ АТЛЕТ! ', 'HEY ATHLETE! '],
  unit: ['м', 'm'],
  hudRecord: ['рекорд ', 'record '],
  resultBest: ['рекорд: ', 'record: '],
  resultStats: ['лучшая серия: ', 'best streak: '],
  resultStatsPickups: [' · пауэрапов: ', ' · power-ups: '],
  localPrototype: [
    'это локальный прототип — результат никуда не отправляю',
    "local prototype — I'm not sending this anywhere",
  ],
  logging: ['Записываю...', 'Logging...'],
  notLogged: ['❌ Не записал — жми ещё раз', "❌ Didn't log it — hit it again"],
  logged: ['✅ Записал', '✅ Logged it'],
  rivalWarn: ['ВЫШИБАЛА!', 'ENFORCER!'],
  streakPrefix: ['СЕРИЯ ×', 'STREAK ×'],
  shieldSaved: ['КРЕАТИН СПАС', 'CREATINE SAVED YOU'],
  shieldPickup: ['ЩИТ: КРЕАТИН', 'SHIELD: CREATINE'],
  rageToast: ['ПРЕДТРЕНИК: ЯРОСТЬ!', 'PRE-WORKOUT: RAGE!'],
  magnetToast: ['ГЕЙНЕР-МАГНИТ', 'GAINER MAGNET'],
  hudRage: ['ЯРОСТЬ', 'RAGE'],
  hudMagnet: ['МАГНИТ', 'MAGNET'],
  hudShield: ['ЩИТ', 'SHIELD'],
  itemShaker: ['ПРОТ', 'PRO'],
  itemBar: ['БАТОН', 'BAR'],
  itemCreatine: ['КРЕАТИН', 'CREATINE'],
  itemPreworkout: ['ПРЕДТРЕН', 'PRE'],
  itemGainer: ['ГЕЙНЕР', 'GAINER'],
  zoneBasement: ['ПОДВАЛ', 'BASEMENT'],
  zoneNeon: ['НЕОН-ЗАЛ', 'NEON GYM'],
  zoneStreet: ['УЛИЦА', 'STREET'],
  zoneRoof: ['КРЫША', 'ROOFTOP'],
  zoneLocker: ['РАЗДЕВАЛКА', 'LOCKER ROOM'],
  zoneFinal: ['ФИНИШНАЯ ПРЯМАЯ', 'FINAL STRETCH'],
  bossWarn: ['ГЛАВНЫЙ ВЫШИБАЛА!', 'BOSS ENFORCER!'],
  bossDown: ['ВЫШИБАЛА ПОВЕРЖЕН!', 'ENFORCER DOWN!'],
  winTitle: ['Финиш!', 'Finish!'],
  continueBtn: ['🏃 Бежать дальше', '🏃 Keep running'],
  newRunBtn: ['🔄 Новый забег', '🔄 New run'],
};
function tr(key) {
  const pair = STR[key];
  return pair ? pair[LANG === 'en' ? 1 : 0] : key;
}
document.title = tr('title');
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tr(el.dataset.i18nHtml); });

// ── DATA: payload от бота через ?data= (base64), как в beat the owl ─────────
let athleteName = 'АТЛЕТ';
let serverBest = 0;
(function loadData() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('data');
  if (raw) {
    try {
      const payload = JSON.parse(atob(raw.replace(/-/g, '+').replace(/_/g, '/')));
      if (payload.name) athleteName = String(payload.name).slice(0, 24).toUpperCase();
      if (payload.best) serverBest = +payload.best || 0;
    } catch (e) { console.warn('Bad payload', e); }
  }
})();

// ── КАЧКИ ────────────────────────────────────────────────────────────────────
const FIGHTERS = {
  power:  { name: LANG === 'en' ? 'Powerlifter' : 'Пауэрлифтер', tag: LANG === 'en' ? 'strength' : 'сила',         top: '#8f2a20', bottom: '#2b2d34', skin: '#e0b08a', head: 'bandana',  hair: '#31241c', acc: '#b8860b', belt: true, bulk: 1.18 },
  cross:  { name: LANG === 'en' ? 'Crossfitter' : 'Кроссфитер',  tag: LANG === 'en' ? 'conditioning' : 'функционалка', top: '#276f66', bottom: '#31343d', skin: '#caa27e', head: 'headband', hair: '#20180f', acc: '#f2ede3', bulk: 1.0 },
  wrestle:{ name: LANG === 'en' ? 'Wrestler' : 'Борец',       tag: LANG === 'en' ? 'grip' : 'захват',       top: '#7a2b3f', bottom: '#7a2b3f', skin: '#dba184', head: 'short',    hair: '#2a1f16', acc: '#7a2b3f', singlet: true, ears: true, bulk: 1.12 },
  build:  { name: LANG === 'en' ? 'Bodybuilder' : 'Бодибилдер',  tag: LANG === 'en' ? 'mass' : 'мышцы',        top: '#cf9455', bottom: '#23252c', skin: '#cf9455', head: 'short',    hair: '#241a12', acc: '#d9a013', shirtless: true, bulk: 1.22 },
};
let selectedFighter = 'power';
// Вышибала — бегущий навстречу противник (не выбираемый персонаж, поэтому вне
// FIGHTERS: не должен попасть в карточки выбора). Тёмная форма и красный акцент —
// контраст с любым качком игрока, чтобы на бегу читался как угроза, а не снаряд.
const RIVAL_SKIN = { top: '#1c1c1f', bottom: '#101012', skin: '#8a5a3c', head: 'short', hair: '#050505', acc: '#ff2d2d', bulk: 1.28 };

// ── CANVAS ───────────────────────────────────────────────────────────────────
const cv = document.getElementById('game-canvas');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

const CHALK = '#f2ede3', C_RAGE = '#ff5a36', C_GOLD = '#ffd700';

// ── ЗВУК: короткие бипы через WebAudio ──────────────────────────────────────
let AC = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, AC.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
// Короткий шум — щелчок подошвы, пыль на приземлении.
function noiseBurst(dur = 0.09, vol = 0.04, hp = 1400) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const n = Math.max(1, Math.floor(AC.sampleRate * dur));
    const buf = AC.createBuffer(1, n, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = AC.createBufferSource(); src.buffer = buf;
    const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = AC.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start();
  } catch (e) {}
}
// Удар — синус с падающей высотой плюс щелчок. Низкие square и sawtooth со
// съездом вниз звучат как метеоризм, поэтому их здесь больше нет.
function thud(f0 = 190, f1 = 52, dur = 0.18, vol = 0.07) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
    noiseBurst(Math.min(0.05, dur * 0.4), vol * 0.45);
  } catch (e) {}
}
const sJump = () => { beep(560, .07, 'triangle', .035, 260); noiseBurst(.05, .03, 2200); };
const sDouble = () => beep(760, .07, 'triangle', .035, 320);
const sPick = () => beep(880, .06, 'triangle', .04, 180);
const sPower = () => { beep(620, .08, 'triangle', .05, 200); setTimeout(() => beep(880, .09, 'triangle', .045, 260), 60); setTimeout(() => beep(1180, .11, 'sine', .04, 200), 130); };
const sDie = () => { thud(200, 44, .38, .085); setTimeout(() => thud(150, 36, .5, .07), 150); };

// ── СОСТОЯНИЕ ────────────────────────────────────────────────────────────────
// Масштаб мира: SK поднимает все пиксельные размеры мира (игрок, препятствия,
// просветы, прыжок) СОГЛАСОВАННО: скорость скролла (SPEED_*, px/с) не трогаем —
// это она отвечает за баланс/сложность, — а высоту прыжка и гравитацию
// масштабируем ОБЕ на SK, поэтому апекс прыжка растёт в SK раз, а время полёта
// (и вся синхронизация с препятствиями) остаётся тем же, что и до
// масштабирования.
//
// Фиксированные 2.5 оказались перебором: бегун занимал пятую часть высоты
// экрана, а стойка (o.w + 104*SK ≈ 325px) — почти всю ширину кадра на телефоне,
// то есть препятствие приходило уже наполовину за краем экрана. Теперь SK
// считается ОТ ВЫСОТЫ КАДРА: рост фигуры (58*SK) держим около 12% высоты — она
// крупная и читаемая, но над головой остаётся воздух, а препятствие целиком
// влезает в кадр. Клипсы — чтобы на очень низком (ландшафт) и очень высоком
// экране мир не выходил за пределы, под которые подобран баланс.
// Ограничение по ШИРИНЕ здесь такое же обязательное, как по высоте: Telegram
// Desktop открывает мини-приложение узкой колонкой (~400px при высоте под
// 800), и масштаб, посчитанный только от высоты, снова раздувал стойку почти
// на весь кадр. 280 — ширина самого широкого препятствия (стойка: o.w + 104)
// в единицах мира, делённая на долю кадра, которую ему разрешено занимать.
const SK = Math.max(1.05, Math.min(1.75, Math.min(H * 0.12 / 58, W / 280)));
// Прыжок — величина ФИКСИРОВАННОЙ длительности (v0/g не меняются от скорости

    ctx.fillRect(x - coff, GROUND() - hgt, cw - 24, hgt);
  }
  // Окна — тоже мелкий частый паттерн на скролле, гасим контраст на разгоне.
  ctx.fillStyle = 'rgba(255,201,60,' + (0.35 - 0.20 * sf).toFixed(3) + ')';
  for (let x = -cw; x < W + cw; x += cw)
    for (let wy = 0; wy < 4; wy++) for (let wx = 0; wx < 3; wx++)
      if (((x / cw | 0) + wx + wy) % 3 === 0) ctx.fillRect(x - coff + 22 + wx * 44, GROUND() - 96 + wy * 22, 12, 9);
  const lw = 420, loff = (dist * 3.2) % lw;
  for (let x = -lw; x < W + lw; x += lw) {
    const lx = x - loff + lw * 0.3;
    ctx.fillStyle = 'rgba(150,160,190,0.6)'; ctx.fillRect(lx - 2, GROUND() - 170, 4, 170);
    ctx.fillRect(lx - 2, GROUND() - 172, 34, 5);
    const g = ctx.createRadialGradient(lx + 30, GROUND() - 164, 2, lx + 30, GROUND() - 164, 90);
    g.addColorStop(0, 'rgba(255,220,150,0.35)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - 60, GROUND() - 260, 180, 260);
  }
  ctx.globalAlpha = 1;
}
// Дальний параллакс-слой: мягкие светящиеся пятна на разной высоте, ползут
// заметно медленнее ближних силуэтов. Работает во всех зонах одинаково (цвет
// приходит из палитры зоны) — заполняет верхнюю часть неба содержанием, а не
// голой пустотой, независимо от того, что рисует конкретная drawZone.
function drawFarBokeh(tint) {
  const pw = 260, poff = (dist * 0.35) % pw;
  ctx.save(); ctx.globalAlpha = 0.22;
  for (let x = -pw; x < W + pw; x += pw) {
    const i = Math.floor(x / pw + 1000);
    const bx = x - poff + pw * 0.5;
    const by = GROUND() * (0.14 + 0.34 * (i % 3) / 2);
    const r = 46 + (i % 4) * 20;
    const g = ctx.createRadialGradient(bx, by, 2, bx, by, r);
    g.addColorStop(0, tint); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(bx - r, by - r, r * 2, r * 2);
  }
  ctx.restore();
}
function silhouettes(color, parallax) {
  const sw = 260, soff = (dist * parallax) % sw;
  ctx.fillStyle = color;
  for (let x = -sw; x < W + sw; x += sw) {
    const bx = x - soff, by = GROUND();
    ctx.fillRect(bx + 20, by - 70, 8, 70); ctx.fillRect(bx + 92, by - 70, 8, 70);
    ctx.fillRect(bx + 6, by - 64, 108, 6);
    ctx.beginPath(); ctx.arc(bx + 14, by - 61, 13, 0, 7); ctx.arc(bx + 106, by - 61, 13, 0, 7); ctx.fill();
    ctx.fillRect(bx + 160, by - 34, 70, 10); ctx.fillRect(bx + 170, by - 24, 10, 24); ctx.fillRect(bx + 200, by - 24, 10, 24);
  }
}
// КРЫША: открытая площадка над залом с видом на закатный город — четыре
// слоя (марево горизонта → дальний город → средний город с окнами → ближние
// антенны/тросы) плюс парапет и вентиляционные короба на переднем плане,
// тем же приёмом «слоёв с разным параллаксом», что и в неон-зале/на улице
// (см. drawNeon/drawStreet). Элементы крупные и редкие, чтобы на разгоне
// не рябило (см. комментарий в drawBasement).
function drawRoof(a) {
  ctx.globalAlpha = a;
  const gy = GROUND();

  // Закатное марево у горизонта — тёплый градиент над дальними крышами.
  const hazeTop = gy * 0.26, hazeBot = gy * 0.66;
  const hg = ctx.createLinearGradient(0, hazeTop, 0, hazeBot);
  hg.addColorStop(0, 'rgba(255,150,80,0.24)'); hg.addColorStop(1, 'rgba(255,150,80,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hazeTop, W, hazeBot - hazeTop);
  // Низкое солнце над крышами.
  const sg = ctx.createRadialGradient(W * 0.72, gy * 0.34, 4, W * 0.72, gy * 0.34, 120);
  sg.addColorStop(0, 'rgba(255,210,150,0.5)'); sg.addColorStop(1, 'rgba(255,210,150,0)');
  ctx.fillStyle = sg; ctx.fillRect(W * 0.72 - 120, gy * 0.34 - 120, 240, 240);

  // Дальний город: мелкие тёмные силуэты, самый медленный параллакс — держит
  // глубину горизонта, не отвлекая деталями.
  const fw = 150, foff = (dist * 0.6) % fw;
  ctx.fillStyle = 'rgba(35,22,40,0.5)';
  for (let x = -fw; x < W + fw; x += fw) {
    const i = Math.floor(x / fw + 800);
    const hgt = 40 + (i % 4) * 22;
    ctx.fillRect(x - foff, gy - hgt - 46, fw - 18, hgt);
  }

  // Средний город: силуэты крупнее, с сеткой окон разной яркости — часть
  // тёмные (никого нет), часть светятся тёплым (кто-то ещё качается) —
  // здание читается домом, а не плоским прямоугольником.
  const cw = 200, coff = (dist * 1.15) % cw;
  for (let x = -cw; x < W + cw; x += cw) {
    const i = Math.floor(x / cw + 900);
    const hgt = 100 + (i % 3) * 46, bx = x - coff, bw = cw - 46, by = gy - hgt - 36;
    ctx.fillStyle = 'rgba(38,24,42,0.78)';
    ctx.fillRect(bx, by, bw, hgt);
    ctx.fillStyle = 'rgba(20,12,22,0.5)'; ctx.fillRect(bx, by, bw, 5); // край крыши темнее
    const cols = Math.max(1, Math.floor(bw / 24)), rows = Math.max(1, Math.floor(hgt / 22));
    for (let wy = 0; wy < rows; wy++) for (let wx = 0; wx < cols; wx++) {
      const lit = (wx + wy * 2 + i) % 3 === 0;
      ctx.fillStyle = lit ? 'rgba(255,196,120,0.55)' : 'rgba(10,6,14,0.4)';
      ctx.fillRect(bx + 7 + wx * 24, by + 9 + wy * 22, 12, 13);
    }
  }

  // Антенны на крышах: две мачты с мигающим сигнальным огоньком и провисшим
  // тросом между ними — фирменный силуэт «мы на крыше», а не абстрактный блок.
  const pw2 = 400, poff2 = (dist * 1.9) % pw2;
  for (let x = -pw2; x < W + pw2; x += pw2) {
    const ax = x - poff2 + pw2 * 0.22, ax2 = ax + 150, ah = 74, ah2 = 46;
    ctx.strokeStyle = 'rgba(150,160,175,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, gy - 96); ctx.lineTo(ax, gy - 96 - ah); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax2, gy - 74); ctx.lineTo(ax2, gy - 74 - ah2); ctx.stroke();
    // короткие траверсы антенны
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax - 9, gy - 96 - ah * 0.6); ctx.lineTo(ax + 9, gy - 96 - ah * 0.6); ctx.stroke();
    // провисший трос между мачтами
    ctx.strokeStyle = 'rgba(120,128,140,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(ax, gy - 96 - ah); ctx.quadraticCurveTo((ax + ax2) / 2, gy - 96 - ah + 30, ax2, gy - 74 - ah2); ctx.stroke();
    // мигающий сигнальный огонёк
    ctx.fillStyle = 'rgba(255,60,60,' + (0.5 + 0.4 * Math.sin(t * 4 + ax * 0.05)).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(ax, gy - 96 - ah, 4, 0, 7); ctx.fill();
  }

  // Ближний план: вентиляционные короба на крыше, самый быстрый параллакс —
  // читаются крупно и явно, как объекты «рядом», а не часть заднего фона.
  const sf = speedFrac();
  const vw = 260, voff = (dist * 2.6) % vw;
  ctx.fillStyle = 'rgba(120,100,110,' + (0.6 - 0.2 * sf).toFixed(2) + ')';
  for (let x = -vw; x < W + vw; x += vw) {
    const vx = x - voff + vw * 0.5;
    ctx.beginPath(); ctx.roundRect(vx, gy - 46, 48, 46, 5); ctx.fill();
    ctx.fillStyle = 'rgba(30,20,26,0.55)';
    ctx.fillRect(vx + 6, gy - 38, 36, 6); ctx.fillRect(vx + 6, gy - 25, 36, 6);
    ctx.strokeStyle = 'rgba(150,160,175,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(vx + 24, gy - 46); ctx.lineTo(vx + 24, gy - 64); ctx.stroke();
    ctx.fillStyle = 'rgba(120,100,110,' + (0.6 - 0.2 * sf).toFixed(2) + ')';
  }

  // Парапет — невысокая стена по кромке крыши вдоль всей дорожки, отделяет
  // город от площадки, на которой бежит атлет.
  ctx.fillStyle = 'rgba(58,32,54,0.92)'; ctx.fillRect(0, gy - 16, W, 16);
  ctx.fillStyle = 'rgba(255,190,140,0.3)'; ctx.fillRect(0, gy - 16, W, 3);

  ctx.globalAlpha = 1;
}
// РАЗДЕВАЛКА: кафель крупными плитами, шкафчики рядами, пар от душевых.
// Плитка и пар — большие редкие блоки, а не частая решётка, чтобы не мельтешить.
function drawLocker(a) {
  ctx.globalAlpha = a;
  const sf = speedFrac();
  const tw = 150, toff = (dist * 1.1) % tw;
  ctx.strokeStyle = 'rgba(150,190,200,' + (0.10 - 0.05 * sf).toFixed(3) + ')'; ctx.lineWidth = 2;
  for (let x = -tw; x < W + tw; x += tw) {
    const lx = x - toff; ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, GROUND()); ctx.stroke();
  }
  const cw = 300, coff = (dist * 1.8) % cw;
  for (let x = -cw; x < W + cw; x += cw) {
    const lx = x - coff;
    ctx.fillStyle = 'rgba(60,80,90,0.55)'; ctx.fillRect(lx, GROUND() - 130, cw - 40, 130);
    ctx.fillStyle = 'rgba(20,30,36,0.5)';
    for (let i = 0; i < 4; i++) ctx.fillRect(lx + 10 + i * 62, GROUND() - 120, 50, 110);
    ctx.fillStyle = 'rgba(200,170,60,0.4)';
    for (let i = 0; i < 4; i++) ctx.fillRect(lx + 10 + i * 62 + 22, GROUND() - 70, 6, 6);
  }
  ctx.fillStyle = 'rgba(220,235,240,' + (0.10 - 0.07 * sf).toFixed(3) + ')';
  const sw = 480, soff = (dist * 2.0) % sw;
  for (let x = -sw; x < W + sw; x += sw) {
    const sx = x - soff;
    ctx.beginPath(); ctx.ellipse(sx + 120, GROUND() * 0.4, 140, 60, 0, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── ПРЕПЯТСТВИЯ ──────────────────────────────────────────────────────────────
const obstacles = [];
let nextObsAt = 70;
function spawnObstacle() {
  // ЛЕСТНИЦА ТИПОВ. Раньше весь набор был доступен с первого метра: игрок,
  // впервые открывший забег, на десятой секунде мог получить летящий блин,
  // под который нельзя прыгать. В жанре так не делают — механики вводят по
  // одной, давая освоить каждую на низкой скорости (Subway Surfers, Temple
  // Run, dino). Здесь то же самое: сначала одна прыжковая и одна подкатная,
  // дальше по ступеням, и все «злые» варианты — заметно позже.
  // Пропорция «прыгнуть / подкатиться» на каждой ступени держится примерно
  // поровну: перекос в одну сторону превращает забег в одну кнопку.
  const pool = ['dumb', 'dumb', 'rack', 'rack'];
  if (dist >= 250) pool.push('kettle', 'bag');
  if (dist >= 600) pool.push('bench', 'cable');
  // Катящийся навстречу блин — первое препятствие с собственной скоростью.
  if (dist >= 1000) pool.push('plate');
  // Летящий блин: прыжок под него не спасает (см. obstacleBox), только подкат —
  // самая «злая» механика набора, поэтому дальше всех.
  if (dist >= 1500) pool.push('flyplate');
  // Вышибала подмешивается в общий пул только после того, как забег разогнался
  // и игрок освоился — не с первой секунды (см. RIVAL_MIN_DIST).
  if (dist >= RIVAL_MIN_DIST) pool.push('rival');
  const kind = pick(pool);
  // Все геометрические размеры (w/h/gap) и точка появления за краем экрана —
  // в масштабе мира SK (см. объявление константы выше). Скорости сближения
  // (o.vx) — это баланс/сложность, а не размер объекта, поэтому НЕ умножаем
  // их на SK: только на текущую speed, как и раньше.
  const o = { kind, x: W + 80 * SK };
  // Прыжковые (dumb/kettle/bench/plate/rival) — по SKW, см. комментарий у
  // объявления SKW: их ширина ограничена фиксированным охватом прыжка.
  // Подкатные (rack/bag/cable/flyplate) — по полному SK: длительность подката
  // подстраивается под текущую скорость живьём, узкого места здесь нет.
  if (kind === 'dumb') { o.w = 52 * SKW; o.h = 30 * SKW; }
  if (kind === 'kettle') { o.w = 36 * SKW; o.h = 40 * SKW; }
  if (kind === 'bench') { o.w = 110 * SKW; o.h = 34 * SKW; }
  if (kind === 'rack') { o.w = 26 * SK; o.h = 0; o.gap = 64 * SK; }
  if (kind === 'plate') { o.w = 44 * SKW; o.h = 44 * SKW; o.vx = 120 * VX_K + speed * 0.12; o.rot = 0; }
  // Груша — свисает с потолка на цепи, покачивается из стороны в сторону
  // (чисто визуально, на просвет не влияет). Просвет фиксированный, как у rack,
  // но силуэт совсем другой — цилиндр на цепи, а не перекладина на стойках.
  if (kind === 'bag') { o.w = 46 * SK; o.h = 0; o.gap = 62 * SK; o.swingPhase = rnd(0, Math.PI * 2); }
  // Канат — тонкий трос между двумя короткими стойками, чуть вибрирует/провисает.
  if (kind === 'cable') { o.w = 120 * SK; o.h = 0; o.gap = 56 * SK; o.wavePhase = rnd(0, Math.PI * 2); }
  // Летящий блин — прилетает по дуге сверху-справа (не катится по полу, как
  // обычный plate), проходит на высоте подката и улетает налево, вращаясь.
  // Главный запрос заказчика: «слишком легко всё перепрыгивается» — этот тип
  // не прощает прыжок в принципе (см. obstacleBox — коробка тянется вверх
  // выше пика прыжка, прыжок буквально сбивает игрока в полёте).
  if (kind === 'flyplate') {
    // o.w/o.h тут чисто визуальные (коробка столкновения — от o.gap и фиксированных
    // отступов, см. obstacleBox), поэтому масштаб как у обычного plate — SKW,
    // без всякого ограничения по охвату прыжка (эти хазарды не перепрыгиваются).
    o.w = 44 * SKW; o.h = 44 * SKW; o.gap = 58 * SK; o.rot = 0; o.vx = 60 * VX_K + speed * 0.1;
    o.age = 0; o.floatPhase = rnd(0, Math.PI * 2);
  }
  if (kind === 'rival') {
    // Живой противник в полный рост: перепрыгнуть можно (как через тумбу),
    // подкатиться под него нельзя — коробка достаёт до пола (см. obstacleBox).
    // Сближение быстрее обычного препятствия — к скорости бега прибавляется
    // собственный бег вышибалы навстречу (o.vx), как у катящегося блина, но заметнее.
    o.w = 34 * SKW; o.h = 64 * SKW; o.vx = 90 * VX_K + speed * 0.18; o.runPhase = 0;
    if (!rivalWarned) { rivalWarned = true; toast(tr('rivalWarn'), C_RAGE); }
  }
  obstacles.push(o);
  // Награда, ведущая через препятствие: дуга — по траектории прыжка, дорожка
  // на полу — сквозь стойку на высоте подката. Собирание учит уклоняться.
  if (Math.random() < 0.45) spawnGuideItems(o);
  // Промежуток считаем в РЕАЛЬНОМ ВРЕМЕНИ, а не в пикселях: раньше промежуток
  // между препятствиями (в секундах) на разгоне падал с ~1.6 до ~0.6 с — чем
  // быстрее бежишь, тем чаще влетаешь. Теперь секундный зазор с разгоном растёт
  // (плюс запас на возросшую скорость): препятствия появляются РАНЬШЕ, а не
  // ЧАЩЕ, и время на реакцию у края экрана не сжимается.
  const speedFrac = (speed - SPEED_START) / (SPEED_CAP - SPEED_START);
  // Ритм забега (см. paceFactor): передышка ЗАМЕТНО растягивает интервал
  // (добавка, а не множитель на всё) — плотный участок почти не режет
  // нижнюю границу. Раньше пробовали множитель на весь gapSeconds и это
  // ломало проверенный запас на реакцию (см. комментарий выше): подряд
  // идущие подкатное+прыжковое препятствия могли слиться теснее, чем
  // рассчитан подкат, и убивали честно сыгранный забег. Плюс/минус здесь
  // маленький и односторонне безопасный.
  const gapSeconds = rnd(1.3, 2.0) + speedFrac * 0.9 + (1 - paceFactor()) * 0.7 - paceFactor() * 0.15;
  nextObsAt = dist + gapSeconds * (speed / M_DIV);
}

// Кульминация забега: усиленный вышибала перед самой линией финиша — тот же
// персонаж и тот же принцип («перепрыгнуть можно, подкатиться нельзя»), что и
// у обычного 'rival', но крупнее, шире и быстрее сближается — решающий момент
// должен быть заметно опаснее рядового столкновения, а не легче него.
function spawnBoss() {
  const o = { kind: 'boss', x: W + 90 * SK, w: 44 * SKW, h: 92 * SKW, vx: 140 * VX_K + speed * 0.22, runPhase: 0 };
  obstacles.push(o);
  bigPop(tr('bossWarn'), C_RAGE, W / 2, H * 0.32);
  addShake(0.3); addHitStop(0.05);
  // Пока решается исход с боссом, обычный спавн ставим на паузу — иначе рядом
  // может прилететь ещё одно препятствие и решающий момент превратится в
  // нечестную кашу вместо одной явной схватки.
  nextObsAt = Math.max(nextObsAt, dist + 260);
}

function spawnGuideItems(o) {
  if (o.kind === 'plate' || o.kind === 'flyplate') return; // летит/едет навстречу — «след» разъедется с ним
  if (o.kind === 'rack') {
    for (let i = 0; i < 4; i++) items.push(mkItem('shaker', o.x - 40 * SK + i * 46 * SK, GROUND() - 26 * SK));
    return;
  }
  // Груша, канат — те же подкатные хазарды, что и стойка: след из наград
  // прямо в коридоре подката, на ту же высоту, что и у rack.
  if (o.kind === 'bag' || o.kind === 'cable') {
    for (let i = 0; i < 4; i++) items.push(mkItem('shaker', o.x + 6 * SK + i * (o.w - 12 * SK) / 3, GROUND() - 26 * SK));
    return;
  }
  const cx = o.x + o.w / 2, n = 5;
  const barAt = Math.random() < 0.35 ? Math.floor(n / 2) : -1;
  for (let i = 0; i < n; i++) {
    const p = i / (n - 1);
    const y = GROUND() - 60 * SK - Math.sin(p * Math.PI) * 95 * SK;
    items.push(mkItem(i === barAt ? 'bar' : 'shaker', cx - 110 * SK + p * 220 * SK, y));
  }
}
// Жирный тёмный контур по силуэту — стрит-фигуру заливаем стандартным
// fill/stroke: сначала непрозрачная заливка, потом обводка тем же путём.
// LW — толщина обводки в мировом масштабе (не растёт строго на SK, чтобы
// линия не стала бесформенным пятном на крупных объектах).
const LW = 5;
function fillStroke(fill) {
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = LW; ctx.strokeStyle = 'rgba(16,11,8,0.85)'; ctx.stroke();
}
// Светлый ореол позади препятствия — тот же приём, что уже спасает читаемость
// спортпита в тёмных зонах (см. drawItem). Тёмная обводка (fillStroke) сама по
// себе не помогает, когда фон ЗА препятствием и так тёмный — контура тогда не
// видно ни с одной стороны. Мягкое светлое пятно даёт светлоту, отличную от
// фона, при ЛЮБОМ цвете стены/пола — работает как рассеянный свет со стороны
// зрителя, а не «набор плоских блоков». Форма и размер — под силуэт каждого

// прыжок) коробку столкновения — см. obstacleBox().
// Единый опознавательный признак ЛЮБОГО препятствия — тёплый красно-оранжевый
// ореол, «знак опасности». Раньше ореол был светлым нейтральным пятном (тот же
// приём, что спасает читаемость спортпита в drawItem) — и поэтому препятствие и
// подбираемый предмет на глаз были почти одинаковым «светлым пятном в темноте».

// Слайд (подкат) — рюмкой отличаются только rack/bag/cable/flyplate (та же

// направление действия помечено маркером-стрелкой (см. drawHazardArrow), а не
// только цветом.
function isSlideKind(kind) {

// Маркер-стрелка над препятствием: вершина смотрит в сторону нужного действия —
// вниз-остриём «подкатись» под хазард, вверх-остриём «прыгай» через него. Форма
// и направление читаются мгновенно и не нуждаются в переводе — намеренно без
// текста (см. правило «лучше обойтись без текста» в задаче на этот патч).
//
// Пробовали заменить стрелку разметкой-лентой на полу (перед прыжковым
// препятствием — тёплая, под подкатным — холодная). На живом прогоне лента
// в тёплых зонах (подвал, крыша) слилась с полом в жёлтые пятна под ногами
// и была забракована заказчиком. Если возвращаться к идее «подсказка в мире,

  else if (o.kind === 'kettle') { cx = o.w / 2; cy = gy - o.h * 0.55; rx = o.h * 0.62; ry = o.h * 0.72; }

  else if (o.kind === 'rack') { cx = o.w / 2 + 38 * SK; cy = gy - o.gap - 4 * SK; rx = o.w / 2 + 60 * SK; ry = 26 * SK; }

    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(o.w * 0.06, gy - o.h + o.h * 0.06, o.w * 0.88, o.h * 0.07);
    ctx.fillStyle = '#4c4f58';

    ctx.beginPath(); ctx.roundRect(-14 * SK, gy - o.gap - 9 * SK, o.w + 104 * SK, 9 * SK, 3 * SK); fillStroke('#a7adba');
    for (const cx of [-1 * SK, o.w + 77 * SK]) {

    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, 0, 8 * SKW, 0, 7); ctx.fill();
    ctx.fillStyle = CHALK; ctx.beginPath(); ctx.arc(0, 0, 3.4 * SKW, 0, 7); ctx.fill();

    ctx.fillStyle = CHALK; ctx.beginPath(); ctx.arc(0, 0, 3.4 * SKW, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(242,237,227,0.5)'; ctx.fillRect(-o.h / 2 + 4 * SKW, -1.5 * SKW, 10 * SKW, 3 * SKW);

function obstacleBox(o) {
  const gy = GROUND(), m = 5 * SK, mw = 5 * SKW;

  if (o.kind === 'bag' || o.kind === 'cable' || o.kind === 'flyplate') {
    // Хазарды «сверху»: коробка стоит на том же нижнем крае, что и просвет
    // подката (o.gap — совместимо с rack), но тянется далеко вверх — выше
    // пика прыжка (даже с учётом SK), поэтому прыжок ЧЕРЕЗ них не спасает
    // никогда, только подкат, который проходит ниже нижнего края коробки.
    return { x: o.x + m, y: gy - o.gap - 210 * SK, w: o.w - 2 * m, h: 220 * SK };

  // (см. spawnObstacle), поэтому и отступ по ширине свой, поменьше.
  return { x: o.x + mw, y: gy - o.h + m, w: o.w - 2 * mw, h: o.h - m };
