name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Прод крутится на python:3.11-slim (Dockerfile) — гоняем ровно его.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # -n auto: каждый воркер xdist — отдельный процесс; тесты не делят ни
      # файлов, ни портов (БД — :memory:, каталоги — tmp_path). -v не нужен:
      # тысячи строк лога тормозят шаг, а упавшие тесты pytest печатает сам.
      - run: pytest -q -n auto --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
