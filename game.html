<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кач-Раннер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/game/three.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='assets/game/three.min.js';document.head.appendChild(s)"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(135deg, #14110f 0%, #221812 50%, #0d1a2e 100%);
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }
  #game-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100svh;
    touch-action: none; display: none;
  }
  #game-canvas.active { display: block; }

  .screen {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    padding: 16px; overflow-y: auto;
  }
  .screen.active { display: flex; }
  .screen-inner {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  h1 {
    font-size: 24px; text-align: center; text-transform: uppercase;
    letter-spacing: 3px; color: #ffd700; text-shadow: 0 0 20px #ffd700aa;
  }
  .subtitle { font-size: 13px; color: #aaa; text-align: center; line-height: 1.5; }
  .subtitle b { color: #ffd700; }

  /* ── ВЫБОР КАЧКА ── */
  .fighters-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    width: 100%; max-width: 360px;
  }
  .fighter-card {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,215,0,0.3);
    border-radius: 12px; padding: 12px; cursor: pointer; text-align: center;
    transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
  }
  .fighter-card:hover, .fighter-card:active {
    border-color: #ffd700; transform: scale(1.04); box-shadow: 0 0 20px #ffd70055;
  }
  .fighter-card canvas { width: 100%; aspect-ratio: 1; }
  .fighter-card img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block;
  }
  .fighter-name {
    margin-top: 8px; font-size: 13px; text-transform: uppercase;
    letter-spacing: 1px; color: #ffd700;
  }
  .fighter-tag { font-size: 10px; color: #aaa; margin-top: 2px; }

  .controls-hint { font-size: 12px; color: #888; text-align: center; line-height: 1.7; }
  .controls-hint b { color: #ddd; }

  /* ── РЕЗУЛЬТАТ ── */
  #screen-result .screen-inner { text-align: center; }
  .result-title {
    font-size: 30px; font-weight: bold; text-transform: uppercase;
    letter-spacing: 3px; color: #ff4444; text-shadow: 0 0 20px #ff4444;
  }
  .result-score { font-size: 20px; color: #ffd700; }
  #result-art {
    width: 104px; height: 104px; object-fit: cover; border-radius: 12px;
    border: 2px solid rgba(255,215,0,0.4); display: none; margin: 0 auto;
  }
  .result-stats { font-size: 12px; color: #aaa; }
  .result-quip { font-size: 13px; color: #ccc; line-height: 1.6; max-width: 340px; }
  .result-best { font-size: 12px; color: #888; }
  .result-btn {
    background: rgba(255,215,0,0.15); border: 2px solid #ffd700; border-radius: 12px;
    color: #ffd700; font-family: inherit; font-size: 15px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 2px; padding: 14px 32px; cursor: pointer;
    transition: background 0.2s, transform 0.1s; min-width: 220px;
  }
  .result-btn:hover { background: rgba(255,215,0,0.3); }
  .result-btn:active { transform: scale(0.97); }
  .result-btn.retry { border-color: #00c850; color: #00c850; background: rgba(0,200,80,0.1); }
  .result-btn.retry:hover { background: rgba(0,200,80,0.25); }
  #result-status { color: #aaa; font-size: 13px; min-height: 16px; }

  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 30; }
  #flash.red { background: rgba(255,40,40,0.35); }

  /* ── HUD (DOM поверх 3D-сцены) ── */
  #hud {
    position: fixed; inset: 0; pointer-events: none; display: none;
    font-family: 'Courier New', monospace; z-index: 10;
  }
  #hud.active { display: block; }
  .hud-dist {
    position: absolute; left: 20px; top: 14px;
    font-size: 26px; font-weight: 900; color: #ffd700; letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .hud-best {
    position: absolute; left: 20px; top: 46px;
    font-size: 13px; font-weight: 700; color: rgba(242,237,227,0.7);
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .hud-zone {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    font-size: 11px; font-weight: 800; color: rgba(242,237,227,0.45); letter-spacing: 2px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .hud-score {
    position: absolute; right: 20px; top: 14px;
    font-size: 22px; font-weight: 900; color: #e94f64; text-align: right;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .hud-powers {
    position: absolute; right: 20px; top: 50px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
  }
  .hud-power { font-size: 11px; font-weight: 800; text-align: right; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .hud-power-bar { width: 90px; height: 4px; background: rgba(255,255,255,0.15); margin-top: 2px; }
  .hud-power-bar > i { display: block; height: 100%; }

  #toast-layer { position: fixed; inset: 0; pointer-events: none; z-index: 11; }
  .toast {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 16px; font-weight: 900; white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }

  #rage-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: rgba(255,90,54,0); display: none;
  }
  #rage-overlay.active { display: block; }

  /* ── ЭКРАН ОШИБКИ ЗАПУСКА ── */
  #screen-error .screen-inner { text-align: center; gap: 12px; }
  #screen-error .subtitle { color: #ddd; }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="hud">
  <div class="hud-dist" id="hud-dist">0 м</div>
  <div class="hud-best" id="hud-best">рекорд 0 м</div>
  <div class="hud-zone" id="hud-zone">ПОДВАЛ</div>
  <div class="hud-score" id="hud-score">🥤 0</div>
  <div class="hud-powers" id="hud-powers"></div>
</div>
<div id="toast-layer"></div>
<div id="rage-overlay"></div>
<div id="flash"></div>

<!-- ЭКРАН 1: выбор качка -->
<div id="screen-select" class="screen active">
  <div class="screen-inner">
    <h1>Кач-Раннер</h1>
    <div class="subtitle">Беги по залу, собирай спортпит, не влетай в гантели —<br>я засеку, докуда добежишь. <b>Кем побежишь?</b></div>
    <div class="fighters-row" id="fighters-row"></div>
    <div class="controls-hint">
      <b>тап / пробел</b> — прыжок (двойной — в воздухе)<br>
      <b>свайп вниз / ↓</b> — подкат под штангу
    </div>
  </div>
</div>

<!-- ЭКРАН: не поднялся зал -->
<div id="screen-error" class="screen">
  <div class="screen-inner">
    <h1>Кач-Раннер</h1>
    <div class="subtitle" id="error-text">Не смог поднять зал. Проверь связь и открой игру заново.</div>
  </div>
</div>

<!-- ЭКРАН 3: результат -->
<div id="screen-result" class="screen">
  <div class="screen-inner">
    <div class="result-title">Отказ</div>
    <img id="result-art" src="" alt="">
    <div class="result-score" id="result-score">0 м · 🥤 0</div>
    <div class="result-stats" id="result-stats"></div>
    <div class="result-quip" id="result-quip"></div>
    <div class="result-best" id="result-best"></div>
    <button class="result-btn retry" onclick="restartGame()">🔄 Ещё подход</button>
    <button class="result-btn" onclick="submitAndClose()">❌ Закрыть</button>
    <div id="result-status"></div>
  </div>
</div>

<script>
'use strict';
// Expand to full screen immediately (как у совы)
if (window.Telegram?.WebApp) Telegram.WebApp.expand();

// ── DATA: payload от бота через ?data= (base64), как в beat the owl ─────────
let athleteName = 'АТЛЕТ';
let serverBest = 0;
(function loadData() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('data');
  if (raw) {
    try {
      const payload = JSON.parse(atob(raw.replace(/-/g, '+').replace(/_/g, '/')));
      if (payload.name) athleteName = String(payload.name).slice(0, 24).toUpperCase();
      if (payload.best) serverBest = +payload.best || 0;
    } catch (e) { console.warn('Bad payload', e); }
  }
})();

// ── ФОРМАТИРОВАНИЕ ЧИСЕЛ: единая точка, всё на экране — только целые ───────
function fmt(n) { return String(Math.round(n)); }

// ── КАЧКИ ────────────────────────────────────────────────────────────────────
const FIGHTERS = {
  power:  { name: 'Пауэрлифтер', tag: 'сила',         top: '#8f2a20', bottom: '#2b2d34', skin: '#e0b08a', head: 'bandana',  hair: '#31241c', acc: '#b8860b', belt: true, bulk: 1.18 },
  cross:  { name: 'Кроссфитер',  tag: 'функционалка', top: '#276f66', bottom: '#31343d', skin: '#caa27e', head: 'headband', hair: '#20180f', acc: '#f2ede3', bulk: 1.0 },
  wrestle:{ name: 'Борец',       tag: 'захват',       top: '#7a2b3f', bottom: '#7a2b3f', skin: '#dba184', head: 'short',    hair: '#2a1f16', acc: '#7a2b3f', singlet: true, ears: true, bulk: 1.12 },
  build:  { name: 'Бодибилдер',  tag: 'мышцы',        top: '#cf9455', bottom: '#23252c', skin: '#cf9455', head: 'short',    hair: '#241a12', acc: '#d9a013', shirtless: true, bulk: 1.22 },
};
let selectedFighter = 'power';

// ── CANVAS-ФОЛБЭК ДЛЯ КАРТОЧЕК ВЫБОРА (2D, как было) ────────────────────────
// Экран выбора персонажа не переделываем — векторный фолбэк рисуем тем же
// 2D-путём, что и раньше, на отдельных маленьких canvas-ах карточек.
const CHALK = '#f2ede3', C_RAGE = '#ff5a36', C_GOLD = '#ffd700';

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.round(((n >> 16) & 255) * k) + ',' + Math.round(((n >> 8) & 255) * k) + ',' + Math.round((n & 255) * k) + ')';
}
// roundRect есть не во всех вебвью — мягкий полифилл
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}
function limb(c, pts, w, color) {
  c.strokeStyle = color; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.stroke();
}
function drawShoe(c, x, y, dark) {
  c.save(); c.translate(x, y);
  c.fillStyle = dark ? '#3f434c' : '#565b66';
  c.beginPath(); c.roundRect(-5, -4, 14, 7, 3); c.fill();
  c.fillStyle = dark ? 'rgba(230,230,235,0.45)' : 'rgba(230,230,235,0.85)';
  c.fillRect(-5, 1, 14, 2);
  c.restore();
}
function drawHead(c, f, hx, hy) {
  const skinD = shade(f.skin, 0.78);
  c.fillStyle = f.skin;
  c.beginPath(); c.arc(hx, hy, 7.5, 0, 7); c.fill();
  c.beginPath(); c.moveTo(hx + 6.5, hy - 2); c.lineTo(hx + 9.5, hy + 1.5); c.lineTo(hx + 5, hy + 5.5); c.lineTo(hx - 1, hy + 5.5); c.closePath(); c.fill();
  c.fillStyle = f.ears ? '#c98a7a' : skinD;
  c.beginPath(); c.arc(hx - 1, hy + 1, f.ears ? 2.7 : 2, 0, 7); c.fill();
  c.fillStyle = '#1d1d22'; c.fillRect(hx + 4.5, hy - 1.5, 1.8, 1.8);
  c.fillRect(hx + 3.5, hy - 4, 4.2, 1.4);
  if (f.head === 'bandana') {
    c.fillStyle = f.acc;
    c.beginPath(); c.arc(hx, hy - 0.5, 7.8, Math.PI * 0.97, Math.PI * 2.03); c.fill();
    c.fillRect(hx - 8, hy - 3.5, 16.2, 3);
    c.beginPath(); c.moveTo(hx - 7, hy - 2); c.lineTo(hx - 13, hy + 3); c.lineTo(hx - 8, hy + 3.5); c.closePath(); c.fill();
    c.fillStyle = shade(f.acc, 0.7); c.fillRect(hx - 8, hy - 1.2, 16.2, 0.9);
    c.fillStyle = 'rgba(40,30,22,0.35)';
    c.beginPath(); c.arc(hx + 3.5, hy + 4, 4.4, 0.2, Math.PI * 0.95); c.fill();
  } else if (f.head === 'headband') {
    c.fillStyle = f.hair;
    c.beginPath(); c.arc(hx, hy - 1, 7.7, Math.PI * 0.95, Math.PI * 2.05); c.fill();
    c.fillStyle = f.acc; c.fillRect(hx - 8, hy - 4.5, 16, 2.6);
  } else if (f.head === 'beanie') {
    c.fillStyle = f.acc;
    c.beginPath(); c.arc(hx, hy - 1.5, 7.9, Math.PI * 0.93, Math.PI * 2.07); c.fill();
    c.fillRect(hx - 8.2, hy - 4, 16.4, 3.2);
    c.fillStyle = shade(f.acc, 0.75); c.fillRect(hx - 8.2, hy - 1.4, 16.4, 0.8);
    c.fillStyle = f.hair;
    c.beginPath(); c.moveTo(hx + 8.5, hy); c.quadraticCurveTo(hx + 9, hy + 8, hx + 3, hy + 9);
    c.quadraticCurveTo(hx - 1, hy + 8, hx - 1, hy + 4); c.lineTo(hx + 4, hy + 3); c.closePath(); c.fill();
  } else if (f.head === 'short') {
    c.fillStyle = f.hair;
    c.beginPath(); c.arc(hx, hy - 1, 7.8, Math.PI * 0.93, Math.PI * 1.97); c.fill();
    c.fillRect(hx - 7.8, hy - 2.5, 5, 3.5);
  }
}
// Рисует атлета в контекст c: используется только на карточках выбора (2D
// фолбэк, если арт assets/game/*.jpg ещё не подгрузился/недоступен).
function drawAthlete(c, fighter, opts) {
  const { sliding = false, run = 0, rage = false, shield = false, scale = 1, idle = false } = opts || {};
  const f = FIGHTERS[fighter];
  const B = f.bulk || 1;
  const torsoCol = (f.shirtless || f.singlet) ? f.skin : f.top;
  const torsoD = shade(torsoCol, 0.78);
  const skinD = shade(f.skin, 0.78);
  c.save(); c.scale(scale, scale);
  if (rage) {
    c.fillStyle = 'rgba(255,90,54,0.22)';
    for (let i = 1; i <= 3; i++) c.fillRect(-17 - i * 14, -58 + i * 5, 34, 52 - i * 8);
  }
  if (sliding) {
    limb(c, [-4, -16, 10, -13, 24, -8], 8.5 * B, skinD);
    drawShoe(c, 27, -7, true);
    c.fillStyle = f.bottom; c.beginPath(); c.roundRect(-13, -23, 15, 12, 5); c.fill();
    limb(c, [-7, -18, -19, -30], 15 * B, torsoCol);
    limb(c, [-17, -28, -6, -20, 2, -25], 7 * B, f.skin);
    limb(c, [-3, -15, 13, -11, 28, -6], 9 * B, f.skin);
    drawShoe(c, 31, -5, false);
    drawHead(c, f, -21, -38);
  } else {
    const s = idle ? 0 : run;
    const stance = idle ? 1 : 0;
    const leg = (side, col, dark) => {
      const sw = side * s;
      const hipX = side * 2 * (1 + stance), hipY = -33;
      const kneeX = hipX + sw * 10 + stance * side * 2, kneeY = -17;
      const footX = kneeX + sw * 9 + 1 + stance * side * 2, footY = -4 - Math.max(0, -sw) * 7;
      limb(c, [hipX, hipY, kneeX, kneeY, footX, footY], 10 * B, col);
      c.fillStyle = col; c.beginPath(); c.arc(kneeX - 2, kneeY + 3.5, 3.6 * B, 0, 7); c.fill();
      drawShoe(c, footX + 2, footY + 2, dark);
    };
    const arm = (side, col) => {
      const aw = idle ? side * 0.30 : -side * s;
      const shX = side > 0 ? 9 : -7, shY = -52;
      const elX = shX + aw * 9, elY = shY + 13;
      const haX = elX + aw * 10 + 2, haY = elY + 9 - Math.abs(aw) * 3;
      limb(c, [shX, shY, elX, elY, haX, haY], 8.5 * B, col);
      limb(c, [elX, elY, haX, haY], 6 * B, col);
      c.fillStyle = col;
      c.beginPath(); c.arc((shX + elX) / 2 + aw * 1.5, (shY + elY) / 2, 4.2 * B, 0, 7); c.fill();
      c.beginPath(); c.arc(shX, shY - 1.5, 5.4 * B, 0, 7); c.fill();
    };
    leg(-1, skinD, true);
    arm(-1, skinD);
    c.fillStyle = f.bottom;
    c.beginPath(); c.roundRect(-9 * B, -37, 18 * B, 14, 5); c.fill();
    c.fillStyle = shade(f.bottom, 0.72); c.fillRect(-9 * B, -37, 6 * B, 14);
    c.fillStyle = torsoCol;
    c.beginPath();
    c.moveTo(-8 * B, -33);
    c.quadraticCurveTo(-13 * B, -44, -14 * B, -54);
    c.quadraticCurveTo(-6, -61, 3, -61);
    c.quadraticCurveTo(14 * B, -58, 15 * B, -53);
    c.quadraticCurveTo(12 * B, -44, 9 * B, -33);
    c.closePath(); c.fill();
    c.fillStyle = torsoD;
    c.beginPath();
    c.moveTo(-8 * B, -33);
    c.quadraticCurveTo(-13 * B, -44, -14 * B, -54);
    c.quadraticCurveTo(-10 * B, -57, -6 * B, -57.5);
    c.quadraticCurveTo(-8 * B, -44, -4 * B, -33);
    c.closePath(); c.fill();
    c.strokeStyle = shade(torsoCol, 0.7); c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(2, -53); c.quadraticCurveTo(9 * B, -52, 12 * B, -48); c.stroke();
    if (f.singlet) {
      c.fillStyle = f.top;
      c.beginPath();
      c.moveTo(-8.6 * B, -33);
      c.quadraticCurveTo(-12 * B, -42, -12.3 * B, -47);
      c.lineTo(12.8 * B, -47);
      c.quadraticCurveTo(11.5 * B, -42, 9.6 * B, -33);
      c.closePath(); c.fill();
      c.strokeStyle = f.top; c.lineWidth = 4.2 * B; c.lineCap = 'butt';
      c.beginPath(); c.moveTo(9 * B, -47); c.lineTo(12.5 * B, -55); c.stroke();
      c.beginPath(); c.moveTo(-7 * B, -47); c.lineTo(-11 * B, -55); c.stroke();
      c.lineCap = 'round';
    } else if (f.shirtless) {
      c.strokeStyle = shade(f.skin, 0.72); c.lineWidth = 1.1;
      c.beginPath(); c.moveTo(3, -46); c.lineTo(3, -35); c.stroke();
      c.beginPath(); c.moveTo(-1, -43); c.lineTo(7, -43); c.stroke();
      c.beginPath(); c.moveTo(-1, -39); c.lineTo(7, -39); c.stroke();
    } else {
      c.fillStyle = f.skin;
      c.beginPath(); c.moveTo(0, -61); c.lineTo(9 * B, -56); c.quadraticCurveTo(6, -50, 2, -53); c.closePath(); c.fill();
    }
    if (f.belt) {
      c.fillStyle = f.acc; c.fillRect(-9 * B, -39, 18 * B, 5.5);
      c.fillStyle = shade(f.acc, 0.65); c.fillRect(0, -39, 4.5, 5.5);
    }
    leg(1, f.skin, false);
    limb(c, [2, -58, 2, -64], 7 * B, f.skin);
    drawHead(c, f, 3, -67);
    arm(1, f.skin);
  }
  if (shield) {
    c.strokeStyle = '#7ea8ff'; c.lineWidth = 2.5; c.globalAlpha = 0.6 + 0.3 * Math.sin(performance.now() / 130);
    c.beginPath(); c.arc(0, -34, 44, 0, 7); c.stroke(); c.globalAlpha = 1;
  }
  c.restore();
}

// Карточки выбора: если в assets/game лежит арт персонажа — показываем его
// (как карточки бойцов в beat the owl); нет файла — рисуем векторного из игры.
(function buildFighterCards() {
  const row = document.getElementById('fighters-row');
  Object.entries(FIGHTERS).forEach(([key, f]) => {
    const card = document.createElement('div');
    card.className = 'fighter-card';
    const c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    const cc = c.getContext('2d');
    cc.translate(74, 152);

// ── ЗВУК: короткие бипы через WebAudio ──────────────────────────────────────
let AC = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, AC.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sJump = () => beep(300, .12, 'square', .04, 220);
const sDouble = () => beep(420, .12, 'square', .04, 260);
const sPick = () => beep(760, .08, 'triangle', .05, 140);
const sPower = () => { beep(500, .15, 'sawtooth', .05, 400); setTimeout(() => beep(900, .2, 'sawtooth', .04, 300), 90); };
const sDie = () => { beep(220, .25, 'sawtooth', .06, -160); setTimeout(() => beep(120, .4, 'square', .05, -60), 140); };

// ── СОСТОЯНИЕ ИГРЫ (правила и баланс — как были, без изменений) ─────────────

let running = false;
let t = 0, dist = 0, speed = 0, score = 0, best = Math.max(serverBest, +(localStorage.getItem('gymrun_best') || 0));
let shakeT = 0, lastResult = null;

const mult = () => 1 + Math.min(4, Math.floor(combo / 8));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

let W = 0, H = 0, DPR = 1;

const P = {

// ── ПРЕПЯТСТВИЯ (спавн/баланс/хитбоксы — без изменений) ─────────────────────
const obstacles = [];
let nextObsAt = 260;
function spawnObstacle() {
  const kind = pick(['dumb', 'kettle', 'bench', 'rack', 'plate', 'dumb', 'rack']);
  const o = { kind, x: W + 80 };
  if (kind === 'dumb') { o.w = 52; o.h = 30; }
  if (kind === 'kettle') { o.w = 36; o.h = 40; }
  if (kind === 'bench') { o.w = 110; o.h = 34; }
  if (kind === 'rack') { o.w = 26; o.h = 0; o.gap = 64; }
  if (kind === 'plate') { o.w = 44; o.h = 44; o.vx = 120 + speed * 0.12; o.rot = 0; }
  obstacles.push(o);
  o.mesh = buildObstacleMesh(o);
  if (o.mesh) sceneObstacles.add(o.mesh);
  // Награда, ведущая через препятствие: дуга — по траектории прыжка, дорожка
  // на полу — сквозь стойку на высоте подката. Собирание учит уклоняться.
  if (Math.random() < 0.45) spawnGuideItems(o);
  const gapPx = rnd(0.85, 1.5) * (speed * 0.72) + 180;
  nextObsAt = dist + (gapPx / 7);
}
function removeObstacle(i) {
  const o = obstacles[i];
  if (o.mesh) { sceneObstacles.remove(o.mesh); disposeObject(o.mesh); }
  obstacles.splice(i, 1);
}
function clearObstacleMeshes() {
  for (const o of obstacles) if (o.mesh) { sceneObstacles.remove(o.mesh); disposeObject(o.mesh); }
}

function spawnGuideItems(o) {
  if (o.kind === 'plate') return; // блин едет навстречу — «след» из наград разъедется с ним
  if (o.kind === 'rack') {
    for (let i = 0; i < 4; i++) items.push(mkItem('shaker', o.x - 40 + i * 46, GROUND() - 26));
    return;
  }
  const cx = o.x + o.w / 2, n = 5;
  const barAt = Math.random() < 0.35 ? Math.floor(n / 2) : -1;
  for (let i = 0; i < n; i++) {
    const p = i / (n - 1);
    const y = GROUND() - 60 - Math.sin(p * Math.PI) * 95;
    items.push(mkItem(i === barAt ? 'bar' : 'shaker', cx - 110 + p * 220, y));
  }
}
function obstacleBox(o) {
  const gy = GROUND(), m = 5;
  if (o.kind === 'rack') return { x: o.x - 14 + m, y: gy - o.gap - 26, w: o.w + 104 - 2 * m, h: 44 };
  return { x: o.x + m, y: gy - o.h + m, w: o.w - 2 * m, h: o.h - m };
}

// ── СПОРТПИТ (баланс — без изменений) ───────────────────────────────────────
const ITEM_TYPES = {
  shaker:     { pts: 10, color: '#e94f64', label: 'ПРОТ' },
  bar:        { pts: 25, color: C_GOLD,   label: 'БАТОН' },
  creatine:   { pts: 0,  color: '#7ea8ff', label: 'КРЕАТИН', power: 'shield' },
  preworkout: { pts: 0,  color: C_RAGE,   label: 'ПРЕДТРЕН', power: 'rage' },
  gainer:     { pts: 0,  color: '#67c26a', label: 'ГЕЙНЕР', power: 'magnet' },
};
const items = [];
let nextItemAt = 140;
function spawnItems() {
  // Свободные награды не пересекаются с препятствиями: если у правого края
  // уже спавнится преграда, дорожка вела бы прямо в неё — переносим попытку.
  if (obstacles.some(o => o.x > W - 180)) { nextItemAt = dist + 12; return; }
  const r = Math.random();
  if (r < 0.14) items.push(mkItem('creatine', W + 60, GROUND() - 120));
  else if (r < 0.25) items.push(mkItem('preworkout', W + 60, GROUND() - 150));
  else if (r < 0.34) items.push(mkItem('gainer', W + 60, GROUND() - 100));
  else if (r < 0.48) {
    for (let i = 0; i < 3; i++) items.push(mkItem('bar', W + 60 + i * 58, GROUND() - 240));
  } else {
    const n = 4 + Math.floor(rnd(0, 3)), arc = Math.random() < 0.5;
    const barMix = Math.random() < 0.3;
    for (let i = 0; i < n; i++) {
      const y = arc ? GROUND() - 80 - Math.sin(i / (n - 1) * Math.PI) * 80 : GROUND() - 64;
      const type = (barMix && i === Math.floor(n / 2)) ? 'bar' : 'shaker';
      items.push(mkItem(type, W + 60 + i * 54, y));
    }
  }
  nextItemAt = dist + rnd(28, 60);
}
function mkItem(type, x, y) { return { type, x, y, t: rnd(0, 6) }; }

// ── ЧАСТИЦЫ И ТОСТЫ ─────────────────────────────────────────────────────────
const parts = [];
function burst(x, y, color, n = 10, sp = 180) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(sp * 0.3, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rnd(0.3, 0.7), maxLife: 0, color, r: rnd(2, 4) });
  }
}
const toasts = [];
function toast(text, color, x, y) {
  toasts.push({ text, color, t: 0, x: x ?? P.x, y: y ?? P.y - P.h - 30, el: null });
}

// ── ИГРОК: коробка столкновений — как в 2D-версии, координаты не менялись ──
function playerBox() {
  const sliding = P.slideT > 0;
  const h = sliding ? 30 : P.h, w = P.w;
  return { x: P.x - w / 2 + 4, y: P.y - h, w: w - 8, h: h - 4 };
}

// ── УПРАВЛЕНИЕ (как было) ────────────────────────────────────────────────────
function jump() {
  if (!running) return;
  if (P.slideT > 0) P.slideT = 0;
  if (P.onGround) { P.vy = -870; P.onGround = false; P.jumps = 1; sJump(); }
  else if (P.jumps < 2) { P.vy = -760; P.jumps = 2; sDouble(); burst(P.x, P.y - 10, 'rgba(242,237,227,0.8)', 6, 120); }
}
function slide() {
  if (!running) return;
  // Длительность от скорости, а не константа: подкат должен покрывать длину
  // стойки (~290 px) на любой скорости. С фиксированными 0.62 с на стартовой
  // скорости игрок вставал ровно под перекладиной — гарантированная смерть.
  if (P.onGround) P.slideT = Math.min(1.05, Math.max(0.5, 330 / Math.max(120, speed)));
  else { P.vy = Math.max(P.vy, 900); P.slideT = 0.5; }
}
let touchY = null, touchT = 0;
const cv = document.getElementById('game-canvas');
cv.addEventListener('pointerdown', e => { touchY = e.clientY; touchT = performance.now(); jump(); });
cv.addEventListener('pointermove', e => {
  if (touchY !== null && e.clientY - touchY > 46 && performance.now() - touchT < 350) { slide(); touchY = null; }
});
cv.addEventListener('pointerup', () => { touchY = null; });
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slide(); }
  if (e.code === 'KeyM') muted = !muted;
});

// ── КОНЕЦ ЗАБЕГА ────────────────────────────────────────────────────────────
function die() {

  burst(P.x, P.y - 30, C_RAGE, 22, 260);

  if (d > best) { best = d; localStorage.setItem('gymrun_best', best); }

  };

  document.getElementById('result-best').textContent = 'рекорд: ' + fmt(best) + ' м';
  document.getElementById('result-status').textContent = '';

// «Ещё раз»: рестарт локальный — вопросы качать не надо, результат шлём фоном
function restartGame() {
  if (lastResult) submitResult(lastResult); // fire-and-forget, как submit в restartGame совы
  lastResult = null;
  resetGame();
  running = true;
  showScreen('game');
}

async function submitResult(result) {
  if (!window.Telegram?.WebApp) return { ok: false, local: true };
  const initData = Telegram.WebApp.initData || '';
  try {
    const resp = await fetch('/game-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData, result }),
    });
    return { ok: resp.ok, status: resp.status, body: await resp.text() };
  } catch (e) {
    console.error('[game] submit error:', e);
    return { ok: false, error: e.message };
  }
}

async function submitAndClose() {
  const statusEl = document.getElementById('result-status');
  if (!window.Telegram?.WebApp) {
    statusEl.textContent = 'это локальный прототип — результат никуда не отправляю';
    return;
  }
  if (lastResult) {
    statusEl.textContent = 'Записываю...';
    const r = await submitResult(lastResult);
    if (!r.ok) { statusEl.textContent = '❌ Не записал — жми ещё раз'; return; }
    statusEl.textContent = '✅ Записал';
    lastResult = null;
  }
  try { Telegram.WebApp.close(); } catch (e) {}
}

// ── АПДЕЙТ (физика/спавн/очки — байт в байт как в 2D-версии) ────────────────
function update(dt) {
  t += dt;
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; });
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  if (shakeT > 0) shakeT -= dt;
  if (!running) return;

  const rage = P.rageT > 0;
  const spd = speed * (rage ? 1.55 : 1);
  dist += spd * dt / 7;
  speed = Math.min(SPEED_CAP, speed + SPEED_RAMP * dt);
  // Милстоны: каждые 500 м — отметка, чтобы у бесконечного забега были этапы.
  if (Math.floor(dist / 500) > lastMile) {
    lastMile = Math.floor(dist / 500);
    toast(fmt(lastMile * 500) + ' м!', C_GOLD, W / 2, H * 0.3);
  }
  if (P.rageT > 0) P.rageT -= dt;
  if (P.magnetT > 0) P.magnetT -= dt;
  if (P.slideT > 0) P.slideT -= dt;
  P.runPhase += dt * (spd / 340);

  if (!P.onGround) {
    P.vy += 2350 * dt; P.y += P.vy * dt;
    if (P.y >= GROUND()) { P.y = GROUND(); P.vy = 0; P.onGround = true; P.jumps = 0; }
  }

  if (dist >= nextObsAt) spawnObstacle();
  if (dist >= nextItemAt) spawnItems();

  const pb = playerBox();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= spd * dt + (o.vx ? o.vx * dt : 0);
    if (o.kind === 'plate') o.rot -= dt * 7;
    if (o.x < -160) { removeObstacle(i); continue; }
    const b = obstacleBox(o);
    if (pb.x < b.x + b.w && pb.x + pb.w > b.x && pb.y < b.y + b.h && pb.y + pb.h > b.y) {
      if (rage) {
        // Ярость награждает за агрессию: снос — это очки, а не только спецэффект.
        const bonus = 25 * mult();
        score += bonus;
        burst(o.x + (o.w || 30) / 2, GROUND() - 24, '#9aa0ab', 14, 300);
        removeObstacle(i);
        toast('+' + fmt(bonus), C_RAGE, o.x, GROUND() - 80);
        continue;
      }
      if (P.shield) {
        P.shield = false; combo = 0;
        removeObstacle(i); burst(P.x, P.y - 30, '#7ea8ff', 16, 260);
        toast('КРЕАТИН СПАС', '#7ea8ff'); shakeT = 0.25; continue;
      }
      die(); return;
    }
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.t += dt;
    it.x -= spd * dt;
    if (P.magnetT > 0) {
      const dx = P.x - it.x, dy = (P.y - 40) - it.y, d = Math.hypot(dx, dy);
      if (d < 240) { it.x += dx / d * 520 * dt; it.y += dy / d * 520 * dt; }
    }
    if (it.x < -60) { items.splice(i, 1); continue; }
    const dx = Math.abs(it.x - P.x), dy = Math.abs(it.y - (P.y - 34));
    if (dx < 34 && dy < 44) {
      const d = ITEM_TYPES[it.type];
      items.splice(i, 1);
      burst(it.x, it.y, d.color, 8, 160);
      const before = mult();
      combo += 1; maxCombo = Math.max(maxCombo, combo);
      if (d.power === 'shield') { P.shield = true; pickups += 1; toast('ЩИТ: КРЕАТИН', '#7ea8ff'); sPower(); }
      else if (d.power === 'rage') { P.rageT = 4.2; pickups += 1; toast('ПРЕДТРЕНИК: ЯРОСТЬ!', C_RAGE); sPower(); shakeT = 0.3; }
      else if (d.power === 'magnet') { P.magnetT = 6; pickups += 1; toast('ГЕЙНЕР-МАГНИТ', '#67c26a'); sPower(); }
      else { score += d.pts * mult(); sPick(); }
      if (mult() > before) toast('СЕРИЯ ×' + fmt(mult()), C_GOLD);
    }
  }

  toasts.forEach(ts => { ts.t += dt; ts.y -= 30 * dt; });
  for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > 1.2) toasts.splice(i, 1);
}

const UNIT = 1 / 30; // px игрового мира → мировые единицы three.js
function toWY(y2d) { return (GROUND() - y2d) * UNIT; }
function toWZ(x2d) { return -(x2d - P.x) * UNIT; }

let renderer = null, scene = null, camera = null;
let sceneObstacles = null, decorGroup = null, particleGroup = null;
let floorMesh = null, trackMesh = null, stripeMesh = null, wallL = null, wallR = null;
let propMesh = null, propBarMesh = null, lampMeshA = null, lampMeshB = null, lampPostMesh = null, buildingMesh = null;
let itemMeshes = {}; // type -> InstancedMesh
const ITEM_CAP = 48;
let playerModel = null; // { group, parts }
let dummy = null;
const shadowBlob = { mesh: null };
let curZoneCol = null; // текущие интерполированные цвета зоны (для плавной смены)

function hexShade(hex, k) {
  const n = (typeof hex === 'number') ? hex : parseInt(String(hex).replace('#', ''), 16);
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = clamp(((n >> 16) & 255) * k), g = clamp(((n >> 8) & 255) * k), b = clamp((n & 255) * k);
  return (r << 16) | (g << 8) | b;
}
function colorNum(hex) { return (typeof hex === 'number') ? hex : parseInt(String(hex).replace('#', ''), 16); }
function stripAlpha(c) {
  const m = /rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(c);
  return m ? 'rgb(' + m[1] + ',' + m[2] + ',' + m[3] + ')' : c;
}
function lerpColorNum(a, b, p) {
  const ca = new THREE.Color(a), cb = new THREE.Color(b);
  return ca.lerp(cb, p);
}

function disposeObject(obj) {
  obj.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    if (n.material) { (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => m.dispose()); }
  });
}

// ── Тоновая (cel-shaded) градация: ступенчатый градиент вместо мыльного Ламберта
let toonGradient = null;
function makeToonGradient() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 1;
  const cx = c.getContext('2d');
  const shades = [80, 150, 205, 255];
  for (let i = 0; i < 4; i++) { cx.fillStyle = 'rgb(' + shades[i] + ',' + shades[i] + ',' + shades[i] + ')'; cx.fillRect(i, 0, 1, 1); }
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter; tex.magFilter = THREE.NearestFilter; tex.generateMipmaps = false;
  return tex;
}
function toonMat(color) { return new THREE.MeshToonMaterial({ color, gradientMap: toonGradient }); }

// ── Жёсткий контур: увеличенный BackSide-двойник каждого меша ──────────────
let outlineMat = null;
function addOutline(mesh, factor) {
  const ol = new THREE.Mesh(mesh.geometry, outlineMat);
  ol.scale.setScalar(factor || 1.12);
  ol.raycast = () => {};
  mesh.add(ol);
  return ol;
}
function addOutlines(root, factor) {
  const meshes = [];
  root.traverse(n => { if (n.isMesh) meshes.push(n); });
  meshes.forEach(m => addOutline(m, factor));
}

function resize3D() {
  if (!renderer) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize3D);

// ── Игрок: группа из примитивов, собирается один раз на выбор персонажа ────
// Читаемый силуэт: плечи заметно шире таза, торс сужается к поясу (конус, а
// не ровная капсула), отдельная шея, кисти и стопы своим объёмом, конечности
// тоньше корпуса. Контур — увеличенный BackSide-двойник на каждом меше.
function buildPlayerModel(key) {
  if (playerModel) { scene.remove(playerModel.group); disposeObject(playerModel.group); }
  const f = FIGHTERS[key];
  const B = f.bulk || 1;
  const torsoColor = colorNum((f.shirtless || f.singlet) ? f.skin : f.top);
  const skinColor = colorNum(f.skin);
  const bottomColor = colorNum(f.bottom);
  const accColor = colorNum(f.acc || f.top);
  const hairColor = colorNum(f.hair || '#241a12');

  const group = new THREE.Group();

  const torsoMat = toonMat(torsoColor);
  const skinMat = toonMat(skinColor);
  const skinMatD = toonMat(hexShade(f.skin, 0.8));
  const bottomMat = toonMat(bottomColor);

  const hipY = 0.62;
  // Верхняя часть тела — отдельная группа с осью вращения на уровне бёдер:
  // так торс+шея+голова наклоняются вместе (подкат/бег), а не расходятся.
  const upperBody = new THREE.Group();
  upperBody.position.set(0, hipY, 0);
  group.add(upperBody);

  // Торс: конус (шире у плеч, уже у пояса) вместо ровной капсулы — даёт V-силуэт.
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.30 * B, 0.20 * B, 0.62, 8), torsoMat);
  torso.position.set(0, 0.33, 0);
  upperBody.add(torso);
  const chestCap = new THREE.Mesh(new THREE.SphereGeometry(0.30 * B, 8, 6, 0, Math.PI * 2, 0, Math.PI * 0.5), torsoMat);
  chestCap.position.set(0, 0.64, 0);
  upperBody.add(chestCap);

  const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.36 * B, 0.22, 0.26), bottomMat);
  pelvis.position.set(0, hipY + 0.02, 0);
  group.add(pelvis);

  // Шея — отдельный объём между плечами и головой, иначе голова «сидит» на торсе
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.10, 0.16, 8), skinMat);
  neck.position.set(0, 0.75, 0);
  upperBody.add(neck);

  const headLocalY = 0.92;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.185, 12, 10), skinMat);
  head.position.set(0, headLocalY, 0.02);
  upperBody.add(head);

  // Причёска/убор — по f.head, цвет f.hair либо f.acc (бандана/повязка)
  let hairMesh = null;
  if (f.head === 'bandana') {
    hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.195, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.6), toonMat(accColor));
  } else if (f.head === 'headband') {
    hairMesh = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.03, 6, 12), toonMat(accColor));
    hairMesh.rotation.x = Math.PI / 2;
  } else {
    hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.195, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.5), toonMat(hairColor));
  }
  hairMesh.position.copy(head.position);
  upperBody.add(hairMesh);

  // Уши борца — крупнее и краснее
  if (f.ears) {
    const earMat = toonMat(0xc98a7a);
    const earGeo = new THREE.SphereGeometry(0.05, 6, 6);
    const earL = new THREE.Mesh(earGeo, earMat); earL.position.set(-0.18, headLocalY, 0);
    const earR = earL.clone(); earR.position.x = 0.18;
    upperBody.add(earL, earR);
  }

  // Пояс пауэрлифтера
  if (f.belt) {
    const belt = new THREE.Mesh(new THREE.BoxGeometry(0.40 * B, 0.09, 0.28), toonMat(accColor));
    belt.position.set(0, hipY + 0.14, 0);
    group.add(belt);
  }

  function makeLimb(isArm, side) {
    const pivot = new THREE.Group();
    const upperLen = isArm ? 0.30 : 0.40;
    const lowerLen = isArm ? 0.26 : 0.38;
    const thickness = (isArm ? 0.075 : 0.10) * B;
    const col = isArm ? skinMat : (side < 0 ? skinMatD : skinMat);
    const jointGeo = new THREE.SphereGeometry(thickness * 1.02, 8, 6);
    const topJoint = new THREE.Mesh(jointGeo, col);
    pivot.add(topJoint);

    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(thickness, upperLen, 2, 6), col);
    upper.position.y = -upperLen / 2 - thickness * 0.35;
    pivot.add(upper);

    const kneePivot = new THREE.Group();
    kneePivot.position.y = -upperLen - thickness * 0.7;
    pivot.add(kneePivot);

    const kneeJoint = new THREE.Mesh(new THREE.SphereGeometry(thickness * 0.86, 8, 6), col);
    kneePivot.add(kneeJoint);

    const lower = new THREE.Mesh(new THREE.CapsuleGeometry(thickness * 0.8, lowerLen, 2, 6), col);
    lower.position.y = -lowerLen / 2 - thickness * 0.3;
    kneePivot.add(lower);

    let extra = null;
    if (!isArm) {
      // Стопа/ботинок — отдельный объём, темнее ноги, с плоской подошвой
      extra = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.09, 0.24), toonMat(side < 0 ? 0x33373f : 0x454a55));
      extra.position.y = -lowerLen - thickness * 0.42;
      kneePivot.add(extra);
      const sole = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 0.26), toonMat(0x1c1e22));
      sole.position.y = -lowerLen - thickness * 0.42 - 0.06;
      kneePivot.add(sole);
    } else {
      // Кисть — отдельная сфера на конце предплечья
      const hand = new THREE.Mesh(new THREE.SphereGeometry(thickness * 1.15, 8, 6), col);
      hand.position.y = -lowerLen - thickness * 0.5;
      kneePivot.add(hand);
      extra = hand;
    }
    return { pivot, kneePivot, upper, lower, shoe: extra };
  }

  const legL = makeLimb(false, -1); legL.pivot.position.set(-0.14 * B, hipY, 0);
  const legR = makeLimb(false, 1); legR.pivot.position.set(0.14 * B, hipY, 0);
  const armL = makeLimb(true, -1); armL.pivot.position.set(-0.34 * B, hipY + 0.68, 0);
  const armR = makeLimb(true, 1); armR.pivot.position.set(0.34 * B, hipY + 0.68, 0);
  group.add(legL.pivot, legR.pivot, armL.pivot, armR.pivot);

  group.scale.setScalar(1);
  group.position.set(0, 0, 0);
  scene.add(group);
  addOutlines(group, 1.1);

  playerModel = { group, upperBody, torso, head, legL, legR, armL, armR, key, B };
}

// ── Препятствия: примитивы вместо ctx-фигур, коллизии не изменились ────────
function buildObstacleMesh(o) {
  const g = new THREE.Group();
  const s = UNIT;
  if (o.kind === 'dumb') {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, o.w * s * 0.7, 8), toonMat(0x8a92a0));
    bar.rotation.z = Math.PI / 2;
    bar.position.y = (o.h * s) * 0.55;
    g.add(bar);
    const plateGeo = new THREE.CylinderGeometry(o.h * s * 0.5, o.h * s * 0.5, 0.12, 12);
    const plateMat = toonMat(0x6b7280);
    const pL = new THREE.Mesh(plateGeo, plateMat); pL.rotation.z = Math.PI / 2; pL.position.set(-o.w * s * 0.32, o.h * s * 0.5, 0);
    const pR = pL.clone(); pR.position.x = o.w * s * 0.32;
    g.add(pL, pR);
  } else if (o.kind === 'kettle') {
    const body = new THREE.Mesh(new THREE.SphereGeometry(o.w * s * 0.5, 10, 8), toonMat(0x4c515e));
    body.position.y = o.w * s * 0.5;
    g.add(body);
    const handle = new THREE.Mesh(new THREE.TorusGeometry(o.w * s * 0.32, 0.035, 6, 10, Math.PI), toonMat(0x4c515e));
    handle.position.y = o.w * s * 0.95;
    handle.rotation.z = Math.PI;
    g.add(handle);
  } else if (o.kind === 'bench') {
    const top = new THREE.Mesh(new THREE.BoxGeometry(o.w * s, 0.1, 0.4), toonMat(0xa6573f));
    top.position.y = o.h * s - 0.05;
    g.add(top);
    const legMat = toonMat(0x5c606c);
    const legGeo = new THREE.BoxGeometry(0.08, o.h * s - 0.1, 0.08);
    const lg1 = new THREE.Mesh(legGeo, legMat); lg1.position.set(-o.w * s * 0.35, (o.h * s - 0.1) / 2, 0);
    const lg2 = lg1.clone(); lg2.position.x = o.w * s * 0.35;
    g.add(lg1, lg2);
  } else if (o.kind === 'rack') {
    const postMat = toonMat(0x5c606c);
    const postH = 1.6;
    const postGeo = new THREE.BoxGeometry(0.08, postH, 0.08);
    const p1 = new THREE.Mesh(postGeo, postMat); p1.position.set(-(o.w * s * 0.5 + 0.35), postH / 2, 0);
    const p2 = p1.clone(); p2.position.x = o.w * s * 0.5 + 0.35;
    g.add(p1, p2);
    const barY = o.gap * s;
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, (o.w + 104) * s, 8), toonMat(0xb7bcc6));
    bar.rotation.z = Math.PI / 2; bar.position.y = barY;
    g.add(bar);
    const capMat = toonMat(0xd4453a);
    const capGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.1, 10);
    const cL = new THREE.Mesh(capGeo, capMat); cL.rotation.z = Math.PI / 2; cL.position.set(-(o.w * s * 0.5 + 0.3), barY, 0);
    const cR = cL.clone(); cR.position.x = o.w * s * 0.5 + 0.3;
    g.add(cL, cR);
    g.userData.barY = barY;
  } else if (o.kind === 'plate') {
    const outer = new THREE.Mesh(new THREE.CylinderGeometry(o.h * s * 0.5, o.h * s * 0.5, 0.14, 16), toonMat(0xd4453a));
    outer.rotation.x = Math.PI / 2;
    g.add(outer);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(o.h * s * 0.36, o.h * s * 0.36, 0.16, 16), toonMat(0x8f2a20));
    inner.rotation.x = Math.PI / 2;
    g.add(inner);
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.18, 10), toonMat(0xf2ede3));
    hole.rotation.x = Math.PI / 2;
    g.add(hole);
    g.position.y = o.h * s * 0.5;
  }
  addOutlines(g, 1.14);
  return g;
}

// ── Частицы: маленькие кубики-искры, короткоживущие меши ────────────────────
const particlePool = [];
function updateParticleMeshes() {
  while (particlePool.length < parts.length) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
    particleGroup.add(m);
    particlePool.push(m);
  }
  for (let i = 0; i < particlePool.length; i++) {
    const m = particlePool[i];
    const p = parts[i];
    if (!p) { m.visible = false; continue; }
    m.visible = true;
    m.position.set(0, Math.max(0.02, toWY(p.y)), toWZ(p.x));
    m.material.color.set(stripAlpha(p.color));
    m.material.opacity = Math.max(0, Math.min(1, p.life * 1.6));
  }
}

// ── Тосты: DOM-текст, координаты как в 2D-версии (экранные пиксели) ─────────
const toastLayer = document.getElementById('toast-layer');
function renderToasts() {
  for (const ts of toasts) {
    if (!ts.el) {
      ts.el = document.createElement('div');
      ts.el.className = 'toast';
      ts.el.style.color = ts.color;
      ts.el.textContent = ts.text;
      toastLayer.appendChild(ts.el);
    }
    ts.el.style.left = Math.max(30, Math.min(W - 30, ts.x)) + 'px';
    ts.el.style.top = ts.y + 'px';
    ts.el.style.opacity = String(Math.max(0, 1 - ts.t / 1.2));
  }
  // убрать DOM-узлы тостов, которых уже нет в массиве
  const alive = new Set(toasts.map(ts => ts.el));
  [...toastLayer.children].forEach(el => { if (!alive.has(el)) el.remove(); });
}

// ── HUD (DOM) ────────────────────────────────────────────────────────────────
const hudDist = document.getElementById('hud-dist');
const hudBest = document.getElementById('hud-best');
const hudZone = document.getElementById('hud-zone');
const hudScore = document.getElementById('hud-score');
const hudPowers = document.getElementById('hud-powers');
function renderHud() {
  hudDist.textContent = fmt(dist) + ' м';
  hudBest.textContent = 'рекорд ' + fmt(Math.max(best, dist)) + ' м';
  hudZone.textContent = ZONES[zoneIndex()].name;
  const multNow = mult();
  hudScore.textContent = '🥤 ' + fmt(score) + (multNow > 1 ? '  ×' + fmt(multNow) : '');
  let html = '';
  if (P.rageT > 0) html += powerBarHtml('ЯРОСТЬ', '#ff5a36', P.rageT / 4.2);
  if (P.magnetT > 0) html += powerBarHtml('МАГНИТ', '#67c26a', P.magnetT / 6);
  if (P.shield) html += '<div class="hud-power" style="color:#7ea8ff">ЩИТ</div>';
  hudPowers.innerHTML = html;
}
function powerBarHtml(label, color, frac) {
  const pct = Math.max(0, Math.min(1, frac)) * 100;
  return '<div class="hud-power" style="color:' + color + '">' + label +
    '</div><div class="hud-power-bar"><i style="width:' + pct + '%;background:' + color + '"></i></div>';
}

// ── Смена биома: цвета пола/стен/декора/тумана плавно интерполируются ──────
function applyZoneColors() {
  const zi = zoneIndex(), zb = zoneBlend();
  const z = ZONES[zi], zn = ZONES[(zi + 1) % ZONES.length];
  const fog = lerpColorNum(z.fog, zn.fog, zb);
  const floor = lerpColorNum(z.floor, zn.floor, zb);
  const track = lerpColorNum(z.track, zn.track, zb);
  const wall = lerpColorNum(z.wall, zn.wall, zb);
  const prop = lerpColorNum(z.prop, zn.prop, zb);
  scene.fog.color.copy(fog);
  scene.background.copy(fog);
  renderer.setClearColor(fog);
  floorMesh.material.color.copy(floor);
  trackMesh.material.color.copy(track);
  wallL.material.color.copy(wall);
  wallR.material.color.copy(wall);
  propMesh.material.color.copy(prop);
  buildingMesh.visible = (z.kind === 'street' || zn.kind === 'street');
  propMesh.visible = !(z.kind === 'street' && zb > 0.5);
  propBarMesh.visible = propMesh.visible;

  // Лампы: тёплые в подвале/улице, двухцветный неон в неон-зале
  lampMeshA.material.color.set(z.lamp);
  lampMeshB.material.color.set(z.kind === 'neon' ? (z.lamp2 || z.lamp) : z.lamp);
}

// Обёртка над модулем: даёт «бегущую дорожку» позиций от -range до 0,
// зациклено по dist — общая логика для декора и полос разметки.
function scrollZ(row, spacing, halfCount, speed) {
  const range = spacing * halfCount;
  const raw = row * spacing - (dist * UNIT * speed) % range;
  return -(((raw % range) + range) % range);
}

// ── Декор по бокам (стойки/лампы/здания) — позиции считаются из dist ───────
function updateDecor() {
  const PSPACING = 2.0, PN = propMesh.count, PHALF = PN / 2;
  for (let i = 0; i < PN; i++) {
    const side = (i % 2 === 0) ? -1 : 1;
    const row = Math.floor(i / 2);
    const z = scrollZ(row, PSPACING, PHALF, 0.95);
    dummy.position.set(side * 3.6, 0.95, z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    propMesh.setMatrixAt(i, dummy.matrix);
    dummy.position.set(side * 3.6, 1.95, z);
    dummy.updateMatrix();
    propBarMesh.setMatrixAt(i, dummy.matrix);
  }
  propMesh.instanceMatrix.needsUpdate = true;
  propBarMesh.instanceMatrix.needsUpdate = true;

  const BSPACING = 3.4, BN = buildingMesh.count, BHALF = BN / 2;
  for (let i = 0; i < BN; i++) {
    const side = (i % 2 === 0) ? -1 : 1;
    const row = Math.floor(i / 2);
    const h = 1.6 + ((row * 7) % 5) * 0.85;
    const z = scrollZ(row, BSPACING, BHALF, 0.6);
    dummy.position.set(side * 5.2, h / 2, z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    buildingMesh.setMatrixAt(i, dummy.matrix);
  }
  buildingMesh.instanceMatrix.needsUpdate = true;

  const LSPACING = 4.2, LN = lampMeshA.count + lampMeshB.count, LHALF = LN / 2;
  for (let i = 0; i < LN; i++) {
    const side = (i % 2 === 0) ? -1 : 1;
    const row = Math.floor(i / 2);
    const z = scrollZ(row, LSPACING, LHALF, 0.95);
    const mesh = (i % 2 === 0) ? lampMeshA : lampMeshB;
    const idx = Math.floor(i / 2);
    dummy.position.set(side * 4.6, 2.9, z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(idx, dummy.matrix);
    dummy.position.set(side * 4.6, 1.55, z);
    dummy.updateMatrix();
    lampPostMesh.setMatrixAt(i, dummy.matrix);
  }
  lampMeshA.instanceMatrix.needsUpdate = true;
  lampMeshB.instanceMatrix.needsUpdate = true;
  lampPostMesh.instanceMatrix.needsUpdate = true;
}

// ── Полосы разметки на дорожке — летят на игрока, дают ощущение скорости ───
function updateFloorStripes() {
  const SPACING = 3.0, N = stripeMesh.count, HALF = N;
  for (let i = 0; i < N; i++) {
    const z = scrollZ(i, SPACING, HALF, 1.6);
    dummy.position.set(0, 0.012, z);
    dummy.rotation.set(-Math.PI / 2, 0, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    stripeMesh.setMatrixAt(i, dummy.matrix);
  }
  stripeMesh.instanceMatrix.needsUpdate = true;
}

// ── Собираемые предметы — InstancedMesh на тип, скрываем лишние ────────────
function updateItemMeshes() {
  const buckets = { shaker: [], bar: [], creatine: [], preworkout: [], gainer: [] };
  for (const it of items) buckets[it.type].push(it);
  for (const type in itemMeshes) {
    const mesh = itemMeshes[type];
    const list = buckets[type];
    for (let i = 0; i < mesh.count; i++) {
      const it = list[i];
      if (!it) { dummy.position.set(0, -50, 0); dummy.scale.setScalar(0.0001); }
      else {
        const bob = Math.sin(it.t * 4) * 0.04;
        const pulse = ITEM_TYPES[type].power ? 1 + 0.15 * Math.sin(it.t * 6) : 1;
        dummy.position.set(0, Math.max(0.05, toWY(it.y) + bob), toWZ(it.x));
        dummy.rotation.set(0, it.t * 1.4, type === 'bar' ? -0.2 : 0);
        dummy.scale.setScalar(pulse);
      }
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
}

// ── Препятствия: позиционирование существующих 3D-групп по игровым x/y ─────
function updateObstacleMeshes() {
  for (const o of obstacles) {
    if (!o.mesh) continue;
    o.mesh.position.set(0, 0, toWZ(o.x + (o.w || 0) / 2));
    if (o.kind !== 'rack' && o.kind !== 'plate') o.mesh.position.z = toWZ(o.x);
    if (o.kind === 'plate') o.mesh.rotation.z = o.rot;
  }
}

// ── Игрок: процедурная анимация — фаза бега, прыжок, подкат, приземление ────
let prevOnGround = true, squash = 0;
function updatePlayerPose(dt) {
  if (!playerModel) return;
  const { group, upperBody, head, legL, legR, armL, armR, B } = playerModel;
  const sliding = P.slideT > 0;
  const airborne = !P.onGround;

  group.position.set(0, Math.max(0, toWY(P.y) - toWY(GROUND())), 0);
  // приземление: squash-stretch
  if (P.onGround && !prevOnGround) squash = 1;
  prevOnGround = P.onGround;
  if (squash > 0) squash = Math.max(0, squash - dt * 4);
  const sq = 1 - squash * 0.16;
  group.scale.set(1 + squash * 0.12, sq, 1 + squash * 0.12);

  if (sliding) {
    upperBody.rotation.x = -1.15;
    head.rotation.x = 0.5;
    legL.pivot.rotation.x = -0.9; legR.pivot.rotation.x = -1.3;
    legL.kneePivot.rotation.x = 0.2; legR.kneePivot.rotation.x = 0.1;
    armL.pivot.rotation.x = -1.6; armR.pivot.rotation.x = 1.0;
    armL.kneePivot.rotation.x = 0.3; armR.kneePivot.rotation.x = 0.3;
  } else if (airborne) {
    upperBody.rotation.x = -0.12;
    head.rotation.x = 0;
    const tuck = P.vy < 0 ? 0.9 : 0.5;
    legL.pivot.rotation.x = tuck; legR.pivot.rotation.x = tuck * 0.7;
    legL.kneePivot.rotation.x = -1.5; legR.kneePivot.rotation.x = -1.3;
    armL.pivot.rotation.x = -0.7; armR.pivot.rotation.x = -1.0;
    armL.kneePivot.rotation.x = -0.4; armR.kneePivot.rotation.x = -0.4;
  } else {
    const s = Math.sin(P.runPhase * 14);
    upperBody.rotation.x = 0.06 + Math.abs(s) * 0.02;
    head.rotation.x = 0.02;
    legL.pivot.rotation.x = s * 0.9; legR.pivot.rotation.x = -s * 0.9;
    legL.kneePivot.rotation.x = Math.max(0, -s) * 1.3; legR.kneePivot.rotation.x = Math.max(0, s) * 1.3;
    armL.pivot.rotation.x = -s * 0.7; armR.pivot.rotation.x = s * 0.7;
    armL.kneePivot.rotation.x = Math.max(0, s) * 0.6; armR.kneePivot.rotation.x = Math.max(0, -s) * 0.6;
  }

  if (P.rageT > 0) {
    const wob = Math.sin(t * 24) * 0.03;
    group.rotation.z = wob;
  } else {
    group.rotation.z *= 0.8;
  }

  shadowBlob.mesh.position.z = toWZ(P.x); // всегда 0, но держим на всякий случай
  shadowBlob.mesh.position.set(0, 0.02, 0);
  const airHeight = Math.max(0, toWY(P.y) - toWY(GROUND()));
  const shrink = Math.max(0.35, 1 - airHeight * 0.6);
  shadowBlob.mesh.scale.set(shrink, shrink, shrink);
  shadowBlob.mesh.material.opacity = 0.35 * shrink;
}

// ── Камера: далеко и высоко позади игрока, наклонена вниз по ходу движения —
// фигура держит ~1/6 высоты экрана, вперёд видно достаточно, чтобы читать
// препятствия заранее, а не встречать их под ногами.
function updateCamera(dt) {
  const baseY = 4.3, baseZ = 13.5;
  let shakeX = 0, shakeY = 0;
  if (shakeT > 0) { shakeX = rnd(-0.12, 0.12) * shakeT; shakeY = rnd(-0.08, 0.08) * shakeT; }
  const jumpLift = playerModel ? Math.max(0, toWY(P.y) - toWY(GROUND())) * 0.18 : 0;
  camera.position.set(shakeX, baseY + jumpLift + shakeY, baseZ);
  camera.lookAt(0, 0.85 + jumpLift * 0.4, -10);
}

function renderRageOverlay() {
  const el = document.getElementById('rage-overlay');
  if (P.rageT > 0) {
    el.classList.add('active');
    el.style.background = 'rgba(255,90,54,' + (0.10 + 0.06 * Math.sin(t * 20)) + ')';
  } else {
    el.classList.remove('active');
  }
}

function render3D(dt) {
  if (!cv.classList.contains('active') || !renderer) return;
  applyZoneColors();
  updateDecor();
  updateFloorStripes();
  updateObstacleMeshes();
  updateItemMeshes();
  updateParticleMeshes();
  updatePlayerPose(dt);
  updateCamera(dt);
  renderToasts();
  renderHud();
  renderRageOverlay();
  renderer.render(scene, camera);
}

// ── ИНИЦИАЛИЗАЦИЯ: ждём THREE (основной путь или запасной путь) и WebGL ─────
function webglAvailable() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}
function showFatalError() {
  document.getElementById('error-text').textContent =
    'Не смог поднять зал. Проверь связь и открой игру заново.';
  showScreen('screen-error');
}
function boot() {
  if (!window.THREE) { showFatalError(); return; }
  if (!webglAvailable()) { showFatalError(); return; }
  try {
    resize3D0();
    initThree();
  } catch (e) {
    console.error('[game] init error:', e);
    showFatalError();
    return;
  }
  resetGame();
  showScreen('screen-select');
  last = performance.now();
  requestAnimationFrame(frame);
}
function resize3D0() { W = window.innerWidth; H = window.innerHeight; }

let bootTries = 0;
function waitForThree() {
  if (window.THREE) { boot(); return; }
  bootTries += 1;
  if (bootTries > 100) { showFatalError(); return; } // ~10с — библиотека не подтянулась
  setTimeout(waitForThree, 100);
}

// ── ЦИКЛ ────────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt);
  render3D(dt);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });

waitForThree();
</script>
